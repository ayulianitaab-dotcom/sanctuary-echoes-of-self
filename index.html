    const meta = SAN.save.slotMeta();
    const el = UI.panel('saves', 'Save Slots',
      `<div class="save-slots">${meta.map((m) => `<div class="save-slot" data-slot="${m.slot}">
        <div class="save-slot-head">Slot ${m.slot}</div>
        ${m.empty ? '<div class="save-slot-empty">Empty</div>' : `<div class="save-slot-name">${U.esc(m.name)}</div>
          <div class="save-slot-meta">${U.SEASONS[m.season]} ${m.day}, Year ${m.year} · ${m.money} coins</div>
          <div class="save-slot-meta">${m.playtime ? Math.round(m.playtime / 60) + ' min played' : ''}</div>`}
        <div class="save-slot-actions">
          <button class="btn btn-small btn-primary" data-act="save">Save here</button>
          ${!m.empty ? '<button class="btn btn-small" data-act="load">Load</button>' : ''}
          ${!m.empty ? '<button class="btn btn-small btn-ghost" data-act="del">Delete</button>' : ''}
        </div>
      </div>`).join('')}</div>
      <p class="fineprint">Saving overwrites the slot. The game also autosaves regularly.</p>`,
      { className: 'medium-panel' });
    el.querySelectorAll('.save-slot').forEach((card) => {
      const slot = parseInt(card.getAttribute('data-slot'), 10);
      card.querySelectorAll('[data-act]').forEach((b) => {
        b.addEventListener('click', () => {
          const act = b.getAttribute('data-act');
          if (act === 'save') {
            SAN.save.write(slot);
            UI.refreshPanel('saves');
          } else if (act === 'load') {
            const snap = SAN.save.read(slot);
            if (!snap) return;
            UI.closeAll();
            SAN.state.apply(snap);
            SUN();
            UI.toast('Loaded slot ' + slot + '.', 'save');
          } else if (act === 'del') {
            UI.confirm('Delete slot ' + slot + '?', 'This removes that save permanently.', () => {
              SAN.save.clear(slot); UI.refreshPanel('saves');
            });
          }
        });
      });
    });
  };

  function SUN() {
    const S_ = S();
    SAN.ui.initHUDForState && SAN.ui.initHUDForState();
    SAN.world.load(S_.player.area, S_.player.x, S_.player.y);
    SAN.cat.syncFromState();
    SAN.ui.refreshHUD();
    SAN.audio.playMusic(SAN.world.area ? SAN.world.area.music : 'village');
    SAN.progression.checkUnlocks();
  }

  /* =========================================================
     PAUSE
     ========================================================= */
  P.pause = function () {
    const el = UI.panel('pause', 'Sanctuary', `
      <div class="pause-menu">
        <p class="pause-sub">${SAN.time.dateLabel()} · ${U.fmtTime(S().time.minutes)} · ${SAN.world.area ? SAN.world.area.name : ''}</p>
        <div class="pause-grid">
          <button class="btn btn-primary" data-p="resume">Resume</button>
          <button class="btn" data-p="journal">Journal</button>
          <button class="btn" data-p="inventory">Satchel</button>
          <button class="btn" data-p="quests">Quests</button>
          <button class="btn" data-p="map">Map</button>
          <button class="btn" data-p="relations">People</button>
          <button class="btn" data-p="memories">Memory Vault</button>
          <button class="btn" data-p="collection">Collections</button>
          <button class="btn" data-p="photos">Photos</button>
          <button class="btn" data-p="decorate">Decorate</button>
          <button class="btn" data-p="saves">Save / Load</button>
          <button class="btn" data-p="settings">Settings</button>
          <button class="btn btn-ghost" data-p="title">Quit to title</button>
        </div>
        <p class="fineprint">Nothing here punishes you for leaving. The village waits kindly.</p>
      </div>`, { className: 'pause-panel' });
    el.querySelectorAll('[data-p]').forEach((b) => {
      b.addEventListener('click', () => {
        const p = b.getAttribute('data-p');
        if (p === 'resume') { UI.closeAll(); return; }
        if (p === 'title') {
          UI.confirm('Return to the title screen?', 'Your current progress stays in its slot.', () => {
            SAN.save.autosave(true);
            UI.closeAll();
            SAN.screens.showTitle();
          });
          return;
        }
        UI.closePanel('pause');
        UI.openPanel(p);
      });
    });
  };

  /* =========================================================
     HISTORY
     ========================================================= */
  P.history = function () {
    const el = UI.panel('history', 'Dialogue History',
      `<div class="history-list">${UI.history.length ? UI.history.slice(0, 60).map((h) => `<div class="history-row">
        <div class="history-name">${U.esc(h.name)}</div><div class="history-text">${U.esc(h.text)}</div></div>`).join('') : '<div class="empty-note">Nothing said yet.</div>'}</div>`,
      { className: 'medium-panel' });
  };

  /* =========================================================
     CAT ADOPTION
     ========================================================= */
  P.catadopt = function () {
    let color = SAN.state.CAT_COLORS[0].id;
    const el = UI.panel('catadopt', 'A Small Warm Thing', `
      <p class="panel-intro">The cat sits down and looks at you. It has already decided something.</p>
      <div class="cat-adopt-preview" id="cat-preview">🐈</div>
      <label class="field-label">Their name</label>
      <input class="text-input" id="cat-name" maxlength="16" value="Mochi">
      <label class="field-label">Their coat</label>
      <div class="cat-color-row" id="cat-colors">${SAN.state.CAT_COLORS.map((c, i) => `<button class="cat-swatch ${i === 0 ? 'active' : ''}" data-color="${c.id}" style="--c:${c.hex}" title="${c.name}"></button>`).join('')}</div>
      <div class="journal-actions">
        <button class="btn btn-primary" id="cat-adopt">Adopt them</button>
      </div>
      <p class="fineprint">They will follow you, sleep in sunbeams, and occasionally bring you something mildly disgusting and very precious.</p>`,
      { className: 'small-panel', noClose: true });
    const preview = el.querySelector('#cat-preview');
    function paint() {
      const c = SAN.state.CAT_COLORS.find((x) => x.id === color);
      preview.style.color = c.hex;
      preview.textContent = '🐈';
    }
    el.querySelectorAll('[data-color]').forEach((b) => {
      b.addEventListener('click', () => {
        color = b.getAttribute('data-color');
        el.querySelectorAll('[data-color]').forEach((x) => x.classList.toggle('active', x === b));
        paint();
      });
    });
    el.querySelector('#cat-adopt').addEventListener('click', () => {
      const name = el.querySelector('#cat-name').value.trim() || 'Mochi';
      const c = SAN.state.CAT_COLORS.find((x) => x.id === color);
      const S_ = S();
      S_.cat.adopted = true;
      S_.cat.name = name;
      S_.cat.color = c.id;
      S_.cat.colorHex = c.hex;
      S_.cat.trust = 12;
      SAN.cat.syncFromState();
      SAN.audio.sfx('purr');
      UI.closePanel('catadopt');
      UI.dialogue({
        pages: [
          { speaker: 'narrator', text: name + ' walks into your cottage like they have been paying rent all along.' },
          { speaker: 'narrator', text: 'You have a cat now. This is a fact about your life.' },
        ],
      });
      UI.refreshHUD();
    });
    paint();
  };

  /* =========================================================
     WARDROBE / CUSTOMISATION
     ========================================================= */
  P.customize = function () {
    const p = S().player;
    const el = UI.panel('customize', 'Wardrobe', `
      <div class="creator-body">
        <div class="creator-preview">
          <div class="creator-portrait" id="wd-portrait"></div>
          <div class="creator-name-display" id="wd-name">${U.esc(p.name)}</div>
        </div>
        <div class="creator-options">
          <label class="field-label">Name</label>
          <input class="text-input" id="wd-input-name" maxlength="16" value="${U.esc(p.name)}">
          <label class="field-label">Presentation</label>
          <div class="chip-row" id="wd-gender"></div>
          <label class="field-label">Hair</label>
          <div class="chip-row" id="wd-hair"></div>
          <label class="field-label">Hair colour</label>
          <div class="swatch-row" id="wd-haircolor"></div>
          <label class="field-label">Eyes</label>
          <div class="swatch-row" id="wd-eyes"></div>
          <label class="field-label">Skin</label>
          <div class="swatch-row" id="wd-skin"></div>
          <label class="field-label">Outfit</label>
          <div class="chip-row" id="wd-outfit"></div>
          <label class="field-label">Accessory</label>
          <div class="chip-row" id="wd-acc"></div>
        </div>
      </div>
      <p class="fineprint">Your portrait and sprite update straight away. Nobody in the village will comment on the change, because that is how good villages work.</p>`,
      { wide: true });

    const portrait = el.querySelector('#wd-portrait');
    function apply() {
      p.colors = SAN.state.playerColors(p);
      portrait.innerHTML = SAN.render.portrait('player', { player: p });
      el.querySelector('#wd-name').textContent = p.name;
      el.querySelector('#wd-input-name').value = p.name;
      SAN.save.autosave();
    }
    function chips(sel, list, key) {
      const box = el.querySelector(sel);
      box.innerHTML = '';
      list.forEach((item) => {
        const b = document.createElement('button');
        b.className = 'chip' + (p[key] === item.id ? ' active' : '');
        b.textContent = item.name;
        b.addEventListener('click', () => { p[key] = item.id; chips(sel, list, key); apply(); });
        box.appendChild(b);
      });
    }
    function swatches(sel, list, key) {
      const box = el.querySelector(sel);
      box.innerHTML = '';
      list.forEach((item) => {
        const b = document.createElement('button');
        b.className = 'swatch' + (p[key] === item.hex ? ' active' : '');
        b.style.background = item.hex;
        b.title = item.name;
        b.addEventListener('click', () => { p[key] = item.hex; swatches(sel, list, key); apply(); });
        box.appendChild(b);
      });
    }
    chips('#wd-gender', [{ id: 'feminine', name: 'Feminine' }, { id: 'masculine', name: 'Masculine' }, { id: 'neutral', name: 'Androgynous' }], 'gender');
    chips('#wd-hair', SAN.state.HAIRSTYLES, 'hair');
    swatches('#wd-haircolor', SAN.state.HAIRS, 'hairColor');
    swatches('#wd-eyes', SAN.state.EYES, 'eyeColor');
    swatches('#wd-skin', SAN.state.SKINS, 'skinColor');
    chips('#wd-outfit', SAN.state.OUTFITS, 'outfit');
    chips('#wd-acc', SAN.state.ACCESSORIES, 'accessory');
    el.querySelector('#wd-input-name').addEventListener('input', (e) => {
      p.name = (e.target.value || 'Elara').slice(0, 16);
      el.querySelector('#wd-name').textContent = p.name;
    });
    apply();
  };

  P.about = function () {
    UI.panel('about', 'About Sanctuary', `
      <p><b>Sanctuary: Echoes of Self</b> is a cozy RPG about a village where time moves gently.</p>
      <p>Everything you see is drawn and generated in code — no image files, no network calls, no accounts. It runs entirely offline once loaded.</p>
      <p>Journal reflections are produced by a small local engine that looks for themes and offers gentle suggestions. It is not therapy and never diagnoses anything.</p>
      <p class="fineprint">Built with vanilla JavaScript, Canvas 2D and WebAudio.</p>`,
      { className: 'small-panel' });
  };
})();
</script>
<script>
/* Sanctuary — title screen, onboarding cinematic, character creation */
(function () {
  const SC = (SAN.screens = {});
  const U = SAN.util;
  const S = () => SAN.state.S;

  SC.showTitle = function () {
    SAN.ui.titleActive = true;
    SAN.ui.closeAll();
    const hud = document.getElementById('hud');
    if (hud) hud.classList.add('hidden');
    const dock = document.getElementById('dock');
    if (dock) dock.classList.add('hidden');
    const touch = document.getElementById('touch-ui');
    if (touch) touch.classList.add('hidden');
    const el = document.getElementById('title-screen');
    el.classList.remove('hidden');
    const hasSave = SAN.save.hasAny();
    el.innerHTML = `
      <div class="title-bg">
        <div class="title-glow"></div>
        <div class="title-stars">${Array.from({ length: 26 }).map((_, i) => `<i style="left:${(i * 37) % 100}%;top:${(i * 53) % 70}%;animation-delay:${i * 0.21}s"></i>`).join('')}</div>
        <div class="title-hills"><i></i><i></i><i></i></div>
        <div class="title-house"><div class="th-roof"></div><div class="th-body"><span></span></div></div>
      </div>
      <div class="title-content">
        <div class="title-kicker">a cozy RPG about coming back to yourself</div>
        <h1 class="title-logo">Sanctuary</h1>
        <div class="title-sub">Echoes of Self</div>
        <div class="title-flowers">✿ ❀ ✿</div>
        <div class="title-menu">
          <button class="title-btn primary" id="t-new">New Game</button>
          <button class="title-btn" id="t-continue" ${hasSave ? '' : 'disabled'}>Continue</button>
          <button class="title-btn" id="t-slots" ${hasSave ? '' : 'disabled'}>Save Slots</button>
          <button class="title-btn" id="t-settings">Settings</button>
          <button class="title-btn" id="t-about">About</button>
          <button class="title-btn ghost" id="t-quit">Quit</button>
        </div>
        <div class="title-foot">WASD move · E interact · ESC pause · plays fully offline</div>
      </div>`;
    SAN.audio.init();
    SAN.audio.playMusic('title');
    SAN.audio.ambient('birds');

    el.querySelector('#t-new').addEventListener('click', () => { SAN.audio.sfx('open'); SC.showCustomizer(); });
    const cont = el.querySelector('#t-continue');
    cont.addEventListener('click', () => {
      const meta = SAN.save.slotMeta().filter((m) => !m.empty).sort((a, b) => b.savedAt - a.savedAt)[0];
      if (!meta) return;
      SC.loadSlot(meta.slot);
    });
    el.querySelector('#t-slots').addEventListener('click', () => SC.showSlots());
    el.querySelector('#t-settings').addEventListener('click', () => SC.showTitleSettings());
    el.querySelector('#t-about').addEventListener('click', () => {
      SAN.ui.panelStack = [];
      SAN.ui.titleActive = false;
      SAN.ui.PANELS.about();
      SAN.ui.titleActive = true;
    });
    el.querySelector('#t-quit').addEventListener('click', () => {
      el.innerHTML = `<div class="title-quit">
        <h2>Thank you for visiting.</h2>
        <p>Sanctuary will be here whenever you come back. You can close this tab now.</p>
        <button class="title-btn" id="t-back">Stay a while longer</button>
      </div>`;
      el.querySelector('#t-back').addEventListener('click', () => SC.showTitle());
    });
  };

  SC.showSlots = function () {
    const meta = SAN.save.slotMeta();
    const el = document.getElementById('title-screen');
    el.classList.add('title-subpanel');
    const wrap = document.createElement('div');
    wrap.className = 'title-modal';
    wrap.innerHTML = `<h2>Save Slots</h2><div class="title-slots">${meta.map((m) => `
      <div class="title-slot ${m.empty ? 'empty' : ''}">
        <div class="ts-head">Slot ${m.slot}</div>
        ${m.empty ? '<div class="ts-empty">Empty — a good place for a new story.</div>' : `
          <div class="ts-name">${U.esc(m.name)}${m.catName ? ' & ' + U.esc(m.catName) : ''}</div>
          <div class="ts-meta">${U.SEASONS[m.season]} ${m.day}, Year ${m.year}</div>
          <div class="ts-meta">${m.money} coins · ${Math.floor((m.playtime || 0) / 60)} min</div>
          <div class="ts-actions">
            <button class="btn btn-small btn-primary" data-load="${m.slot}">Continue</button>
            <button class="btn btn-small btn-ghost" data-del="${m.slot}">Delete</button>
          </div>`}
      </div>`).join('')}</div>
      <button class="title-btn" id="ts-close">Back</button>`;
    el.appendChild(wrap);
    wrap.querySelector('#ts-close').addEventListener('click', () => { wrap.remove(); el.classList.remove('title-subpanel'); });
    wrap.querySelectorAll('[data-load]').forEach((b) => b.addEventListener('click', () => SC.loadSlot(parseInt(b.getAttribute('data-load'), 10))));
    wrap.querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', () => {
      SAN.save.clear(parseInt(b.getAttribute('data-del'), 10));
      wrap.remove(); el.classList.remove('title-subpanel'); SC.showTitle();
    }));
  };

  SC.showTitleSettings = function () {
    const st = SAN.save.loadSettings() || { musicVol: 0.5, sfxVol: 0.7, ambVol: 0.5, textSpeed: 1, showHints: true, reduceMotion: false, autosave: true, useAI: false };
    const el = document.getElementById('title-screen');
    const wrap = document.createElement('div');
    wrap.className = 'title-modal';
    wrap.innerHTML = `<h2>Settings</h2>
      <label class="slider-row"><span>Music</span><input type="range" id="ts-music" min="0" max="1" step="0.05" value="${st.musicVol}"><b>${Math.round(st.musicVol * 100)}%</b></label>
      <label class="slider-row"><span>Effects</span><input type="range" id="ts-sfx" min="0" max="1" step="0.05" value="${st.sfxVol}"><b>${Math.round(st.sfxVol * 100)}%</b></label>
      <label class="slider-row"><span>Ambience</span><input type="range" id="ts-amb" min="0" max="1" step="0.05" value="${st.ambVol}"><b>${Math.round(st.ambVol * 100)}%</b></label>
      <label class="slider-row"><span>Text speed</span><input type="range" id="ts-speed" min="0.5" max="2.5" step="0.25" value="${st.textSpeed}"><b>${st.textSpeed}×</b></label>
      <label class="toggle-row"><span>Reduce motion</span><input type="checkbox" id="ts-motion" ${st.reduceMotion ? 'checked' : ''}></label>
      <p class="fineprint">All audio is generated in the browser. No files are downloaded.</p>
      <button class="title-btn" id="ts-close">Back</button>`;
    el.appendChild(wrap);
    const save = () => { SAN.save.saveSettings(st); SAN.audio.applySettings(st); document.body.classList.toggle('reduce-motion', !!st.reduceMotion); };
    const bind = (id, key, cb) => {
      const input = wrap.querySelector('#' + id);
      input.addEventListener('input', () => {
        st[key] = input.type === 'checkbox' ? input.checked : parseFloat(input.value);
        if (input.type === 'range') input.parentElement.querySelector('b').textContent = (key === 'textSpeed' ? st[key] + '×' : Math.round(st[key] * 100) + '%');
        save();
      });
    };
    bind('ts-music', 'musicVol'); bind('ts-sfx', 'sfxVol'); bind('ts-amb', 'ambVol'); bind('ts-speed', 'textSpeed'); bind('ts-motion', 'reduceMotion');
    wrap.querySelector('#ts-close').addEventListener('click', () => { wrap.remove(); });
  };

  /* ---------------- character creation ---------------- */
  SC.showCustomizer = function () {
    const el = document.getElementById('title-screen');
    const custom = SAN.state.defaultCustom();
    el.classList.add('title-subpanel');
    const wrap = document.createElement('div');
    wrap.className = 'title-modal wide creator';
    wrap.innerHTML = `
      <div class="creator-head">
        <h2>Who are you, when no one needs anything from you?</h2>
        <p class="fineprint">You can change all of this later at the wardrobe in your cottage.</p>
      </div>
      <div class="creator-body">
        <div class="creator-preview">
          <div class="creator-portrait" id="creator-portrait"></div>
          <div class="creator-name-display" id="creator-name-display">Elara</div>
        </div>
        <div class="creator-options">
          <label class="field-label">Name</label>
          <input class="text-input" id="cr-name" maxlength="16" value="${U.esc(custom.name)}">
          <label class="field-label">Presentation</label>
          <div class="chip-row" id="cr-gender"></div>
          <label class="field-label">Hair</label>
          <div class="chip-row" id="cr-hairstyle"></div>
          <label class="field-label">Hair colour</label>
          <div class="swatch-row" id="cr-haircolor"></div>
          <label class="field-label">Eyes</label>
          <div class="swatch-row" id="cr-eyes"></div>
          <label class="field-label">Skin</label>
          <div class="swatch-row" id="cr-skin"></div>
          <label class="field-label">Outfit</label>
          <div class="chip-row" id="cr-outfit"></div>
          <label class="field-label">Accessory</label>
          <div class="chip-row" id="cr-acc"></div>
        </div>
      </div>
      <div class="creator-actions">
        <button class="btn btn-ghost" id="cr-random">Surprise me</button>
        <button class="btn btn-ghost" id="cr-back">Back</button>
        <button class="btn btn-primary" id="cr-start">Begin</button>
      </div>`;
    el.appendChild(wrap);
    const portrait = wrap.querySelector('#creator-portrait');
    const nameDisplay = wrap.querySelector('#creator-name-display');

    function paint() {
      const full = Object.assign({}, custom, { colors: SAN.state.playerColors(custom) });
      portrait.innerHTML = SAN.render.portrait('player', { player: full });
      nameDisplay.textContent = custom.name || 'Elara';
    }
    function chips(containerId, list, key, labelKey) {
      const box = wrap.querySelector(containerId);
      box.innerHTML = '';
      list.forEach((item) => {
        const b = document.createElement('button');
        b.className = 'chip' + (custom[key] === item.id ? ' active' : '');
        b.textContent = item[labelKey || 'name'];
        b.addEventListener('click', () => { custom[key] = item.id; chips(containerId, list, key, labelKey); paint(); });
        box.appendChild(b);
      });
    }
    function swatches(containerId, list, key) {
      const box = wrap.querySelector(containerId);
      box.innerHTML = '';
      list.forEach((item) => {
        const b = document.createElement('button');
        b.className = 'swatch' + (custom[key] === item.hex ? ' active' : '');
        b.style.background = item.hex;
        b.title = item.name;
        b.addEventListener('click', () => { custom[key] = item.hex; swatches(containerId, list, key); paint(); });
        box.appendChild(b);
      });
    }
    chips('#cr-gender', [{ id: 'feminine', name: 'Feminine' }, { id: 'masculine', name: 'Masculine' }, { id: 'neutral', name: 'Androgynous' }], 'gender');
    chips('#cr-hairstyle', SAN.state.HAIRSTYLES, 'hair');
    swatches('#cr-haircolor', SAN.state.HAIRS, 'hairColor');
    swatches('#cr-eyes', SAN.state.EYES, 'eyeColor');
    swatches('#cr-skin', SAN.state.SKINS, 'skinColor');
    chips('#cr-outfit', SAN.state.OUTFITS, 'outfit');
    chips('#cr-acc', SAN.state.ACCESSORIES, 'accessory');

    wrap.querySelector('#cr-name').addEventListener('input', (e) => { custom.name = e.target.value; nameDisplay.textContent = custom.name || 'Elara'; });
    wrap.querySelector('#cr-random').addEventListener('click', () => {
      custom.hair = U.pick(SAN.state.HAIRSTYLES).id;
      custom.hairColor = U.pick(SAN.state.HAIRS).hex;
      custom.eyeColor = U.pick(SAN.state.EYES).hex;
      custom.skinColor = U.pick(SAN.state.SKINS).hex;
      custom.outfit = U.pick(SAN.state.OUTFITS).id;
      custom.accessory = U.pick(SAN.state.ACCESSORIES).id;
      chips('#cr-hairstyle', SAN.state.HAIRSTYLES, 'hair');
      swatches('#cr-haircolor', SAN.state.HAIRS, 'hairColor');
      swatches('#cr-eyes', SAN.state.EYES, 'eyeColor');
      swatches('#cr-skin', SAN.state.SKINS, 'skinColor');
      chips('#cr-outfit', SAN.state.OUTFITS, 'outfit');
      chips('#cr-acc', SAN.state.ACCESSORIES, 'accessory');
      paint();
    });
    wrap.querySelector('#cr-back').addEventListener('click', () => { wrap.remove(); el.classList.remove('title-subpanel'); SC.showTitle(); });
    wrap.querySelector('#cr-start').addEventListener('click', () => {
      custom.name = (wrap.querySelector('#cr-name').value || 'Elara').trim().slice(0, 16) || 'Elara';
      wrap.remove();
      el.classList.remove('title-subpanel');
      SC.beginGame(custom);
    });
    paint();
  };

  /* ---------------- new game / intro ---------------- */
  SC.beginGame = function (custom) {
    const S_ = SAN.state.newGame({ player: custom, cat: { name: 'Mochi', color: 'cream', adopted: false }, slot: SC.pickFreeSlot() });
    S_.started = true;
    SAN.ui.titleActive = true;
    document.getElementById('title-screen').classList.add('hidden');
    SAN.audio.playMusic('emotional');
    SC.playIntro(function () {
      SAN.ui.titleActive = false;
      document.getElementById('hud').classList.remove('hidden');
      document.getElementById('dock').classList.remove('hidden');
      document.getElementById('touch-ui').classList.remove('hidden');
      SAN.world.load('home', 10, 11);
      SAN.cat.syncFromState();
      SAN.ui.refreshHUD();
      SAN.quests.start('main_arrive', true);
      SAN.audio.sfx('open');
      setTimeout(() => {
        SAN.ui.dialogue({
          pages: [
            { speaker: 'narrator', text: 'Your cottage smells of dust and rain and something older: possibility.' },
            { speaker: 'narrator', text: 'There is a key on the table with your name on it. There is a notebook on the desk. There is a village outside.' },
            { speaker: 'narrator', text: 'Nothing here is urgent. Use WASD or the arrow keys to move. Press E to interact. The village can wait.' },
          ],
          choices: [
            { label: 'Look around the cottage', cb: function () { } },
            { label: 'Step outside', cb: function () { SAN.actions.enterArea('village', 14, 16); } },
          ],
          onClose: function () {
            setTimeout(() => SAN.actions.catAdoptScene(), 900);
          },
        });
      }, 500);
      SAN.save.autosave(true);
    });
  };

  SC.pickFreeSlot = function () {
    const meta = SAN.save.slotMeta();
    const empty = meta.find((m) => m.empty);
    return empty ? empty.slot : 1;
  };

  SC.playIntro = function (done) {
    const el = document.getElementById('title-screen');
    el.classList.remove('hidden');
    el.className = 'intro-screen';
    const pages = [
      { t: 'There is a place where the road simply stops being in a hurry.', s: '' },
      { t: 'People here keep small lights on for each other. They plant things and then wait, which is the whole philosophy.', s: '' },
      { t: 'You have come with a suitcase of things you have not said out loud.', s: '' },
      { t: 'The village is called Sanctuary. It is not a cure. It is somewhere to put your bags down.', s: '' },
    ];
    let i = 0;
    el.innerHTML = `<div class="intro-vignette">
      <div class="intro-veil"></div>
      <div class="intro-text" id="intro-text"></div>
      <button class="intro-skip" id="intro-skip">Skip intro</button>
      <div class="intro-progress" id="intro-progress">${pages.map(() => '<i></i>').join('')}</div>
    </div>`;
    const textEl = el.querySelector('#intro-text');
    const prog = el.querySelector('#intro-progress');
    const advance = (force) => {
      if (i >= pages.length) return finish();
      const p = pages[i];
      textEl.classList.remove('in');
      setTimeout(() => {
        textEl.textContent = p.t;
        textEl.classList.add('in');
        Array.from(prog.children).forEach((c, idx) => c.classList.toggle('on', idx <= i));
        i++;
      }, 260);
    };
    function finish() {
      clearInterval(timer);
      el.className = 'hidden';
      el.innerHTML = '';
      done();
    }
    let timer = setInterval(() => {
      if (i > pages.length) return finish();
      advance();
    }, 3600);
    advance();
    el.querySelector('#intro-skip').addEventListener('click', finish);
  };

  SC.loadSlot = function (slot) {
    const snap = SAN.save.read(slot);
    if (!snap) { SAN.ui.toast('That slot is empty.', 'warn'); return; }
    SAN.state.apply(snap);
    const S_ = S();
    S_.started = true;
    SAN.ui.titleActive = false;
    document.getElementById('title-screen').classList.add('hidden');
    document.getElementById('title-screen').innerHTML = '';
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('dock').classList.remove('hidden');
    document.getElementById('touch-ui').classList.remove('hidden');
    SAN.world.load(S_.player.area || 'home', S_.player.x, S_.player.y);
    SAN.cat.syncFromState();
    SAN.save.autosaveEnabled = S_.settings.autosave;
    SAN.ui.applySettings();
    SAN.ui.refreshHUD();
    SAN.quests.refreshBoard();
    SAN.ui.toast('Welcome back, ' + S_.player.name + '.', 'save');
    if (S_.time.festivalToday) {
      const ev = SAN.data.events.find((e) => e.id === S_.time.festivalToday);
      if (ev) SAN.ui.toast('Today: ' + ev.name, 'festival');
    }
  };
})();
</script>
<script>
/* Sanctuary — boot + main loop */
(function () {
  const U = SAN.util;
  let last = 0, hudTimer = 0, achTimer = 0, timeSec = 0, running = false;
  const particles = [];
  let petalCooldown = 0;

  function boot() {
    const canvas = document.getElementById('game');
    SAN.render.setup(canvas);
    SAN.ui.init();
    SAN.input.bind();

    // fishing has priority over the pause menu for Escape
    SAN.input.onKey(function (k) {
      if (SAN.fishing.active) {
        if (k === 'Escape') { SAN.fishing.stop(true); return true; }
        if (k === ' ' || k === 'e' || k === 'E') { /* handled by polling */ }
        return true;
      }
      return false;
    });
    SAN.input.onKey(function (k) { return SAN.ui.handleKey(k); });

    canvas.addEventListener('click', onCanvasClick);
    let resizeTimer = 0;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        SAN.render.resize();
        if (SAN.world.area) SAN.world.clampCam();
      }, 60);
    });
    window.addEventListener('orientationchange', function () {
      setTimeout(function () { SAN.render.resize(); if (SAN.world.area) SAN.world.clampCam(); }, 220);
    });
    const resumeAudio = () => { SAN.audio.init(); };
    document.addEventListener('pointerdown', resumeAudio);
    document.addEventListener('keydown', resumeAudio);
    window.addEventListener('beforeunload', function () {
      if (SAN.state.S && SAN.state.S.started) SAN.save.autosave(true);
    });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden && SAN.state.S && SAN.state.S.started) SAN.save.autosave();
    });

    SAN.screens.showTitle();
    running = true;
    requestAnimationFrame(loop);
  }

  function onCanvasClick(e) {
    if (!SAN.state.S || !SAN.state.S.started || SAN.ui.isPaused()) return;
    const canvas = e.currentTarget;
    const rect = canvas.getBoundingClientRect();
    const sx = (e.clientX - rect.left) / rect.width * SAN.render.width() + SAN.world.cam.x;
    const sy = (e.clientY - rect.top) / rect.height * SAN.render.height() + SAN.world.cam.y;
    const W = SAN.world;
    const p = W.player;
    if (SAN.cat.sprite) {
      const c = SAN.cat.sprite;
      if (Math.abs(c.px - sx) < 14 && Math.abs(c.py - sy + 6) < 14 && U.dist(c.px, c.py, p.px, p.py) < 90) {
        SAN.cat.pet();
        return;
      }
    }
    for (const n of W.npcs) {
      if (Math.abs(n.px - sx) < 14 && Math.abs(n.py - sy + 8) < 16 && U.dist(n.px, n.py, p.px, p.py) < 80) {
        SAN.actions.talkTo(n);
        return;
      }
    }
  }

  function spawnPetal(x, y) {
    particles.push({
      x, y, vx: (Math.random() - 0.5) * 22, vy: -12 - Math.random() * 14,
      life: 1, color: U.pick(['#f2c9dc', '#f6e0b8', '#d8c8ee']), size: 1.5 + Math.random(),
    });
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += 34 * dt;
      p.life -= dt * 1.4;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function drawParticles() {
    const ctx = SAN.render.ctx();
    const cam = SAN.world.cam;
    particles.forEach((p) => {
      ctx.fillStyle = U.rgba(p.color, Math.max(0, p.life));
      ctx.fillRect(Math.round(p.x - cam.x), Math.round(p.y - cam.y), p.size, p.size + 1);
    });
  }

  function loop(ts) {
    if (!running) return;
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (ts - last) / 1000 || 0.016);
    last = ts;
    timeSec += dt;

    const S = SAN.state.S;
    SAN.ui.update(dt);

    if (!S) { return; }

    const modal = SAN.ui.isPaused();
    if (!modal) {
      SAN.time.tick(dt);
      if (!SAN.fishing.active) {
        const mv = SAN.input.moveVector();
        SAN.world.update(dt, mv);
        SAN.living.update(dt);
        const ch = SAN.world.area && SAN.world.area.grid[Math.floor(SAN.world.player.y)] && SAN.world.area.grid[Math.floor(SAN.world.player.y)][Math.floor(SAN.world.player.x)];
        petalCooldown -= dt;
        if (ch === ',' && petalCooldown <= 0 && SAN.world.player.moving) {
          petalCooldown = 0.34;
          spawnPetal(SAN.world.player.px + (Math.random() - 0.5) * 10, SAN.world.player.py - 2);
        }
        SAN.cat.update(dt);
      }
      const pressed = SAN.input.consumeInteract();
      const held = SAN.input.is('interact') || SAN.input.touchActionHeld;
      if (SAN.fishing.active) {
        SAN.fishing.update(dt, pressed, held);
      } else if (pressed && !SAN.ui.dialogueState) {
        SAN.actions.interact();
      }
      updateParticles(dt);
    }

    // render
    if (S.started && SAN.world.area && !SAN.ui.titleActive) {
      drawFrame(S);
    }
    SAN.input.clearFrame();

    hudTimer += dt;
    if (hudTimer > 0.25) {
      hudTimer = 0;
      SAN.ui.refreshHUD();
    }
    achTimer += dt;
    if (achTimer > 3) {
      achTimer = 0;
      SAN.progression.checkAchievements();
    }
    if (S.started && !modal) SAN.save.autosave();
  }

  function drawFrame(S) {
    const R = SAN.render;
    const W = SAN.world;
    const area = W.area;
    const scene = {
      area,
      cam: W.cam,
      player: { px: W.player.px, py: W.player.py, sprite: W.playerSprite() },
      npcs: W.npcs.map((n) => ({
        px: n.px, py: n.py, x: n.x, def: Object.assign({}, n.def, { moving: n.moving }), facing: n.facing, moving: n.moving, act: n.act,
        pose: n.pose, bubble: n.bubble,
      })),
      cat: SAN.cat.sprite,
      timeSec,
      weather: S.time.weather,
      hint: (S.settings.showHints !== false && !SAN.fishing.active && !SAN.ui.isPaused()) ? W.hint : null,
      label: area.name,
    };
    R.drawWorld(scene);
    drawParticles();
    if (area.weatherFx) {
      R.drawWeather(S.time.weather, timeSec, 1);
    }
    R.drawLighting(S.time.minutes, area.weatherFx ? S.time.weather : 'clear', area);
    const ctx = R.ctx();
    if (area.id === 'home') {
      // soft vignette for interiors
      const g = ctx.createRadialGradient(R.width() / 2, R.height() / 2, 40, R.width() / 2, R.height() / 2, 230);
      g.addColorStop(0, 'rgba(40,28,22,0)');
      g.addColorStop(1, 'rgba(40,28,22,0.28)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, R.width(), R.height());
    }
    if (S.time.weather === 'fog' && area.weatherFx) {
      // handled in drawLighting
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else boot();
})();
</script>
