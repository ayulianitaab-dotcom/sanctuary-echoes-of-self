    }
    const hairShine = `<path d="M30 36 C46 22 76 22 90 40" stroke="rgba(255,255,255,0.38)" stroke-width="3.2" fill="none" stroke-linecap="round"/>`;

    return `<svg viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" class="portrait-svg mood-${mood}">
  <defs>
    <radialGradient id="${uid}bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="${bg2}"/><stop offset="70%" stop-color="${bg1}"/><stop offset="100%" stop-color="${SAN.util.mix(dress, '#2a2438', 0.25)}"/>
    </radialGradient>
    <linearGradient id="${uid}hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${SAN.util.shade(hairC, 0.18)}"/><stop offset="60%" stop-color="${hairC}"/><stop offset="100%" stop-color="${hairS}"/>
    </linearGradient>
    <linearGradient id="${uid}eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${SAN.util.shade(eyeC, -0.35)}"/><stop offset="55%" stop-color="${eyeC}"/><stop offset="100%" stop-color="${SAN.util.shade(eyeC, 0.45)}"/>
    </linearGradient>
    <linearGradient id="${uid}dress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${SAN.util.shade(dress, 0.18)}"/><stop offset="100%" stop-color="${SAN.util.shade(dress, -0.12)}"/>
    </linearGradient>
    <filter id="${uid}soft"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="120" height="150" fill="url(#${uid}bg)"/>
  <circle cx="60" cy="58" r="45" fill="#ffffff" opacity="0.10"/>
  <g opacity="0.5" filter="url(#${uid}soft)">
    <circle cx="20" cy="118" r="18" fill="${SAN.util.mix(dress, '#ffffff', 0.5)}"/>
    <circle cx="100" cy="126" r="22" fill="${SAN.util.mix(dress, '#ffffff', 0.4)}"/>
  </g>
  ${backHair[hair] || backHair.long}
  <path d="M14 150 C18 122 38 108 60 108 C82 108 102 122 106 150Z" fill="url(#${uid}dress)"/>
  <path d="M40 150 C44 128 50 116 60 108 C70 116 76 128 80 150Z" fill="${accent}" opacity="0.55"/>
  <path d="M52 96 L52 112 C52 118 68 118 68 112 L68 96Z" fill="${SAN.util.shade(skin, -0.12)}"/>
  <path d="M60 28 C86 28 96 46 96 64 C96 88 82 104 60 104 C38 104 24 88 24 64 C24 46 34 28 60 28Z" fill="${skin}"/>
  <ellipse cx="60" cy="92" rx="20" ry="12" fill="${SAN.util.rgba(skin, 0.6)}"/>
  ${faceParts}
  <path d="M57 76 C58 78 60 79 61 77" stroke="${SAN.util.shade(skin, -0.28)}" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.6"/>
  ${bangs[hair] || bangs.long}
  ${hairShine}
  ${accSvg[acc] || ''}
  ${glow ? `<circle cx="60" cy="60" r="52" fill="#ffffff" opacity="0.06"/>` : ''}
  ${sparkles}
      ${o.moodRing ? `<circle cx="60" cy="60" r="56" fill="none" stroke="${o.moodRing}" stroke-width="2" opacity="0.5"/>` : ''}
</svg>`;
  };

  /* text → expression: lets dialogue portraits react to what is being said */
  R.moodFor = function (text) {
    const t = String(text || '').toLowerCase();
    if (/laugh|grin|smil|beaming|giggl|delight|joy/.test(t)) return 'happy';
    if (/tear|weep|cry|sob|sorry|grief|sad|ache|miss (you|him|her)|alone/.test(t)) return 'sad';
    if (/startl|surpris|shock|gasp|wide-eyed|did not expect|really\?|!$/.test(t)) return 'surprised';
    if (/blush|embarrass|fluster|redden|shy|awkward|sputter/.test(t)) return 'embarrassed';
    if (/angry|furious|snap|glare|frown|irritat|huff/.test(t)) return 'angry';
    if (/think|wonder|perhaps|maybe|consider|remember|suppose/.test(t)) return 'thoughtful';
    return 'neutral';
  };
})();
</script>
<script>
/* Sanctuary — world runtime: area loading, collision, camera, NPC schedules, interaction discovery */
(function () {
  const W = SAN.world;
  const T = 16;
  const U = SAN.util;

  W.T = T;
  W.area = null;
  W.cur = null;
  W.cam = { x: 0, y: 0 };
  W.npcs = [];
  W.player = { px: 0, py: 0, x: 0, y: 0, facing: 'down', moving: false, walkPhase: 0, sprite: null };
  W.hint = null;
  W.fade = 0;
  W.transitionCooldown = 0;
  W.walked = 0;
  W.lastStep = 0;

  function solidChars() { return '~x_'; }

  W.buildSolids = function (a) {
    if (a._solids) return a._solids;
    const s = new Uint8Array(a.w * a.h);
    for (let y = 0; y < a.h; y++) {
      for (let x = 0; x < a.w; x++) {
        const ch = a.grid[y][x];
        if (solidChars().indexOf(ch) >= 0) s[y * a.w + x] = 1;
      }
    }
    a.props.forEach((p) => {
      if (!p.solid) return;
      for (let y = p.y; y < p.y + (p.h || 1); y++) {
        for (let x = p.x; x < p.x + (p.w || 1); x++) {
          if (x >= 0 && y >= 0 && x < a.w && y < a.h) s[y * a.w + x] = 1;
        }
      }
    });
    a.props.forEach((p) => {
      if (!p.clear) return;
      for (let y = p.y; y < p.y + (p.h || 1); y++) {
        for (let x = p.x; x < p.x + (p.w || 1); x++) {
          if (x >= 0 && y >= 0 && x < a.w && y < a.h) s[y * a.w + x] = 0;
        }
      }
    });
    a._solids = s;
    return s;
  };

  W.isSolid = function (tx, ty) {
    const a = W.area;
    if (!a) return true;
    if (tx < 0 || ty < 0 || tx >= a.w || ty >= a.h) return true;
    const s = W.buildSolids(a);
    return !!s[ty * a.w + tx];
  };

  W.locked = function (key) {
    const S = SAN.state.S;
    if (!S) return true;
    if (key === 'meadow') return !S.unlocked.meadow;
    return false;
  };

  /* ---------------- area loading ---------------- */
  W.load = function (id, tx, ty, opts) {
    const a = W.areas[id];
    if (!a) { console.warn('Unknown area', id); return; }
    const S = SAN.state.S;
    W.buildSolids(a);
    W.cur = id;
    W.area = a;
    W.npcs = [];
    let px = tx != null ? tx : a.spawn.x;
    let py = ty != null ? ty : a.spawn.y;
    // nudge off solid tiles
    if (W.isSolid(Math.floor(px), Math.floor(py))) {
      const spot = W.findWalkable(Math.floor(px), Math.floor(py));
      if (spot) { px = spot.x + 0.5; py = spot.y + 0.5; }
    }
    S.player.area = id;
    S.player.x = px;
    S.player.y = py;
    W.player.x = px; W.player.y = py;
    W.player.px = px * T; W.player.py = py * T;
    W.player.facing = opts && opts.facing ? opts.facing : W.player.facing;
    const camX = W.player.px - SAN.render.width() / 2 + 8;
    const camY = W.player.py - SAN.render.height() / 2 + 10;
    W.cam.x = camX; W.cam.y = camY;
    W.clampCam();
    W.spawnNPCs(true);
    W.transitionCooldown = 0.5;
    if (S) {
      if (!S.discovered[id]) {
        S.discovered[id] = true;
        if (SAN.progression) SAN.progression.onDiscover(id);
      }
      S.player.discoveredCount = Object.keys(S.discovered).length;
    }
    if (SAN.living) SAN.living.onEnter(id);
    if (SAN.audio) {
      SAN.audio.playMusic(a.music);
      if (a.region === 'indoor') SAN.audio.ambient(a.ambient);
      else if (S.time.weather === 'rain' || S.time.weather === 'storm') SAN.audio.ambient(S.time.weather);
      else SAN.audio.ambient(a.ambient);
    }
    if (SAN.quests && S) SAN.quests.notify('visit', id, 1);
    if (SAN.ui) SAN.ui.refreshHUD();
  };

  W.findWalkable = function (tx, ty) {
    const a = W.area;
    for (let r = 0; r < 12; r++) {
      for (let dy = -r; dy <= r; dy++) {
        for (let dx = -r; dx <= r; dx++) {
          if (Math.abs(dx) !== r && Math.abs(dy) !== r) continue;
          const x = tx + dx, y = ty + dy;
          if (x < 0 || y < 0 || x >= a.w || y >= a.h) continue;
          if (!W.isSolid(x, y)) return { x, y };
        }
      }
    }
    return null;
  };

  W.clampCam = function () {
    const a = W.area;
    if (!a) return;
    const vw = SAN.render.width(), vh = SAN.render.height();
    const wpx = a.w * T, hpx = a.h * T;
    if (wpx <= vw) W.cam.x = (wpx - vw) / 2;
    else W.cam.x = U.clamp(W.cam.x, 0, wpx - vw);
    if (hpx <= vh) W.cam.y = (hpx - vh) / 2;
    else W.cam.y = U.clamp(W.cam.y, 0, hpx - vh - 8);
  };

  /* ---------------- NPC scheduling ---------------- */
  W.npcScheduleEntry = function (def) {
    const S = SAN.state.S;
    const mins = S.time.minutes;
    const hour = Math.floor(mins / 60) % 24;
    if (def.always) return def.schedule[0];
    const rainy = S.time.weather === 'rain' || S.time.weather === 'storm';
    if (rainy && def.ifRain) return Object.assign({ from: 0, to: 24 }, def.ifRain);
    for (const e of def.schedule) {
      if (hour >= e.from && hour < e.to) return e;
    }
    return null;
  };

  W.spawnNPCs = function (instant) {
    const S = SAN.state.S;
    const defs = SAN.data.npcOrder;
    W.npcs = [];
    defs.forEach((id) => {
      const def = SAN.data.npcs[id];
      const entry = W.npcScheduleEntry(def);
      if (!entry || entry.area !== W.cur) return;
      let ex = entry.x, ey = entry.y;
      if (W.isSolid(ex, ey)) {
        const spot = W.findWalkable(ex, ey);
        if (spot) { ex = spot.x; ey = spot.y; }
      }
      const prev = W.npcs.find((n) => n.def.id === id);
      W.npcs.push({
        def, x: ex + 0.5, y: ey + 0.5, px: (prev ? prev.px : (ex + 0.5) * T), py: (prev ? prev.py : (ey + 0.5) * T),
        facing: 'down', moving: false, think: 1 + Math.random() * 3,
        anchor: { x: ex + 0.5, y: ey + 0.5 }, target: { x: ex + 0.5, y: ey + 0.5 },
        act: entry.act, pose: 'stand', bubble: null, chatTimer: 0, chatting: false,
      });
    });
  };

  W.refreshNPCsIfNeeded = function () {
    const S = SAN.state.S;
    const hour = Math.floor(S.time.minutes / 60);
    if (hour === W.lastHour) return;
    W.lastHour = hour;
    W.spawnNPCs();
  };

  /* ---------------- player ---------------- */
  const FOOT_W = 9, FOOT_H = 6;

  function blockedAt(px, py, area) {
    const x1 = Math.floor((px - FOOT_W / 2) / T), x2 = Math.floor((px + FOOT_W / 2 - 0.01) / T);
    const y1 = Math.floor((py - FOOT_H) / T), y2 = Math.floor((py - 0.01) / T);
    if (x1 < 0 || y1 < 0 || x2 >= area.w || y2 >= area.h) return true;
    for (let y = y1; y <= y2; y++) for (let x = x1; x <= x2; x++) if (W.isSolid(x, y)) return true;
    return false;
  }

  W.movePlayer = function (dx, dy, dt, running) {
    const S = SAN.state.S;
    const a = W.area;
    if (!a) return;
    let speed = running ? 108 : 62;
    if (S.player.energy <= 0) speed *= 0.65;
    const p = W.player;
    const len = Math.hypot(dx, dy);
    if (len < 0.01) { p.moving = false; return; }
    dx /= len; dy /= len;
    p.moving = true;
    if (Math.abs(dx) > Math.abs(dy)) p.facing = dx < 0 ? 'left' : 'right';
    else p.facing = dy < 0 ? 'up' : 'down';

    const nx = p.px + dx * speed * dt;
    const ny = p.py + dy * speed * dt;
    if (!blockedAt(nx, p.py, a)) p.px = nx;
    if (!blockedAt(p.px, ny, a)) p.py = ny;

    p.x = p.px / T; p.y = p.py / T;
    S.player.x = p.x; S.player.y = p.y; S.player.facing = p.facing;
    p.walkPhase += dt * (running ? 14 : 9);
    W.walked += speed * dt;
    if (W.walked - W.lastStep > 34) {
      W.lastStep = W.walked;
      const ch = a.grid[Math.floor(p.y)] && a.grid[Math.floor(p.y)][Math.floor(p.x)];
      if (ch === 'w' || ch === '=' || ch === 'o' || ch === 's') SAN.audio.sfx('step');
      else SAN.audio.sfx('grass');
      SAN.cat && SAN.cat.onPlayerWalk && SAN.cat.onPlayerWalk();
      if (S.player.energy > 0 && running) S.player.energy = Math.max(0, S.player.energy - dt * 0.35);
    }
    W.updateCamera(dt);
    W.checkExits();
    W.checkDoors();
  };

  W.updateCamera = function (dt) {
    const p = W.player;
    const tx = p.px - SAN.render.width() / 2 + 8;
    const ty = p.py - SAN.render.height() / 2 + 10;
    const k = Math.min(1, dt * 8);
    W.cam.x = U.lerp(W.cam.x, tx, k);
    W.cam.y = U.lerp(W.cam.y, ty, k);
    W.clampCam();
  };

  W.checkExits = function () {
    if (W.transitionCooldown > 0) return;
    const a = W.area;
    const p = W.player;
    const tx = Math.floor(p.x), ty = Math.floor(p.y);
    for (const ex of a.exits) {
      if (tx >= ex.x && tx < ex.x + ex.w && ty >= ex.y && ty < ex.y + ex.h) {
        SAN.actions.transition(ex);
        return;
      }
    }
  };

  W.checkDoors = function () {
    if (W.transitionCooldown > 0) return;
    const a = W.area;
    const p = W.player;
    for (const pr of a.props) {
      if (!pr.auto) continue;
      const cxp = (pr.x + (pr.w || 1) / 2) * T;
      const cyp = (pr.y + (pr.h || 1) / 2) * T;
      if (Math.abs(p.px - cxp) < 11 && Math.abs(p.py - cyp) < 14) {
        const it = pr.interact;
        if (it && it.type === 'area') {
          const key = it.to === 'meadow' ? 'meadow' : null;
          if (key && W.locked(key)) { SAN.ui.toast('This path is still hidden from you.'); return; }
          W.load(it.to, it.tx, it.ty);
          SAN.audio.sfx('door');
        }
      }
    }
  };

  /* ---------------- NPC + cat update ---------------- */
  W.pickNpcBehaviour = function (n, rain, night) {
    if (n.huddle && n.target) return;
    const base = n.anchor;
    if (rain) { n.target = { x: base.x, y: base.y + 0.35 }; n.pose = 'hurry'; return; }
    const sitSpot = W.area.props.find((p) => {
      if (!(p.t === 'bench' || p.t === 'chair' || p.t === 'teatable')) return false;
      const cx = p.x + (p.w || 1) / 2;
      return Math.abs(cx - base.x) < 2.4 && Math.abs(p.y + (p.h || 1) / 2 - base.y) < 2.2;
    });
    if (sitSpot && Math.random() < 0.4) { n.pose = 'sit'; n.target = { x: base.x, y: base.y }; return; }
    if (Math.random() < 0.3) { n.pose = 'stand'; n.target = { x: base.x, y: base.y }; return; }
    const r = night ? 1.8 : 3.6;
    for (let tries = 0; tries < 9; tries++) {
      const nx = base.x + (Math.random() - 0.5) * r * 2;
      const ny = base.y + (Math.random() - 0.5) * r * 2;
      if (nx < 1 || ny < 1 || nx > W.area.w - 1 || ny > W.area.h - 1) continue;
      if (!W.isSolid(Math.floor(nx), Math.floor(ny))) { n.target = { x: nx, y: ny }; n.pose = 'walk'; return; }
    }
    n.target = { x: base.x, y: base.y };
    n.pose = 'stand';
  };

  W.updateNPCs = function (dt) {
    const S = SAN.state.S;
    const rain = S.time.weather === 'rain' || S.time.weather === 'storm';
    const night = S.time.minutes >= 21 * 60 || S.time.minutes < 6 * 60;
    W.npcs.forEach((n) => {
      if (n.chatTimer > 0) {
        n.chatTimer -= dt;
        n.moving = false;
        if (n.chatTimer <= 0) n.chatting = false;
      } else {
        n.think -= dt;
        if (n.think <= 0) {
          n.think = 2.5 + Math.random() * 5.5;
          W.pickNpcBehaviour(n, rain, night);
        }
        const tx = n.target.x * T, ty = n.target.y * T;
        const d = Math.hypot(n.px - tx, n.py - ty);
        if (d > 1.5) {
          const speed = (rain ? 40 : n.pose === 'hurry' ? 34 : 24) * dt;
          const step = Math.min(speed, d);
          const beforeX = n.px, beforeY = n.py;
          n.px += ((tx - n.px) / d) * step;
          n.py += ((ty - n.py) / d) * step;
          n.moving = true;
          if (n.pose !== 'hurry') n.pose = 'walk';
          n.facing = Math.abs(n.px - beforeX) > Math.abs(n.py - beforeY) ? (n.px < beforeX ? 'left' : 'right') : (n.py < beforeY ? 'up' : 'down');
        } else {
          n.moving = false;
          n.huddle = false;
          if (n.pose === 'walk' || n.pose === 'hurry') n.pose = 'stand';
        }
      }
      const p = W.player;
      if (Math.hypot(p.px - n.px, p.py - n.py) < 42) {
        n.facing = Math.abs(p.px - n.px) > Math.abs(p.py - n.py) ? (p.px < n.px ? 'left' : 'right') : (p.py < n.py ? 'up' : 'down');
        n.near = true;
      } else n.near = false;
    });
  };

  /* ---------------- interaction discovery ---------------- */
  function distToProp(p, ppx, ppy) {
    const x1 = p.x * T, y1 = p.y * T;
    const x2 = x1 + (p.w || 1) * T, y2 = y1 + (p.h || 1) * T;
    const cx = U.clamp(ppx, x1, x2), cy = U.clamp(ppy, y1, y2);
    return Math.hypot(ppx - cx, ppy - cy);
  }

  W.facingTile = function () {
    const p = W.player;
    let x = Math.floor(p.x), y = Math.floor(p.y);
    if (p.facing === 'left') x--;
    if (p.facing === 'right') x++;
    if (p.facing === 'up') y--;
    if (p.facing === 'down') y++;
    return { x, y };
  };

  W.plotAt = function (tx, ty) {
    const a = W.area;
    if (!a.plots) return null;
    return a.plots.find((pl) => pl.x === tx && pl.y === ty) || null;
  };

  W.computeHint = function () {
    const S = SAN.state.S;
    const p = W.player;
    const ppx = p.px, ppy = p.py - 6;
    let best = null;

    // NPCs
    W.npcs.forEach((n) => {
      const d = Math.hypot(n.px - ppx, n.py - ppy);
      if (d < 34 && (!best || d < best.d)) best = { d, kind: 'npc', npc: n, label: 'Talk', px: n.px, py: n.py };
    });
    // cat
    if (SAN.cat && SAN.cat.sprite) {
      const c = SAN.cat.sprite;
      const d = Math.hypot(c.px - ppx, c.py - ppy);
      if (d < 30 && (!best || d < best.d)) best = { d, kind: 'cat', label: 'Pet', px: c.px, py: c.py };
    }
    // props
    W.area.props.forEach((pr) => {
      if (!pr.interact) return;
      const d = distToProp(pr, ppx, ppy);
      const reach = pr.t === 'building' ? 26 : 22;
      if (d < reach && (!best || d < best.d)) {
        best = { d, kind: 'prop', prop: pr, label: 'E', px: (pr.x + (pr.w || 1) / 2) * T, py: pr.y * T + 2 };
      }
    });
    // farm plot in front
    const ft = W.facingTile();
    const plot = W.plotAt(ft.x, ft.y);
    if (plot) {
      const key = plot.area + ':' + plot.x + ',' + plot.y;
      const state = S.farm.plots[key];
      let label = 'Till';
      if (state) {
        if (!state.crop) label = state.tilled ? 'Plant' : 'Till';
        else if (state.stage >= SAN.data.crops[state.crop].days) label = 'Harvest';
        else if (!state.watered) label = 'Water';
        else label = 'Inspect';
      }
      const d = 4;
      if (!best || best.d > 10) best = { d, kind: 'plot', plot, label, px: (ft.x + 0.5) * T, py: (ft.y + 0.4) * T };
    }
    // water for fishing
    const fch = W.area.grid[ft.y] && W.area.grid[ft.y][ft.x];
    if (fch === '~') {
      best = { d: 2, kind: 'water', label: 'Fish', px: (ft.x + 0.5) * T, py: (ft.y + 0.5) * T };
    }
    W.hint = best;
    return best;
  };

  W.update = function (dt, input) {
    if (W.transitionCooldown > 0) W.transitionCooldown -= dt;
    const mv = input ? input : { x: 0, y: 0, mag: 0 };
    if (mv.mag > 0.05) W.movePlayer(mv.x, mv.y, dt, SAN.input.running());
    else { W.player.moving = false; W.updateCamera(dt); W.checkExits(); W.checkDoors(); }
    W.updateNPCs(dt);
    W.refreshNPCsIfNeeded();
    W.computeHint();
  };

  W.npcById = function (id) { return W.npcs.find((n) => n.def.id === id); };

  W.playerSprite = function () {
    const S = SAN.state.S;
    const p = S.player;
    return {
      colors: p.colors, hair: p.hair, accessory: p.accessory, facing: W.player.facing,
      moving: W.player.moving, walkPhase: W.player.walkPhase,
      gender: p.gender, outfit: p.outfit,
    };
  };
})();
</script>
<script>
/* Sanctuary — central game state, inventory, customization definitions */
(function () {
  const St = (SAN.state = {});
  St.S = null;

  St.HAIRSTYLES = [
    { id: 'long', name: 'Long & Flowing' },
    { id: 'wavy', name: 'Soft Waves' },
    { id: 'braid', name: 'Side Braid' },
    { id: 'bob', name: 'Gentle Bob' },
    { id: 'bun', name: 'Loose Bun' },
    { id: 'ponytail', name: 'Low Ponytail' },
    { id: 'short', name: 'Short & Tidy' },

  St.HAIRS = [

      outfit: 'lavender_dress',

  St.playerColors = function (c) {
    const outfit = St.OUTFITS.find((o) => o.id === c.outfit) || St.OUTFITS[0];

      hair: c.hairColor,
      hairShade: SAN.util.shade(c.hairColor, -0.2),
      skin: c.skinColor,
      skinDark: SAN.util.shade(c.skinColor, -0.15),
      eye: c.eyeColor,
      dress: outfit.dress,
      accent: outfit.accent,
      trim: outfit.trim,
      ribbon: SAN.util.mix(outfit.dress, '#ffffff', 0.45),

  };

  St.newGame = function (opts) {
    const custom = Object.assign(St.defaultCustom(), (opts && opts.player) || {});
    const catOpts = Object.assign({ name: 'Mochi', color: 'cream' }, (opts && opts.cat) || {});
    const catColor = St.CAT_COLORS.find((c) => c.id === catOpts.color) || St.CAT_COLORS[0];

    const defaultSettings = {
      musicVol: 0.5, sfxVol: 0.7, ambVol: 0.5, textSpeed: 1,
      showHints: true, reduceMotion: false, autosave: true,
      privacyConsent: false, useAI: false,
    };
    const savedSettings = SAN.save.loadSettings();
    const settings = Object.assign(defaultSettings, savedSettings || {}, (opts && opts.settings) || {});

    const S = {
      version: 1,
      started: false,
      slot: (opts && opts.slot) || 1,
      savedAt: 0,
      playtime: 0,
      player: {
        name: custom.name,
        gender: custom.gender,
        hair: custom.hair,
        hairColor: custom.hairColor,
        eyeColor: custom.eyeColor,

        adopted: !!(opts && opts.cat && opts.cat.adopted !== false),

        farming: { lvl: 1, xp: 0 },
        fishing: { lvl: 1, xp: 0 },
        crafting: { lvl: 1, xp: 0 },
        exploration: { lvl: 1, xp: 0 },

      friendship: {},
      quests: { active: {}, completed: {}, board: [], boardDay: 0, offered: {} },
      journal: [],
      memories: [],

      achievements: {},
      discovered: { home: true },
      unlocked: { meadow: false, memory_vault: false, lighthouse_key: false, greenhouse_beds: false },
      flags: {},
      settings,
      stats: {
        daysPlayed: 1, fishCaught: 0, cropsHarvested: 0, giftsGiven: 0,
        memoriesCared: 0, itemsCollected: 0, steps: 0, journalEntries: 0,
        cropsPlanted: 0, cooked: 0, crafted: 0, questsDone: 0, catPets: 0,
      },
      forage: {},
      chests: {},
      dialogueSeen: {},
      tutorial: { moved: false, interacted: false, journaled: false },
      log: [],
      catFound: [],
      photos: [],
      discoveries: {},
      world: {
        runes: [], groveOpen: false, lampLit: false,
        gifts: {}, giftDay: {}, favorDay: {}, activities: {},
        seen: {}, eventDay: 0, eventsToday: 0, lastEventMinute: -999,
        lanternNight: false, lanternDay: 0, photoChallenges: {},

      S.friendship[id] = { pts: 0, talkedDay: 0, giftsToday: 0, met: false };
    });
    St.S = S;
    return S;
  };

  St.serialize = function () {
    const S = St.S;
    const copy = JSON.parse(JSON.stringify(S));
    copy.settings = Object.assign({}, S.settings);
    return copy;
  };

  St.apply = function (snap) {
    if (!snap) return null;
    const base = St.newGame({ player: snap.player, cat: snap.cat, settings: snap.settings, slot: snap.slot });
    const merged = Object.assign({}, base, snap);
    // deep-ish repairs
    merged.player = Object.assign({}, base.player, snap.player || {});
    merged.player.colors = Object.assign({}, St.playerColors(merged.player), (snap.player && snap.player.colors) || {});
    merged.time = Object.assign({}, base.time, snap.time || {});
    merged.levels = Object.assign({}, base.levels, snap.levels || {});
    merged.stats = Object.assign({}, base.stats, snap.stats || {});
    merged.unlocked = Object.assign({}, base.unlocked, snap.unlocked || {});
    merged.settings = Object.assign({}, base.settings, snap.settings || {});
    merged.farm = Object.assign({ plots: {} }, snap.farm || {});
    merged.quests = Object.assign({ active: {}, completed: {}, board: [], boardDay: 0, offered: {} }, snap.quests || {});
    merged.house = Object.assign({ furniture: [] }, snap.house || {});
    merged.cat = Object.assign({}, base.cat, snap.cat || {});
    merged.cat.colorHex = merged.cat.colorHex || base.cat.colorHex;
    merged.inventory = Object.assign({}, snap.inventory || {});
    if (!merged.inventory.camera) merged.inventory.camera = 1;
    merged.discovered = Object.assign({ home: true }, snap.discovered || {});
    merged.friendship = Object.assign({}, base.friendship, snap.friendship || {});
    merged.journal = snap.journal || [];
    merged.memories = snap.memories || [];
    merged.achievements = snap.achievements || {};
    merged.flags = snap.flags || {};
    merged.photos = snap.photos || [];
    merged.discoveries = snap.discoveries || {};
    merged.world = Object.assign({
      runes: [], groveOpen: false, lampLit: false,
      gifts: {}, giftDay: {}, favorDay: {}, activities: {},
      seen: {}, eventDay: 0, eventsToday: 0, lastEventMinute: -999,
      lanternNight: false, lanternDay: 0, photoChallenges: {},
    }, snap.world || {});
    merged.started = true;
    merged.money = snap.money != null ? snap.money : base.money;
    merged.energy = snap.energy != null ? snap.energy : 100;
    merged.maxEnergy = snap.maxEnergy || 100;
    St.S = merged;
    return merged;
  };

  /* ---------------- inventory ---------------- */
  St.addItem = function (id, qty, opts) {
    const S = St.S;
    if (!S) return;
    if (id === 'fertilizer_note') { return; } // legacy placeholder, ignore quietly
    const n = qty || 1;
    S.inventory[id] = (S.inventory[id] || 0) + n;
    S.stats.itemsCollected += n;
    if (SAN.quests) SAN.quests.notify('collect', id, n);
    if (!(opts && opts.silent) && SAN.ui) {
      const it = SAN.data.item(id);
      SAN.ui.toast('+' + n + ' ' + it.name, 'item', SAN.render.itemIcon(id));
    }
  };
  St.count = function (id) { return (St.S && St.S.inventory[id]) || 0; };
  St.removeItem = function (id, qty) {
    const S = St.S;
    const n = qty || 1;
    if (!S.inventory[id]) return false;
    S.inventory[id] -= n;
    if (S.inventory[id] <= 0) delete S.inventory[id];
    return true;
  };
  St.hasAll = function (req) {
    return Object.keys(req || {}).every((k) => St.count(k) >= req[k]);
  };
  St.spendItems = function (req) {
    if (!St.hasAll(req)) return false;
    Object.keys(req).forEach((k) => St.removeItem(k, req[k]));
    return true;
  };
  St.earn = function (amount) {
    St.S.money += amount;
    if (SAN.audio) SAN.audio.sfx('coin');
  };
  St.spend = function (amount) {
    if (St.S.money < amount) return false;
    St.S.money -= amount;
    return true;
  };
  St.useEnergy = function (n) {
    const S = St.S;
    if (S.energy < n) return false;
    S.energy = Math.max(0, S.energy - n);
    return true;
  };
  St.restoreEnergy = function (n) {
    const S = St.S;
    S.energy = Math.min(S.maxEnergy, S.energy + n);
  };
  St.inventoryList = function () {
    const S = St.S;
    return Object.keys(S.inventory).filter((k) => S.inventory[k] > 0).map((id) => ({ id, qty: S.inventory[id], def: SAN.data.item(id) }));
  };
  St.itemsByCategory = function (cat) {
    return St.inventoryList().filter((e) => e.def.cat === cat);
  };

  St.log = function (text) {
    const S = St.S;
    S.log.unshift({ text, day: S.time.day, season: S.time.season, minutes: S.time.minutes });
    if (S.log.length > 80) S.log.pop();
  };
})();
</script>
<script>
/* Sanctuary — clock, day cycle, weather, festivals, sleep */
(function () {
  const TM = (SAN.time = {});
  const U = SAN.util;
  const MINUTES_PER_SECOND = 1.4;

  TM.MINUTES_PER_SECOND = MINUTES_PER_SECOND;

  TM.tick = function (dt) {
    const S = SAN.state.S;
    if (!S || SAN.ui.isPaused()) return;
    S.time.minutes += dt * MINUTES_PER_SECOND;
    S.playtime = (S.playtime || 0) + dt;
    if (S.time.minutes >= 26 * 60) {
      // 2 AM — you fall asleep where you stand
      TM.collapse();
    }
  };

  TM.phase = () => U.phase(SAN.state.S.time.minutes);

  TM.weatherRoll = function (season, day) {
    const r = Math.random();
    const tables = [
      [['sunny', 0.42], ['cloudy', 0.24], ['rain', 0.24], ['fog', 0.06], ['storm', 0.04]],
      [['sunny', 0.55], ['cloudy', 0.2], ['rain', 0.15], ['fog', 0.05], ['storm', 0.05]],
      [['sunny', 0.35], ['cloudy', 0.25], ['rain', 0.2], ['fog', 0.15], ['storm', 0.05]],
      [['cloudy', 0.3], ['snow', 0.45], ['sunny', 0.15], ['fog', 0.1]],
    ];
    const table = tables[season] || tables[0];
    let acc = 0;
    for (const [w, p] of table) { acc += p; if (r <= acc) return w; }
    return 'sunny';
  };

  TM.advanceDay = function (opts) {
    const S = SAN.state.S;
    const o = opts || {};
    S.time.day += 1;
    S.stats.daysPlayed = (S.stats.daysPlayed || 0) + 1;
    if (S.time.day > 28) {
      S.time.day = 1;
      S.time.season = (S.time.season + 1) % 4;
      if (S.time.season === 0) S.time.year += 1;
      if (SAN.ui) SAN.ui.toast('A new season settles over Sanctuary: ' + U.SEASONS[S.time.season], 'season');
    }
    S.time.minutes = 6 * 60;
    S.energy = S.maxEnergy;
    S.forage = {};
    S.chests = S.chests || {};
    S.time.weather = TM.weatherRoll(S.time.season, S.time.day);
    S.time.forecast = TM.weatherRoll(S.time.season, S.time.day);
    S.cat.giftsToday = 0;
    Object.keys(S.friendship).forEach((id) => { S.friendship[id].giftsToday = 0; });
    SAN.farming.growAll();
    SAN.quests.refreshBoard();
    SAN.cat.newDay();
    S.house.fireplace = false;
    const fest = SAN.data.eventOn(S.time.season, S.time.day);
    S.time.festivalToday = fest.length ? fest[0].id : null;
    if (fest.length && SAN.ui) {
      SAN.ui.toast('Today: ' + fest[0].name + ' — ' + fest[0].bonus, 'festival');
      SAN.audio.sfx('bell');
    }
    if (SAN.progression) {
      SAN.progression.checkUnlocks();
      SAN.progression.checkAchievements();
    }
    S.tutorial.journaled = S.journal.length > 0;
    SAN.save.autosave(true);
    S.log.push({ text: 'A new day.', day: S.time.day, season: S.time.season, minutes: 360 });
    if (o.silent !== true && SAN.ui) SAN.ui.dayCard();
  };

  TM.sleep = function (silent) {
    const S = SAN.state.S;
    if (!S) return;
    SAN.audio.sfx('sleep');
    SAN.ui.fadeTo(function () {
      S.energy = S.maxEnergy;
      S.time.minutes = 6 * 60;
      SAN.time.advanceDay({ silent: true });
      S.player.area = 'home';
      S.player.x = 10; S.player.y = 11;
      SAN.world.load('home', 10, 11);
      SAN.ui.closeAll();
      SAN.ui.dayCard();
      SAN.save.autosave(true);
    });
  };

  TM.collapse = function () {
    const S = SAN.state.S;
    if (S.flags.collapsing) return;
    S.flags.collapsing = true;
    SAN.ui.toast('You fell asleep where you stood. The village carried you home.', 'info');
    SAN.ui.fadeTo(function () {
      S.energy = Math.round(S.maxEnergy * 0.7);
      S.time.minutes = 6 * 60;
      TM.advanceDay({ silent: true });
      S.player.area = 'home'; S.player.x = 10; S.player.y = 11;
      SAN.world.load('home', 10, 11);
      SAN.ui.closeAll();
      SAN.ui.dayCard();
      S.flags.collapsing = false;
    });
  };

  TM.isFestival = function (id) {
    const S = SAN.state.S;
    return S.time.festivalToday === id;
  };
  TM.todayEvent = function () {
    const S = SAN.state.S;
    return SAN.data.events.find((e) => e.id === S.time.festivalToday) || null;
  };

  TM.clockLabel = function () {
    const S = SAN.state.S;
    return U.fmtTime(S.time.minutes);
  };
  TM.dateLabel = function () {
    const S = SAN.state.S;
    return `${U.SEASONS[S.time.season]} ${S.time.day} · Year ${S.time.year}`;
  };
})();
</script>
<script>
/* Sanctuary — levels, unlocks, achievements */
(function () {
  const P = (SAN.progression = {});
  const THRESHOLDS = [0, 60, 170, 330, 560, 880, 1300, 1850, 2500, 3300, 4300];

  P.levelFromXp = function (xp) {
    let lvl = 1;
    for (let i = 1; i < THRESHOLDS.length; i++) if (xp >= THRESHOLDS[i]) lvl = i + 1;
    return Math.min(10, lvl);
  };
  P.xpForNext = function (xp) {
    for (let i = 0; i < THRESHOLDS.length; i++) if (xp < THRESHOLDS[i]) return THRESHOLDS[i];
    return THRESHOLDS[THRESHOLDS.length - 1];
  };

  P.addXp = function (kind, amount) {
    const S = SAN.state.S;
    if (!S) return;
    const rec = S.levels[kind];
    if (!rec) return;
    const before = P.levelFromXp(rec.xp);
    rec.xp += amount;
    const after = P.levelFromXp(rec.xp);
    rec.lvl = after;
    if (after > before) {
      SAN.audio.sfx('achieve');
      const names = { farming: 'Farming', fishing: 'Fishing', crafting: 'Crafting', exploration: 'Exploration' };
      SAN.ui.toast(names[kind] + ' reached level ' + after + '!', 'level');
      P.checkUnlocks(kind, after);
    }
  };

  P.checkUnlocks = function (kind, lvl) {
    const S = SAN.state.S;
    if (!S) return;
    if (kind === 'exploration' && lvl >= 3 && !S.unlocked.meadow) {
      S.unlocked.meadow = true;
      SAN.ui.toast('The path to the Hidden Meadow has opened in the Memory Forest.', 'unlock');
      S.log.push({ text: 'Unlocked the Hidden Meadow.', day: S.time.day, season: S.time.season, minutes: S.time.minutes });
    }
    if (kind === 'crafting' && lvl >= 2) {
      // recipes are gated by level in the crafting UI
    }
    if (kind === 'farming' && lvl >= 2) {
      S.flags.betterSeeds = true;
    }
    if (kind === 'fishing' && lvl >= 3) {
      S.flags.deepFishing = true;
    }
  };

  P.onDiscover = function (area) {
    const S = SAN.state.S;
    const a = SAN.world.areas[area];
    P.addXp('exploration', 18);
    SAN.ui.toast('Discovered: ' + (a ? a.name : area), 'discover');
    S.stats.itemsCollected += 0;
  };

  P.ACHIEVEMENT_CHECKERS = {
    first_sunrise: () => SAN.state.S.stats.daysPlayed >= 2,
    garden_own: () => SAN.state.S.stats.cropsHarvested >= 10,
    friend_sanctuary: () => Object.values(SAN.state.S.friendship).some((f) => f.pts >= 41),
    letters_never_sent: () => !!SAN.state.S.quests.completed.lh_2,
    little_things: () => SAN.state.S.stats.memoriesCared >= 3,
    lighthouse_keeper: () => !!SAN.state.S.quests.completed.lh_3,
    trusted_hands: () => !!SAN.state.S.quests.completed.gh_3,
    quiet_mind: () => !!SAN.state.S.quests.completed.wm_3,
    angler: () => SAN.state.S.stats.fishCaught >= 15,
    decorator: () => SAN.state.S.house.furniture.length >= 8,
    archivist: () => SAN.state.S.journal.length >= 10,
    wanderer: () => ['village', 'garden', 'greenhouse', 'forest', 'beach', 'lighthouse', 'windmill', 'meadow'].every((a) => SAN.state.S.discovered[a]),
    cat_friend: () => SAN.state.S.cat.trust >= 60,
    memory_garden: () => SAN.state.S.memories.some((m) => m.progress >= 4),
  };

  P.checkAchievements = function () {
    const S = SAN.state.S;
    if (!S) return;
    SAN.data.achievements.forEach((a) => {
      if (S.achievements[a.id]) return;
      const fn = P.ACHIEVEMENT_CHECKERS[a.id];
      if (fn && fn()) P.unlock(a.id);
    });
  };

  P.unlock = function (id) {
    const S = SAN.state.S;
    if (S.achievements[id]) return;
    S.achievements[id] = { day: S.time.day, season: S.time.season, year: S.time.year };
    const a = SAN.data.achievements.find((x) => x.id === id);
    if (a) {
      SAN.ui.toast('Achievement — ' + a.name, 'achievement');
      SAN.audio.sfx('achieve');
    }
  };

  P.stats = function () {
    const S = SAN.state.S;
    return {
      exploration: { lvl: S.levels.exploration.lvl, xp: S.levels.exploration.xp, unlocked: ['The Garden', S.unlocked.meadow ? 'The Hidden Meadow' : 'Hidden meadow (locked)'] },
    };
  };
})();
</script>
<script>
/* Sanctuary — farming: till, plant, water, grow, harvest */
(function () {
  const F = (SAN.farming = {});
  const U = SAN.util;

  F.key = (areaId, x, y) => areaId + ':' + x + ',' + y;

  F.stateAt = function (plot) {
    const S = SAN.state.S;
    return S.farm.plots[F.key(plot.area, plot.x, plot.y)] || null;
  };

  F.canGrowIn = function (cropId, areaId, season) {
    if (areaId === 'greenhouse') return true;
    const c = SAN.data.crops[cropId];
    return c && c.seasons.indexOf(season) >= 0;
  };

  F.till = function (plot) {
    const S = SAN.state.S;
    if (!SAN.state.useEnergy(2)) { SAN.ui.toast('You are too tired to dig. Rest, or eat something.', 'warn'); return false; }
    S.farm.plots[F.key(plot.area, plot.x, plot.y)] = { tilled: true, watered: false, crop: null, stage: 0 };
    SAN.audio.sfx('plant');
    SAN.progression.addXp('farming', 2);
    return true;
  };

  F.plant = function (plot, seedId) {
    const S = SAN.state.S;
    const key = F.key(plot.area, plot.x, plot.y);
    let st = S.farm.plots[key];
    if (plot.area === 'greenhouse' && !S.unlocked.greenhouse_beds) {
      SAN.ui.toast('These beds are Elowen\'s for now. She might share them later.', 'info');
      return false;
    }
    if (!st || !st.tilled) {
      if (!F.till(plot)) return false;
      st = S.farm.plots[key];
    }
    const item = SAN.data.item(seedId);
    if (!item || !item.crop) return false;
    if (SAN.state.count(seedId) <= 0) { SAN.ui.toast('You have no ' + item.name + '.', 'warn'); return false; }
    const crop = SAN.data.crops[item.crop];
    if (!F.canGrowIn(crop.id, plot.area, S.time.season)) {
      SAN.ui.toast(crop.name + ' will not grow in ' + U.SEASONS[S.time.season] + ' here.', 'warn');
      return false;
    }
    if (!SAN.state.useEnergy(1)) { SAN.ui.toast('Too tired to plant.', 'warn'); return false; }
    SAN.state.removeItem(seedId, 1);
    st.crop = crop.id;
    st.stage = 0;
    st.watered = false;
    st.plantedDay = S.time.day;
    S.stats.cropsPlanted++;
    SAN.quests.notify('plant', 'any', 1);
    if (plot.area === 'greenhouse') SAN.quests.notify('plant_greenhouse', 'any', 1);
    SAN.progression.addXp('farming', 4);
    SAN.audio.sfx('plant');
    SAN.ui.toast('Planted ' + crop.name + '. Water it each day.', 'item');
    return true;
  };

  F.water = function (plot) {
    const S = SAN.state.S;
    const st = F.stateAt(plot);
    if (!st || !st.crop) return false;
    if (st.watered) { SAN.ui.toast('Already watered today.', 'info'); return false; }
    if (!SAN.state.useEnergy(1)) { SAN.ui.toast('Too tired to water.', 'warn'); return false; }
    st.watered = true;
    SAN.audio.sfx('water');
    SAN.quests.notify('water', 'any', 1);
    if (plot.area === 'greenhouse') SAN.quests.notify('water_greenhouse', 'any', 1);
    SAN.progression.addXp('farming', 2);
    return true;
  };

  F.harvest = function (plot) {
    const S = SAN.state.S;
    const st = F.stateAt(plot);
    if (!st || !st.crop) return false;
    const crop = SAN.data.crops[st.crop];
    if (st.stage < crop.days) { SAN.ui.toast(crop.name + ' is still growing. ' + (crop.days - st.stage) + ' more day(s).', 'info'); return false; }
    if (!SAN.state.useEnergy(1)) { SAN.ui.toast('Too tired to harvest.', 'warn'); return false; }
    const y = crop.yield || [1, 1];
    const qty = y[0] + Math.floor(Math.random() * (y[1] - y[0] + 1));
    SAN.state.addItem(crop.item, qty);
    S.stats.cropsHarvested += qty;
    SAN.quests.notify('harv', crop.id, qty);
    if (plot.area === 'greenhouse') SAN.quests.notify('harv_greenhouse', 'any', qty);
    SAN.progression.addXp('farming', crop.xp || 8);
    SAN.audio.sfx('harvest');
    st.crop = null; st.stage = 0; st.watered = false;
    // occasional extra seed back
    if (Math.random() < 0.3) SAN.state.addItem(crop.seed, 1, { silent: true });
    SAN.progression.checkAchievements();
    return true;
  };

  F.growAll = function () {
    const S = SAN.state.S;
    Object.keys(S.farm.plots).forEach((key) => {
      const st = S.farm.plots[key];
      if (!st || !st.crop) return;
      const crop = SAN.data.crops[st.crop];
      const areaId = key.split(':')[0];
      if (!crop) return;
      const inSeason = F.canGrowIn(st.crop, areaId, S.time.season);
      if (st.watered && inSeason && st.stage < crop.days) st.stage += 1;
      st.watered = false;
      st.justGrew = !!st.watered;
    });
  };

  F.matureCount = function () {
    const S = SAN.state.S;
    let n = 0;
    Object.keys(S.farm.plots).forEach((k) => {
      const st = S.farm.plots[k];
      if (st.crop && st.stage >= SAN.data.crops[st.crop].days) n++;
    });
    return n;
  };

  F.describe = function (plot) {
    const st = F.stateAt(plot);
    if (!st) return 'Untilled soil. It has been waiting a while.';
    if (!st.crop) return 'Tilled soil, ready for a seed.';
    const crop = SAN.data.crops[st.crop];
    const left = Math.max(0, crop.days - st.stage);
    return crop.name + ' — ' + (left === 0 ? 'ready to harvest' : left + ' day(s) left') + (st.watered ? ' · watered' : ' · needs water');
  };
})();
</script>
<script>
/* Sanctuary — fishing minigame with casting, bite timing and a reel-in bar */
(function () {
  const F = (SAN.fishing = {});
  const U = SAN.util;

  F.active = false;
  F.phase = 'idle';
  F.fish = null;
  F.timer = 0;
  F.catchTop = 0.5;
  F.catchH = 0.24;
  F.fishPos = 0.5;
  F.fishVel = 0;
  F.progress = 0.4;
  F.hold = false;
  F.result = null;
  F.overlay = null;
  F.lastTs = 0;

  const PHASE_LABEL = {
    cast: 'Casting the line…',
    wait: 'Waiting. Nothing to do but watch the water.',
    bite: 'A bite! Press E now!',
    reel: 'Hold E to lift the line — keep the fish in the glow.',
    win: 'Caught!',
    lose: 'It slipped away…',
    notify: 'Catch!',
  };

  function ensureOverlay() {
    if (F.overlay) return F.overlay;
    const el = document.createElement('div');
    el.id = 'fishing-overlay';
    el.className = 'fishing-overlay hidden';
    el.innerHTML = `
      <div class="fishing-card">
        <div class="fishing-header">
          <span class="fishing-title">Fishing</span>
          <span class="fishing-sub" id="fishing-sub"></span>
        </div>
        <div class="fishing-body">
          <div class="fishing-track" id="fishing-track">
            <div class="fishing-water"></div>
            <div class="catch-zone" id="catch-zone"></div>
            <div class="fish-marker" id="fish-marker">🐟</div>
          </div>
          <div class="fishing-side">
            <div class="tension-wrap"><div class="tension-bar" id="tension-bar"><i></i></div></div>
            <div class="fishing-meter-label">Line</div>
            <div class="fishing-dots" id="fishing-dots"></div>
          </div>
        </div>
        <div class="fishing-hint" id="fishing-hint">Press E to cast</div>
        <div class="fishing-actions">
          <button class="btn btn-ghost" id="fishing-cancel">Stop fishing</button>
        </div>
      </div>`;
    document.getElementById('ui-root').appendChild(el);
    el.querySelector('#fishing-cancel').addEventListener('click', () => F.stop(true));
    F.overlay = el;
    return el;
  }

  F.chooseFish = function () {
    const S = SAN.state.S;
    const areaId = S.player.area;
    const hour = Math.floor(S.time.minutes / 60) % 24;
    const phase = U.phase(S.time.minutes);
    const weather = S.time.weather;
    const lvl = S.levels.fishing.lvl;
    const clear = weather === 'sunny' || weather === 'cloudy';
    const rainy = weather === 'rain' || weather === 'storm';
    const pool = Object.values(SAN.data.fish).filter((f) => {
      if (!f.areas.includes(areaId)) return false;
      if (f.minLevel > lvl) return false;
      if (f.time === 'night' && phase !== 'night') return false;
      if (f.time === 'morning' && phase !== 'morning') return false;
      if (f.weather === 'clear' && !clear) return false;
      if (f.weather === 'rain' && !rainy) return false;
      if (f.weather === 'fog' && weather !== 'fog') return false;
      return true;
    });
    if (!pool.length) return SAN.data.fish.minnow;
    const celebrate = SAN.time.todayEvent() && SAN.time.todayEvent().id === 'moonlight_fishing';
    let total = 0;
    const weights = pool.map((f) => {
      let w = 1 / (f.diff + 0.25);
      if (celebrate) w *= 1.5;
      total += w;
      return w;
    });
    let r = Math.random() * total;
    for (let i = 0; i < pool.length; i++) {
      r -= weights[i];
      if (r <= 0) return pool[i];
    }
    return pool[0];
  };

  F.start = function () {
    const S = SAN.state.S;
    if (F.active) return;
    F.active = true;
    F.phase = 'cast';
    F.timer = 0.9;
    F.catchTop = 0.5;
    F.progress = 0.4;
    F.hold = false;
    F.result = null;
    F.fish = F.chooseFish();
    F.catchH = Math.max(0.15, 0.30 - (F.fish.diff * 0.12) - S.levels.fishing.lvl * 0.008);
    F.fishPos = 0.5;
    F.fishVel = 0;
    ensureOverlay().classList.remove('hidden');
    SAN.audio.sfx('water');
    SAN.audio.ambient('waves');
    F.updateUI();
    if (SAN.state.S.player.energy <= 0) {
      SAN.ui.toast('You are exhausted. Fishing would just be staring at water.', 'warn');
    }
  };

  F.stop = function (cancelled) {
    F.active = false;
    F.phase = 'idle';
    F.hold = false;
    if (F.overlay) F.overlay.classList.add('hidden');
    if (SAN.audio) SAN.audio.ambient(SAN.world.area ? SAN.world.area.ambient : 'birds');
    if (cancelled) SAN.ui.toast('You reel in an empty line.', 'info');
  };

  F.update = function (dt, pressed, held) {
    if (!F.active) return;
    const S = SAN.state.S;
    F.hold = !!held;
    if (F.phase === 'cast') {
      F.timer -= dt;
      if (F.timer <= 0) { F.phase = 'wait'; F.timer = 1.4 + Math.random() * 2.6; }
    } else if (F.phase === 'wait') {
      F.timer -= dt;
      if (Math.random() < dt * 0.7) SAN.audio.sfx('water');
      if (F.timer <= 0) {
        F.phase = 'bite';
        F.timer = 1.35;
        SAN.audio.sfx('waterup');
        SAN.ui.toast('Something is pulling the line!', 'info');
      }
    } else if (F.phase === 'bite') {
      F.timer -= dt;
      if (pressed) { F.phase = 'reel'; F.progress = 0.45; }
      else if (F.timer <= 0) { F.fail('It let go. Too slow.'); }
    } else if (F.phase === 'reel') {
      const diff = F.fish.diff;
      const speed = F.fish.speed;
      // fish wander
      if (Math.random() < dt * 3.2) F.fishVel += (Math.random() - 0.5) * speed * 1.5;
      F.fishVel += (0.5 - F.fishPos) * dt * 1.4;
      F.fishVel *= 0.96;
      F.fishPos += F.fishVel * dt;
      if (F.fishPos < 0) { F.fishPos = 0; F.fishVel = Math.abs(F.fishVel) * 0.6; }
      if (F.fishPos > 1) { F.fishPos = 1; F.fishVel = -Math.abs(F.fishVel) * 0.6; }
      // catch zone
      const lift = 0.62 - diff * 0.18;
      F.catchTop += (F.hold ? -lift : lift * 0.85) * dt;
      F.catchTop = U.clamp(F.catchTop, 0, 1 - F.catchH);
      const inside = F.fishPos >= F.catchTop && F.fishPos <= F.catchTop + F.catchH;
      F.progress += (inside ? 0.26 : -0.20) * dt;
      if (inside && Math.random() < dt * 2) SAN.audio.sfx('click');
      if (F.progress >= 1) F.win();
      else if (F.progress <= 0) F.fail('The line went slack. It got away.');
    } else if (F.phase === 'win' || F.phase === 'lose') {
      F.timer -= dt;
      if (F.timer <= 0 || pressed) F.stop(false);
    }
    F.updateUI();
  };

  F.win = function () {
    const S = SAN.state.S;
    F.phase = 'win';
    F.timer = 2.4;
    const fish = F.fish;
    SAN.state.addItem(fish.id, 1);
    S.stats.fishCaught++;
    SAN.quests.notify('catch', fish.id, 1);
    SAN.progression.addXp('fishing', Math.round(8 + fish.diff * 22));
    SAN.audio.sfx('catch');
    F.result = fish;
    const rarity = fish.rarity || 'common';
    SAN.ui.toast('Caught a ' + fish.name + ' (' + rarity + ')!', 'fish', SAN.render.itemIcon(fish.id));
    if (rarity === 'rare' || rarity === 'legendary') {
      SAN.progression.checkAchievements();
      SAN.ui.toast('Rare waters remember you.', 'unlock');
    }
    if (fish.id === 'memoryfish') {
      S.flags.caughtMemoryfish = true;
      SAN.ui.toast('The Memoryfish looks at you for a long moment, then returns to the dark.', 'story');
    }
    SAN.save.autosave();
  };

  F.fail = function (msg) {
    F.phase = 'lose';
    F.timer = 1.8;
    F.result = null;
    SAN.ui.toast(msg, 'info');
  };

  F.updateUI = function () {
    if (!F.overlay) return;
    const sub = F.overlay.querySelector('#fishing-sub');
    const hint = F.overlay.querySelector('#fishing-hint');
    const track = F.overlay.querySelector('#fishing-track');
    const zone = F.overlay.querySelector('#catch-zone');
    const marker = F.overlay.querySelector('#fish-marker');
    const tension = F.overlay.querySelector('#tension-bar i');
    const trackH = track.clientHeight || 180;
    sub.textContent = F.phase === 'reel' ? 'Something is fighting' : F.phase === 'wait' ? 'Waiting' : '';
    hint.textContent = PHASE_LABEL[F.phase] || '';
    if (F.phase === 'reel' || F.phase === 'win' || F.phase === 'lose') {
      zone.style.display = 'block';
      zone.style.top = (F.catchTop * 100) + '%';
      zone.style.height = (F.catchH * 100) + '%';
      marker.style.display = 'block';
      marker.style.top = (F.fishPos * 100) + '%';
    } else {
      zone.style.display = 'none';
      marker.style.display = 'none';
    }
    tension.style.height = Math.max(0, Math.min(100, F.progress * 100)) + '%';
    tension.style.background = F.progress > 0.6 ? '#9fc48a' : F.progress > 0.3 ? '#e0c47a' : '#d08a7a';
    if (F.phase === 'win' && F.result) {
      hint.textContent = 'You caught a ' + F.result.name + '!';
    }
  };

  F.hintText = function () {
    if (!F.active) return '';
    return PHASE_LABEL[F.phase] || '';
  };
})();
</script>
<script>
/* Sanctuary — cooking and crafting */
(function () {
  const C = (SAN.craft = {});

  C.canCook = function (recipe) {
    return SAN.state.hasAll(recipe.need);
  };
  C.cook = function (recipeId) {
    const S = SAN.state.S;
    const r = SAN.data.cookRecipes.find((x) => x.id === recipeId);
    if (!r) return false;
    if (!SAN.state.hasAll(r.need)) { SAN.ui.toast('You are missing ingredients.', 'warn'); return false; }
    if (!SAN.state.useEnergy(2)) { SAN.ui.toast('Too tired to cook. Sit down first.', 'warn'); return false; }
    SAN.state.spendItems(r.need);
    SAN.state.addItem(r.out, 1);
    S.stats.cooked++;
    SAN.quests.notify('cook', r.id, 1);
    SAN.progression.addXp('crafting', 8);
    SAN.audio.sfx('craft');
    SAN.ui.toast('Cooked ' + r.name + '.', 'item', SAN.render.itemIcon(r.out));
    return true;
  };

  C.canCraft = function (recipe) {
    const S = SAN.state.S;
    if (S.levels.crafting.lvl < (recipe.level || 0)) return false;
    return SAN.state.hasAll(recipe.need);
  };
  C.craft = function (recipeId) {
    const S = SAN.state.S;
    const r = SAN.data.craftRecipes.find((x) => x.id === recipeId);
    if (!r) return false;
    if (S.levels.crafting.lvl < (r.level || 0)) { SAN.ui.toast('You need Crafting level ' + r.level + '.', 'warn'); return false; }
    if (!SAN.state.hasAll(r.need)) { SAN.ui.toast('You are missing materials.', 'warn'); return false; }
    if (!SAN.state.useEnergy(2)) { SAN.ui.toast('Too tired to craft.', 'warn'); return false; }
    SAN.state.spendItems(r.need);
    SAN.state.addItem(r.out, 1);
    S.stats.crafted++;
    SAN.quests.notify('craft', r.id, 1);
    SAN.progression.addXp('crafting', 10);
    SAN.audio.sfx('craft');
    SAN.ui.toast('Crafted ' + r.name + '.', 'item', SAN.render.itemIcon(r.out));
    return true;
  };

  C.eat = function (itemId) {
    const S = SAN.state.S;
    const it = SAN.data.item(itemId);
    if (!it.energy) { SAN.ui.toast('That is not something you can eat.', 'info'); return false; }
    if (SAN.state.count(itemId) <= 0) return false;
    SAN.state.removeItem(itemId, 1);
    SAN.state.restoreEnergy(it.energy);
    SAN.ui.toast('You eat ' + it.name + '. +' + it.energy + ' energy.', 'item', SAN.render.itemIcon(itemId));
    SAN.audio.sfx('harvest');
    return true;
  };
})();
</script>
