    gh_3: ['The starflower opens in the afternoon light. It is small and entirely real.', '"I grew this. We grew this. I do not know which one to be proud of."', '"Both, I think. I am told you are allowed to have both."'],
    wm_1: ['"That helped. Not in a solving way. In a not-alone way."', 'Rowan breathes out. "I am going to write that in the notebook. The kind version. Not the audit."'],
    wm_2: ['Rowan lays the notes out on the mill table. Eleven pages of "it is fine, probably."', '"That is a lot of fog," he says. "But it is just fog. It is not a verdict."', 'He puts them in a drawer. Closes it. Opens the window.'],
    wm_3: ['The windmill turns. Neither of you says anything for a long time.', '"This is the quiet I have been trying to get to," Rowan says. "Turns out it needed company."'],
    side_mira: ['"You brought me something. And it is not bread." She holds it like it might dissolve.', '"I am going to sit down. For five minutes. In front of a witness."'],
    side_finn: ['"My grandfather\'s hook." Finn is quiet for a long moment.', '"You know what he used to say? The sea gives you what it gives you." He smiles. "It gave me this back."'],
    side_aria: ['"Two pages. I am filing them under \'things that arrived and were worth keeping\'."', '"I did not read them. I wanted to. I did not."'],
    side_celeste: ['Celeste arranges them without a word. The bouquet is slightly asymmetrical and very alive.', '"He will know," she says. "But he will not have to say it. That is the whole art."'],
    side_theo: ['Theo turns the music box over three times. His face does something complicated.', '"This was mine. A long time ago. I sold it in a town I have been trying to forget."', '"Keep it. Or throw it in the sea. Either is a decision. That is the important part."'],
    side_cat: ['Your cat investigates the new bed with deep suspicion, then curls into it and falls asleep in four seconds.', '"A very good cat," Nyssa observes, "and a very good bed."'],
    side_memory: ['"You watered a stone," Nyssa says. "It sounds foolish. It is not."', '"Some things only need to be visited. You have visited."'],
  };

  A.offerQuest = function (q) {
    const offer = OFFERS[q.id] || {
      pages: [{ speaker: q.giver, text: '"I could use a hand with something, if you have the time. No pressure."' }],
      accept: 'I will help.',
    };
    const pages = offer.pages.map((p) => ({ speaker: p.speaker, text: p.text }));
    SAN.ui.dialogue({
      pages,
      choices: [
        { label: offer.accept, cb: function () { if (SAN.quests.start(q.id)) SAN.quests.notify('talk', q.giver, 1); } },
        { label: 'Maybe later', cb: function () { SAN.ui.toast('You can always ask again. Nothing is lost.', 'info'); } },
      ],
    });
  };

  A.turnInDialogue = function (id) {
    const q = SAN.data.quests[id];
    if (!q) return;
    const lines = COMPLETE_LINES[id] || ['"That is done, then. Thank you."'];
    const pages = lines.map((l) => ({ speaker: q.giver === 'board' ? 'narrator' : q.giver, text: l }));
    const rewards = [];
    const r = q.rewards || {};
    if (r.money) rewards.push(r.money + ' coins');
    if (r.items) r.items.forEach(([iid, n]) => rewards.push(SAN.data.item(iid).name + ' ×' + n));
    if (rewards.length) pages.push({ speaker: 'narrator', text: 'Reward: ' + rewards.join(', ') + '.' });
    if (q.giver !== 'board') SAN.rel.add(q.giver, 4, true);
    SAN.ui.dialogue({
      pages,
      choices: [{ label: 'Thank them', cb: function () { SAN.quests.turnIn(id); } }],
    });
  };

  /* =========================================================
     SPECIAL SCENES (branching)
     ========================================================= */
  A.letterScene = function (npc) {
    SAN.ui.dialogue({
      pages: [
        { speaker: 'liora', text: 'She is holding the drawer handle. "I have not opened this since she left."' },
        { speaker: 'liora', text: '"Do I read them? I genuinely do not know. I have been not-knowing for four years."' },
      ],
      choices: [
        {
          label: 'Read them together',
          cb: function () {
            SAN.quests.setFlag('lh_letter_choice', 'read');
            SAN.ui.dialogue({
              pages: [
                { speaker: 'narrator', text: 'The letters are short and ordinary. Weather. A recipe. An apology that arrives three sentences late.' },
                { speaker: 'liora', text: '"She says she is sorry she was not braver." Liora laughs once, wetly. "She sounds exactly like me."' },
                { speaker: 'liora', text: '"I think I have been waiting for a sentence that was never going to be written. This is not that sentence. But it is something."' },
              ],
            });
          },
        },
        {
          label: 'Leave them sealed',
          cb: function () {
            SAN.quests.setFlag('lh_letter_choice', 'sealed');
            SAN.ui.dialogue({
              pages: [
                { speaker: 'narrator', text: 'She closes the drawer, gently, the way you close a door on a room someone is sleeping in.' },
                { speaker: 'liora', text: '"Not today. Maybe not ever. I do not have to open a thing to be allowed to move on from it."' },
                { speaker: 'liora', text: '"Thank you for not pushing. People always push. They think it is helping."' },
              ],
            });
          },
        },
      ],
    });
  };

  A.helpScene = function (npc) {
    SAN.ui.dialogue({
      pages: [
        { speaker: 'elowen', text: '"You do not have to." She says it like a reflex. Then, quieter: "I am not sure what to do if you do."' },
      ],
      choices: [
        {
          label: 'Kneel down and start weeding',
          cb: function () {
            SAN.quests.setFlag('gh_help_choice', 'stay');
            SAN.ui.dialogue({
              pages: [
                { speaker: 'narrator', text: 'You pull weeds beside her. Neither of you says anything for ten minutes. It is not uncomfortable.' },
                { speaker: 'elowen', text: '"...This is okay," she says, as if checking the words for holes. "This is okay."' },
              ],
            });
          },
        },
        {
          label: 'Bring materials and give her space',
          cb: function () {
            SAN.quests.setFlag('gh_help_choice', 'space');
            SAN.ui.dialogue({
              pages: [
                { speaker: 'narrator', text: 'You stack the fibre by the door where she can reach it, and step back outside.' },
                { speaker: 'elowen', text: 'She looks at the stack. Then at you. "...That is the right amount of help," she says. "How did you know?"' },
              ],
            });
          },
        },
      ],
    });
  };

  A.reframeScene = function (npc) {
    SAN.ui.dialogue({
      pages: [
        { speaker: 'rowan', text: '"They invited me to the tea gathering. I have decided it is out of pity. I have a whole case built for this."' },
        { speaker: 'rowan', text: '"Say something. Anything. I will be reasonable about it. Probably."' },
      ],
      choices: [
        {
          label: '"Or maybe they just like you."',
          cb: function () {
            SAN.quests.setFlag('reframe_choice', 'kind');
            SAN.quests.notify('reframe', 'any', 1);
            SAN.ui.dialogue({
              pages: [
                { speaker: 'rowan', text: '"...Huh." He blinks. "That is a much smaller story than the one I built."' },
                { speaker: 'rowan', text: '"The fog version is always bigger. That is how you know it is fog."' },
              ],
            });
          },
        },
        {
          label: '"You are overthinking it."',
          cb: function () {
            SAN.quests.setFlag('reframe_choice', 'dismiss');
            SAN.quests.notify('reframe', 'any', 1);
            SAN.ui.dialogue({
              pages: [
                { speaker: 'rowan', text: '"I know. That is the problem." He rubs his eyes. "Gently, though. Gently is better."' },
                { speaker: 'rowan', text: '"But you stayed. That helps more than being right."' },
              ],
            });
          },
        },
        {
          label: '"We do not have to talk about it."',
          cb: function () {
            SAN.quests.setFlag('reframe_choice', 'skip');
            SAN.quests.notify('reframe', 'any', 1);
            SAN.ui.dialogue({
              pages: [
                { speaker: 'rowan', text: '"Thank you." He sags with relief. "I can be quiet with someone. I forgot that was allowed."' },
                { speaker: 'narrator', text: 'You sit on the mill steps and watch the sails turn. It is enough.' },
              ],
            });
          },
        },
      ],
    });
  };

  A.lampScene = function () {
    const S_ = S();
    SAN.ui.dialogue({
      pages: [
        { speaker: 'liora', text: 'Liora hands you the long brass lighter. "Your turn. If you want. You can hand it back."' },
        { speaker: 'narrator', text: 'The wick catches. The lamp room goes gold, then white, then gold again.' },
        { speaker: 'liora', text: '"I have been the one who keeps the light for everyone. I did not think anyone would ever keep one for me."' },
        { speaker: 'liora', text: '"You do not have to promise anything. I am trying to learn that people can be here without promising."' },
      ],
      choices: [
        {
          label: '"I am here."',
          cb: function () {
            SAN.quests.setFlag('lh_lamp_choice', 'here');
            SAN.ui.dialogue({ pages: [{ speaker: 'liora', text: 'She nods, once, and looks out at the water. "That is enough. That is actually enough."' }] });
          },
        },
        {
          label: '"I do not know how long I can stay."',
          cb: function () {
            SAN.quests.setFlag('lh_lamp_choice', 'honest');
            SAN.ui.dialogue({ pages: [{ speaker: 'liora', text: '"That is the most honest thing anyone has said to me in years." She smiles. "I can work with honest."' }] });
          },
        },
      ],
    });
  };

  A.windmillScene = function () {
    SAN.ui.dialogue({
      pages: [
        { speaker: 'narrator', text: 'Evening at the windmill. The sails turn slowly. Rowan is sitting on the step with two cups of tea he did not mention making.' },
        { speaker: 'rowan', text: '"I have not analysed anything for an hour. It is very loud in a completely different way."' },
        { speaker: 'rowan', text: '"I keep almost saying something self-critical. Can we just — not? For a bit?"' },
      ],
      choices: [
        { label: 'Sit quietly together', cb: function () { A.windmillQuiet(); } },
        { label: '"You are allowed to have a good evening."', cb: function () { A.windmillQuiet(); } },
      ],
    });
  };
  A.windmillQuiet = function () {
    SAN.ui.dialogue({
      pages: [
        { speaker: 'narrator', text: 'You sit. The wind moves through the wheat. Somewhere behind you a cat is being extremely judgmental about a beetle.' },
        { speaker: 'rowan', text: '"This is the quiet I have been trying to reach for years. Turns out it is not a place. It is a permission."' },
      ],
    });
  };

  A.catAdoptScene = function () {
    SAN.ui.dialogue({
      pages: [
        { speaker: 'narrator', text: 'On the doorstep of your new cottage there is a small, extremely self-possessed cat. It looks at you like you are the one who has been adopted.' },
        { speaker: 'narrator', text: 'It has been waiting. You do not know for how long. You are not sure it would tell you.' },
      ],
      choices: [
        { label: 'Offer it your hand', cb: function () { SAN.ui.openPanel('catadopt'); } },
      ],
    });
  };

  A.firstJournalScene = function () {
    SAN.ui.dialogue({
      pages: [
        { speaker: 'narrator', text: 'On the desk: a notebook with a ribbon in it. The first page says, in handwriting that is almost yours: "For whatever you cannot say out loud."' },
        { speaker: 'narrator', text: 'There is a pen. There is no one watching. There is no correct thing to write.' },
      ],
      choices: [{ label: 'Open the journal', cb: function () { SAN.ui.openPanel('journal'); } }],
    });
  };
})();
</script>
<script>
/* Sanctuary — UI core: HUD, dialogue, toasts, panels, pause, transitions */
(function () {
  const UI = (SAN.ui = {});
  const U = SAN.util;
  const S = () => SAN.state.S;

  UI.panelStack = [];
  UI.dialogueState = null;
  UI.titleActive = true;
  UI.transitioning = false;
  UI.history = [];
  let dayCardTimer = 0;

  /* ---------------- init ---------------- */
  UI.init = function () {
    UI.root = document.getElementById('ui-root');
    UI.panelLayer = document.getElementById('panel-layer');
    UI.toastLayer = document.getElementById('toasts');
    UI.dialogueLayer = document.getElementById('dialogue-layer');
    UI.fadeEl = document.getElementById('fade');
    UI.hud = document.getElementById('hud');

    document.querySelectorAll('[data-panel]').forEach((btn) => {
      btn.addEventListener('click', () => {
        SAN.audio.init(); SAN.audio.sfx('click');
        const p = btn.getAttribute('data-panel');
        if (p === 'pause') UI.togglePause();
        else UI.openPanel(p);
      });
    });
    const pauseBtn = document.getElementById('btn-pause');
    if (pauseBtn) pauseBtn.addEventListener('click', () => { SAN.audio.sfx('click'); UI.togglePause(); });
    const camBtn = document.getElementById('hud-camera');
    if (camBtn) camBtn.addEventListener('click', () => { SAN.audio.init(); SAN.audio.sfx('click'); SAN.photos.open(); });

    document.getElementById('dialogue-layer').addEventListener('click', (e) => {
      if (e.target.closest('.dlg-choice') || e.target.closest('.dlg-btn')) return;
      UI.advanceDialogue();
    });
    UI.applySettings();
    UI.refreshHUD();
  };

  UI.applySettings = function () {
    const s = S() ? S().settings : (SAN.save.loadSettings() || {});
    if (!s) return;
    SAN.audio.applySettings(s);
    document.documentElement.style.setProperty('--text-speed', s.textSpeed || 1);
    document.body.classList.toggle('reduce-motion', !!s.reduceMotion);
    document.body.classList.toggle('hide-hints', s.showHints === false);
    const tc = document.getElementById('touch-ui');
    if (tc) tc.classList.toggle('force-show', !!s.alwaysShowTouch);
  };

  UI.isPaused = function () {
    return UI.panelStack.length > 0 || !!UI.dialogueState || UI.titleActive || UI.transitioning || !!(SAN.photos && SAN.photos.mode);
  };

  /* ---------------- toasts ---------------- */
  UI.toast = function (text, kind, iconUrl) {
    if (!UI.toastLayer) return;
    const el = document.createElement('div');
    el.className = 'toast toast-' + (kind || 'info');
    el.innerHTML = (iconUrl ? `<img src="${iconUrl}" alt="">` : '') + `<span>${U.esc(text)}</span>`;
    UI.toastLayer.appendChild(el);
    setTimeout(() => el.classList.add('in'), 10);
    setTimeout(() => {
      el.classList.remove('in');
      setTimeout(() => el.remove(), 450);
    }, kind === 'achievement' || kind === 'quest' ? 4600 : 3200);
    while (UI.toastLayer.children.length > 4) UI.toastLayer.firstChild.remove();
  };

  /* ---------------- fade transitions ---------------- */
  UI.fadeTo = function (cb, dur) {
    if (UI.transitioning) { cb && cb(); return; }
    UI.transitioning = true;
    if (UI.fadeEl) UI.fadeEl.classList.add('on');
    setTimeout(() => {
      try { cb && cb(); } catch (e) { console.error(e); }
      setTimeout(() => {
        if (UI.fadeEl) UI.fadeEl.classList.remove('on');
        UI.transitioning = false;
      }, 90);
    }, dur || 320);
  };

  /* ---------------- day card ---------------- */
  UI.dayCard = function () {
    const S_ = S();
    if (!S_) return;
    const el = document.getElementById('day-card');
    if (!el) return;
    const ev = SAN.time.todayEvent();
    const weatherIcons = { sunny: '☀', cloudy: '☁', rain: '🌧', storm: '⛈', fog: '🌫', snow: '❄' };
    el.innerHTML = `
      <div class="day-card-inner">
        <div class="day-season">${U.SEASONS[S_.time.season]}</div>
        <div class="day-num">Day ${S_.time.day}</div>
        <div class="day-year">Year ${S_.time.year}</div>
        <div class="day-weather">${weatherIcons[S_.time.weather] || '☀'} ${S_.time.weather}</div>
        ${ev ? `<div class="day-event">${U.esc(ev.name)}</div>` : ''}
      </div>`;
    el.classList.add('show');
    dayCardTimer = 3.2;
  };

  /* ---------------- HUD ---------------- */
  UI.refreshHUD = function () {
    const S_ = S();
    if (!S_ || !UI.hud) return;
    const weatherIcons = { sunny: '☀', cloudy: '☁', rain: '🌧', storm: '⛈', fog: '🌫', snow: '❄' };
    const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
    set('hud-date', U.SEASONS[S_.time.season] + ' ' + S_.time.day);
    set('hud-time', U.fmtClock(S_.time.minutes));
    set('hud-weather-icon', weatherIcons[S_.time.weather] || '☀');
    set('hud-weather-label', S_.time.weather);
    set('hud-money', S_.money.toLocaleString());
    set('hud-energy-text', Math.round(S_.energy) + '/' + S_.maxEnergy);
    set('hud-location', SAN.world.area ? SAN.world.area.name : '');
    set('hud-phase', U.phase(S_.time.minutes));
    const fill = document.getElementById('hud-energy-fill');
    if (fill) {
      const pct = Math.max(0, Math.min(100, (S_.energy / S_.maxEnergy) * 100));
      fill.style.width = pct + '%';
      fill.className = 'energy-fill' + (pct < 20 ? ' low' : pct < 45 ? ' mid' : '');
    }
    const questEl = document.getElementById('hud-quest');
    if (questEl) {
      const active = SAN.quests.activeList();
      const tracked = active.filter((q) => q.def.type !== 'daily').slice(0, 1)[0] || active[0];
      if (tracked) {
        const objs = SAN.quests.objectiveList(tracked.id);
        const cur = objs.find((o) => !o.done) || objs[0];
        questEl.innerHTML = `<div class="hq-title">${U.esc(tracked.def.title)}</div>
          <div class="hq-obj">${cur ? (cur.done ? 'Ready to turn in' : U.esc(cur.label) + ' ' + cur.cur + '/' + cur.need) : ''}</div>`;
        questEl.classList.remove('empty');
      } else {
        questEl.innerHTML = '<div class="hq-title quiet">No quests right now</div><div class="hq-obj">Talk to people. Things happen.</div>';
        questEl.classList.add('empty');
      }
    }
    const catEl = document.getElementById('hud-cat');
    if (catEl) {
      if (S_.cat.adopted) {
        catEl.style.display = '';
        catEl.querySelector('.cat-label').textContent = S_.cat.name + ' · ' + SAN.cat.hungerLabel();
      } else catEl.style.display = 'none';
    }
    const badge = document.getElementById('hud-quest-badge');
    if (badge) badge.style.display = active.length ? '' : 'none';
    const live = document.getElementById('hud-live');
    if (live) {
      const ev = SAN.time.todayEvent();
      live.textContent = ev ? ev.name : '';
      live.style.display = ev ? '' : 'none';
    }
  };

  /* ---------------- dialogue ---------------- */
  UI.dialogue = function (opts) {
    const o = Object.assign({ pages: [], choices: [], onClose: null }, opts || {});
    UI.dialogueState = {
      pages: o.pages.length ? o.pages : [{ speaker: 'narrator', text: '...' }],
      choices: o.choices || [],
      onClose: o.onClose,
      idx: 0, charIdx: 0, typing: true, acc: 0, chosen: false,
    };
    UI.dialogueLayer.classList.remove('hidden');
    UI.dialogueLayer.innerHTML = `<div class="dlg-box">
      <div class="dlg-portrait" id="dlg-portrait"></div>
      <div class="dlg-main">
        <div class="dlg-name" id="dlg-name"></div>
        <div class="dlg-text" id="dlg-text"></div>
        <div class="dlg-footer">
          <span class="dlg-hint" id="dlg-hint">click / E to continue</span>
          <button class="dlg-btn dlg-history" id="dlg-history" title="Dialogue history">History</button>
        </div>
        <div class="dlg-choices" id="dlg-choices"></div>
      </div>
    </div>`;
    document.getElementById('dlg-history').addEventListener('click', (e) => {
      e.stopPropagation();
      UI.openPanel('history');
    });
    SAN.audio.sfx('open');
    UI.renderDialoguePage();
  };

  UI.dialogueSpeaker = function (speakerId) {
    if (!speakerId) return { name: 'Sanctuary', portrait: '', narr: true };
    if (speakerId === 'narrator') return { name: '', portrait: '', narr: true };
    if (speakerId === 'player') {
      const S_ = S();
      return { name: S_.player.name, portrait: SAN.render.portrait('player'), narr: false, accent: S_.player.colors.dress };
    }
    const npc = SAN.data.npcs[speakerId];
    if (!npc) return { name: speakerId, portrait: '', narr: true };
    return { name: npc.name, portrait: SAN.render.portrait(speakerId), narr: false, accent: npc.colors.dress, title: npc.title };
  };

  UI.renderDialoguePage = function () {
    const d = UI.dialogueState;
    if (!d) return;
    const page = d.pages[d.idx];
    const sp = UI.dialogueSpeaker(page.speaker);
    const box = UI.dialogueLayer.querySelector('.dlg-box');
    if (box) box.classList.toggle('narration', sp.narr);
    const portraitEl = document.getElementById('dlg-portrait');
    if (portraitEl) {
      const who = page.speaker === 'player' ? 'player' : page.speaker;
      const mood = SAN.render.moodFor(page.text);
      portraitEl.innerHTML = sp.narr ? '' : SAN.render.portrait(who, { mood });
      portraitEl.style.borderColor = sp.accent ? U.rgba(sp.accent, 0.7) : '';
      portraitEl.classList.remove('expr-in');
      void portraitEl.offsetWidth;
      portraitEl.classList.add('expr-in');
      portraitEl.dataset.mood = mood;
    }
    const nameEl = document.getElementById('dlg-name');
    if (nameEl) {
      nameEl.innerHTML = sp.narr ? '' : U.esc(sp.name) + (sp.title ? `<span class="dlg-role">${U.esc(sp.title)}</span>` : '');
      nameEl.style.color = sp.accent || '';
    }
    d.typing = true; d.charIdx = 0; d.acc = 0;
    const textEl = document.getElementById('dlg-text');
    if (textEl) textEl.textContent = '';
    const hint = document.getElementById('dlg-hint');
    if (hint) hint.textContent = 'click / E to continue';
    const ch = document.getElementById('dlg-choices');
    if (ch) ch.innerHTML = '';
    if (page.speaker !== 'narrator') {
      UI.history.unshift({ name: sp.name, text: page.text });
      if (UI.history.length > 120) UI.history.pop();
    }
  };

  UI.advanceDialogue = function () {
    const d = UI.dialogueState;
    if (!d) return;
    const page = d.pages[d.idx];
    if (d.typing) {
      d.charIdx = page.text.length;
      d.typing = false;
      const el = document.getElementById('dlg-text');
      if (el) el.textContent = page.text;
      UI.showChoicesIfNeeded();
      return;
    }
    if (d.idx < d.pages.length - 1) {
      d.idx++;
      UI.renderDialoguePage();
      SAN.audio.sfx('page');
      return;
    }
    if (d.choices.length && !d.chosen) { UI.showChoicesIfNeeded(true); return; }
    UI.closeDialogue();
  };

  UI.showChoicesIfNeeded = function (force) {
    const d = UI.dialogueState;
    if (!d) return;
    if (d.idx < d.pages.length - 1 && !force) return;
    if (!d.choices.length) return;
    const el = document.getElementById('dlg-choices');
    if (!el || el.children.length) return;
    d.choices.forEach((c, i) => {
      const b = document.createElement('button');
      b.className = 'dlg-choice';
      b.innerHTML = `<span class="dlg-num">${i + 1}</span>${U.esc(c.label)}`;
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        UI.chooseDialogue(i);
      });
      el.appendChild(b);
    });
  };

  UI.chooseDialogue = function (i) {
    const d = UI.dialogueState;
    if (!d || !d.choices[i]) return;
    const c = d.choices[i];
    d.chosen = true;
    SAN.audio.sfx('click');
    const onClose = d.onClose;
    UI.dialogueState = null;
    UI.dialogueLayer.classList.add('hidden');
    UI.dialogueLayer.innerHTML = '';
    if (onClose) onClose();
    if (c.cb) setTimeout(() => { try { c.cb(); } catch (e) { console.error(e); } }, 30);
  };

  UI.closeDialogue = function () {
    const d = UI.dialogueState;
    if (!d) return;
    const onClose = d.onClose;
    UI.dialogueState = null;
    UI.dialogueLayer.classList.add('hidden');
    UI.dialogueLayer.innerHTML = '';
    if (onClose) onClose();
  };

  UI.updateDialogue = function (dt) {
    const d = UI.dialogueState;
    if (!d || !d.typing) return;
    const page = d.pages[d.idx];
    const speed = 26 * ((S() && S().settings.textSpeed) || 1);
    d.acc += dt * speed;
    const target = Math.min(page.text.length, Math.floor(d.acc));
    if (target !== d.charIdx) {
      d.charIdx = target;
      const el = document.getElementById('dlg-text');
      if (el) el.textContent = page.text.slice(0, d.charIdx);
      if (d.charIdx % 3 === 0) SAN.audio.sfx('click');
    }
    if (d.charIdx >= page.text.length) {
      d.typing = false;
      UI.showChoicesIfNeeded();
    }
  };

  /* ---------------- panels ---------------- */
  UI.panel = function (name, title, bodyHTML, opts) {
    const o = opts || {};
    const el = document.createElement('div');
    el.className = 'panel-wrap';
    el.dataset.panel = name;
    el.innerHTML = `
      <div class="panel-card ${o.wide ? 'wide' : ''} ${o.className || ''}">
        <div class="panel-head">
          <div class="panel-title">${U.esc(title)}</div>
          ${o.noClose ? '' : '<button class="panel-close" aria-label="Close">✕</button>'}
        </div>
        <div class="panel-body">${bodyHTML}</div>
        ${o.footer ? `<div class="panel-foot">${o.footer}</div>` : ''}
      </div>`;
    const closeBtn = el.querySelector('.panel-close');
    if (closeBtn) closeBtn.addEventListener('click', () => UI.closeTop());
    if (!o.noClose) el.addEventListener('mousedown', (e) => { if (e.target === el) UI.closeTop(); });
    UI.panelLayer.appendChild(el);
    UI.panelStack.push({ name, el });
    UI.panelLayer.classList.remove('hidden');
    SAN.audio.sfx('open');
    return el;
  };

  UI.closeTop = function () {
    const top = UI.panelStack.pop();
    if (top) { top.el.remove(); SAN.audio.sfx('close'); }
    if (!UI.panelStack.length) UI.panelLayer.classList.add('hidden');
    else UI.panelLayer.classList.remove('hidden');
  };

  UI.closePanel = function (name) {
    for (let i = UI.panelStack.length - 1; i >= 0; i--) {
      if (UI.panelStack[i].name === name) {
        UI.panelStack[i].el.remove();
        UI.panelStack.splice(i, 1);
      }
    }
    if (!UI.panelStack.length) UI.panelLayer.classList.add('hidden');
  };

  UI.closeAll = function () {
    UI.panelStack.forEach((p) => p.el.remove());
    UI.panelStack = [];
    UI.panelLayer.classList.add('hidden');
    UI.closeDialogue();
  };

  UI.topPanel = () => (UI.panelStack.length ? UI.panelStack[UI.panelStack.length - 1].name : null);

  UI.openPanel = function (name, data) {
    if (UI.titleActive) return;
    const builder = UI.PANELS[name];
    if (!builder) { console.warn('No panel', name); return; }
    if (UI.panelStack.some((p) => p.name === name)) { UI.closePanel(name); return; }
    builder(data || {});
  };

  UI.refreshPanel = function (name, data) {
    UI.closePanel(name);
    UI.openPanel(name, data);
  };

  UI.confirm = function (title, body, onYes, onNo) {
    const el = UI.panel('confirm', title,
      `<p class="confirm-body">${U.esc(body)}</p>
       <div class="confirm-actions">
         <button class="btn btn-primary" id="cf-yes">Yes</button>
         <button class="btn btn-ghost" id="cf-no">Not now</button>
       </div>`, { className: 'small-panel' });
    el.querySelector('#cf-yes').addEventListener('click', () => {
      UI.closePanel('confirm');
      onYes && onYes();
    });
    el.querySelector('#cf-no').addEventListener('click', () => {
      UI.closePanel('confirm');
      onNo && onNo();
    });
  };

  /* ---------------- pause ---------------- */
  UI.togglePause = function () {
    if (UI.titleActive) return;
    if (UI.topPanel() === 'pause') { UI.closePanel('pause'); return; }
    if (UI.panelStack.length) { UI.closeAll(); return; }
    if (UI.dialogueState) { UI.advanceDialogue(); return; }
    UI.openPanel('pause');
  };

  /* ---------------- keyboard ---------------- */
  UI.handleKey = function (k) {
    if (UI.titleActive) return true;
    if (SAN.photos && SAN.photos.mode) {
      if (k === 'Escape' || k === 'p' || k === 'P') { SAN.photos.close(); return true; }
      if (k === 'c' || k === 'C' || k === 'Enter' || k === ' ') { SAN.photos.capture(); return true; }
      return true;
    }
    if (UI.dialogueState) {
      if (k === 'Escape') { UI.closeDialogue(); return true; }
      if (k === ' ' || k === 'e' || k === 'E' || k === 'Enter') { UI.advanceDialogue(); return true; }
      if (/^[1-6]$/.test(k)) { UI.chooseDialogue(parseInt(k, 10) - 1); return true; }
      return true;
    }
    if (UI.panelStack.length) {
      if (k === 'Escape') { UI.closeTop(); return true; }
      if (k === 'i' || k === 'I') { UI.openPanel('inventory'); return true; }
      if (k === 'j' || k === 'J') { UI.openPanel('journal'); return true; }
      if (k === 'm' || k === 'M') { UI.openPanel('map'); return true; }
      if (k === 'q' || k === 'Q') { UI.openPanel('quests'); return true; }
      return false;
    }
    if (k === 'Escape') { UI.togglePause(); return true; }
    if (k === 'i' || k === 'I') { UI.openPanel('inventory'); return true; }
    if (k === 'j' || k === 'J') { UI.openPanel('journal'); return true; }
    if (k === 'm' || k === 'M') { UI.openPanel('map'); return true; }
    if (k === 'q' || k === 'Q') { UI.openPanel('quests'); return true; }
    if (k === 'v' || k === 'V') { UI.openPanel('memories'); return true; }
    if (k === 'r' || k === 'R') { UI.openPanel('relations'); return true; }
    if (k === 'c' || k === 'C') { UI.openPanel('collection'); return true; }
    if (k === 'p' || k === 'P') { SAN.photos.open(); return true; }
    return false;
  };

  UI.update = function (dt) {
    UI.updateDialogue(dt);
    if (dayCardTimer > 0) {
      dayCardTimer -= dt;
      if (dayCardTimer <= 0) {
        const el = document.getElementById('day-card');
        if (el) el.classList.remove('show');
      }
    }
  };

  UI.button = function (label, cls, onClick, attrs) {
    const b = document.createElement('button');
    b.className = 'btn ' + (cls || '');
    b.innerHTML = label;
    if (attrs) Object.keys(attrs).forEach((k) => b.setAttribute(k, attrs[k]));
    b.addEventListener('click', (e) => { e.stopPropagation(); SAN.audio.sfx('click'); onClick(b); });
    return b;
  };
})();
</script>
<script>
/* Sanctuary — all interactive panels */
(function () {
  const UI = SAN.ui;
  const U = SAN.util;
  const S = () => SAN.state.S;
  const P = (UI.PANELS = {});

  const catNames = { seeds: 'Seeds', crops: 'Crops', fish: 'Fish', flowers: 'Flowers', food: 'Food', materials: 'Materials', tools: 'Tools', quest: 'Quest Items', furniture: 'Furniture', collectibles: 'Collectibles' };
  const catOrder = ['seeds', 'crops', 'flowers', 'fish', 'food', 'materials', 'tools', 'furniture', 'collectibles', 'quest'];

  function icon(id, size) {
    return `<img class="item-icon" src="${SAN.render.itemIcon(id)}" alt="" style="width:${size || 32}px;height:${size || 32}px">`;
  }
  function bar(pct, cls) {
    return `<div class="bar ${cls || ''}"><i style="width:${Math.max(0, Math.min(100, pct))}%"></i></div>`;
  }
  function moodDot(moodId) {
    const m = SAN.journal.moodDef(moodId);
    return `<span class="mood-dot" style="background:${m.color}" title="${m.label}"></span>`;
  }

  /* =========================================================
     INVENTORY
     ========================================================= */
  P.inventory = function (data) {
    let activeCat = data.cat || 'all';
    const el = UI.panel('inventory', 'Satchel', `
      <div class="inv-top">
        <div class="inv-money">${icon('stone', 18)} <b>${S().money}</b> coins</div>
        <div class="inv-cat-tabs" id="inv-tabs"></div>
      </div>
      <div class="inv-grid" id="inv-grid"></div>
      <div class="inv-empty" id="inv-empty" style="display:none">Nothing here yet. The world is generous, if you look.</div>`,
      { wide: true });

    function render() {
      const tabs = el.querySelector('#inv-tabs');
      tabs.innerHTML = '';
      ['all'].concat(catOrder).forEach((cat) => {
        const b = UI.button(cat === 'all' ? 'All' : catNames[cat], 'chip ' + (activeCat === cat ? 'active' : ''), () => {
          activeCat = cat; render();
        });
        tabs.appendChild(b);
      });
      const grid = el.querySelector('#inv-grid');
      grid.innerHTML = '';
      const list = SAN.state.inventoryList().filter((e) => activeCat === 'all' || e.def.cat === activeCat);
      list.sort((a, b) => catOrder.indexOf(a.def.cat) - catOrder.indexOf(b.def.cat));
      el.querySelector('#inv-empty').style.display = list.length ? 'none' : '';
      list.forEach((entry) => {
        const card = document.createElement('button');
        card.className = 'inv-card rarity-' + (entry.def.rarity || 'common');
        card.innerHTML = `${icon(entry.id)}<span class="inv-name">${U.esc(entry.def.name)}</span><span class="inv-qty">×${entry.qty}</span>`;
        card.addEventListener('click', () => { SAN.audio.sfx('click'); itemDetail(entry.id); });
        grid.appendChild(card);
      });
      if (!list.length) {
        grid.innerHTML = `<div class="empty-note">No ${activeCat === 'all' ? 'items' : catNames[activeCat] || 'items'} yet.</div>`;
      }
    }
    function itemDetail(id) {
      const def = SAN.data.item(id);
      const qty = SAN.state.count(id);
      const canEat = !!def.energy;
      const canPlace = !!def.placeable;
      const canSell = def.sell > 0;
      const body = `
        <div class="item-detail">
          <div class="item-detail-art">${icon(id, 72)}</div>
          <div class="item-detail-info">
            <div class="item-detail-name">${U.esc(def.name)}</div>
            <div class="item-detail-meta">${catNames[def.cat] || def.cat} · <span class="rarity-${def.rarity}">${def.rarity}</span> · ×${qty}</div>
            <p class="item-detail-desc">${U.esc(def.desc)}</p>
            ${def.energy ? `<div class="tagline">Restores ${def.energy} energy</div>` : ''}
            ${canSell ? `<div class="tagline">Sells for ${def.sell} coins</div>` : ''}
          </div>
        </div>
        <div class="item-actions">
          ${canEat ? `<button class="btn btn-primary" id="it-eat">Eat</button>` : ''}
          ${canPlace ? `<button class="btn" id="it-place">Decorate with this</button>` : ''}
          ${canSell ? `<button class="btn" id="it-sell">Sell 1 (${def.sell})</button>` : ''}
          ${canSell && qty > 1 ? `<button class="btn btn-ghost" id="it-sellall">Sell all (${def.sell * qty})</button>` : ''}
        </div>
        <p class="fineprint">Gifts can be given while talking to someone.</p>`;
      const d = UI.panel('itemdetail', def.name, body, { className: 'small-panel' });
      const eat = d.querySelector('#it-eat');
      if (eat) eat.addEventListener('click', () => { SAN.craft.eat(id); UI.closePanel('itemdetail'); render(); UI.refreshHUD(); });
      const sell = d.querySelector('#it-sell');
      if (sell) sell.addEventListener('click', () => {
        SAN.state.removeItem(id, 1); SAN.state.earn(def.sell);
        UI.closePanel('itemdetail'); render(); UI.refreshHUD();
      });
      const sellAll = d.querySelector('#it-sellall');
      if (sellAll) sellAll.addEventListener('click', () => {
        const n = SAN.state.count(id);
        SAN.state.removeItem(id, n); SAN.state.earn(def.sell * n);
        UI.closePanel('itemdetail'); render(); UI.refreshHUD();
      });
      const place = d.querySelector('#it-place');
      if (place) place.addEventListener('click', () => {
        UI.closePanel('itemdetail'); UI.closePanel('inventory');
        if (S().player.area !== 'home') { UI.toast('You can only place furniture inside your cottage.', 'info'); return; }
        P.decorate({ select: id });
      });
    }
    render();
  };

  /* =========================================================
     SHOP
     ========================================================= */
  P.shop = function (data) {
    const shopId = data.shopId || 'store';
    const shop = SAN.data.shops[shopId];
    if (!shop) return;
    let tab = 'buy';
    const lvl = S().levels.farming.lvl;
    const extra = [];
    if (shopId === 'store' && lvl >= 3) extra.push('seed_starflower');
    if (shopId === 'flower' && S().levels.exploration.lvl >= 4) extra.push('snowdrop');
    const stock = shop.stock.filter((id) => SAN.data.items[id] || id === 'plant_lavender').concat(extra);
    const el = UI.panel('shop', shop.name, `
      <p class="shop-line">${U.esc(shop.line || '')}</p>
      <div class="shop-tabs">
        <button class="chip active" data-tab="buy">Buy</button>
        <button class="chip" data-tab="sell">Sell</button>
        <span class="shop-money">${icon('stone', 16)} <b>${S().money}</b></span>
      </div>
      <div id="shop-body" class="shop-body"></div>`, { wide: true });

    function renderBuy() {
      const body = el.querySelector('#shop-body');
      body.innerHTML = `<div class="shop-grid"></div>`;
      const grid = body.querySelector('.shop-grid');
      stock.forEach((id) => {
        const def = SAN.data.item(id);
        if (!def || !def.buy) return;
        const card = document.createElement('div');
        card.className = 'shop-card';
        card.innerHTML = `${icon(id, 34)}<div class="shop-card-info"><div class="shop-card-name">${U.esc(def.name)}</div>
          <div class="shop-card-desc">${U.esc(def.desc.slice(0, 58))}${def.desc.length > 58 ? '…' : ''}</div></div>
          <div class="shop-card-buy">
            <span class="price">${def.buy}</span>
            <button class="btn btn-small" data-buy="1">Buy</button>
            <button class="btn btn-small btn-ghost" data-buy="5">×5</button>
          </div>`;
        card.querySelectorAll('[data-buy]').forEach((b) => {
          b.addEventListener('click', () => {
            const n = parseInt(b.getAttribute('data-buy'), 10);
            const cost = def.buy * n;
            if (S().money < cost) { UI.toast('Not enough coins.', 'warn'); SAN.audio.sfx('error'); return; }
            SAN.state.spend(cost);
            SAN.state.addItem(id, n);
            SAN.audio.sfx('coin');
            UI.refreshHUD();
            el.querySelector('.shop-money b').textContent = S().money;
          });
        });
        grid.appendChild(card);
      });
      if (!grid.children.length) grid.innerHTML = '<div class="empty-note">The shelves are empty today.</div>';
    }
    function renderSell() {
      const body = el.querySelector('#shop-body');
      const list = SAN.state.inventoryList().filter((e) => e.def.sell > 0);
      body.innerHTML = `<div class="shop-grid"></div>`;
      const grid = body.querySelector('.shop-grid');
      list.forEach((e) => {
        const card = document.createElement('div');
        card.className = 'shop-card';
        card.innerHTML = `${icon(e.id, 34)}<div class="shop-card-info"><div class="shop-card-name">${U.esc(e.def.name)} ×${e.qty}</div>
          <div class="shop-card-desc">Sells for ${e.def.sell}</div></div>
          <div class="shop-card-buy"><button class="btn btn-small">Sell 1</button></div>`;
        card.querySelector('button').addEventListener('click', () => {
          SAN.state.removeItem(e.id, 1); SAN.state.earn(e.def.sell);
          UI.refreshHUD(); renderSell();
        });
        grid.appendChild(card);
      });
      if (!list.length) grid.innerHTML = '<div class="empty-note">Nothing to sell. Everything you own is either precious or a memory.</div>';
    }
    el.querySelectorAll('[data-tab]').forEach((b) => {
      b.addEventListener('click', () => {
        tab = b.getAttribute('data-tab');
        el.querySelectorAll('[data-tab]').forEach((x) => x.classList.toggle('active', x === b));
        if (tab === 'buy') renderBuy(); else renderSell();
      });
    });
    renderBuy();
  };

  /* =========================================================
     JOURNAL
     ========================================================= */
  P.journal = function (data) {
    const el = UI.panel('journal', 'Journal', `
      <div class="journal-tabs">
        <button class="chip active" data-j="write">Write</button>
        <button class="chip" data-j="entries">Entries (${S().journal.length})</button>
        <button class="chip" data-j="about">Privacy</button>
      </div>
      <div id="journal-body"></div>`, { wide: true });
    const body = el.querySelector('#journal-body');

    function writeView(prefill) {
      body.innerHTML = `
        <div class="journal-paper">
          <div class="journal-date">${U.SEASONS[S().time.season]} ${S().time.day} · Year ${S().time.year} · ${U.fmtTime(S().time.minutes)}</div>
          <textarea id="j-text" class="journal-textarea" placeholder="Write whatever is actually true. No one else will read this.">${U.esc((prefill && prefill.text) || '')}</textarea>
          <div class="journal-section-label">How does today feel?</div>
          <div class="mood-row" id="mood-row">${SAN.data.moods.map((m) => `<button class="mood-chip" data-mood="${m.id}" style="--mood:${m.color}"><span class="mood-orb"></span>${m.label}</button>`).join('')}</div>
          <div class="journal-section-label">Tags (optional)</div>
          <div class="tag-row" id="tag-row">${SAN.data.journalTags.map((t) => `<button class="tag-chip" data-tag="${U.esc(t)}">${U.esc(t)}</button>`).join('')}</div>
          <div class="journal-actions">
            <button class="btn btn-primary" id="j-save">Save entry</button>
            <span class="fineprint">Private by design. Stored on this device only.</span>
          </div>
        </div>`;
      let mood = 'calm';
      const tags = new Set();
      body.querySelectorAll('[data-mood]').forEach((b) => {
        b.addEventListener('click', () => {
          mood = b.getAttribute('data-mood');
          body.querySelectorAll('[data-mood]').forEach((x) => x.classList.toggle('active', x === b));
        });
      });
      body.querySelectorAll('[data-tag]').forEach((b) => {
        b.addEventListener('click', () => {
          const t = b.getAttribute('data-tag');
          if (tags.has(t)) { tags.delete(t); b.classList.remove('active'); } else { tags.add(t); b.classList.add('active'); }
        });
      });
      body.querySelector('#j-save').addEventListener('click', () => {
        const text = body.querySelector('#j-text').value.trim();
        if (text.length < 2) { UI.toast('Write at least a few words. Even one sentence is enough.', 'warn'); return; }
        const rec = SAN.journal.save({ text, mood, tags: Array.from(tags) });
        SAN.audio.sfx('page');
        reflectionView(rec);
      });
    }

    function reflectionView(rec) {
      const r = rec.reflection;
      const m = SAN.journal.moodDef(rec.mood);
      body.innerHTML = `
        <div class="reflection">
          <div class="reflection-head">
            <span class="mood-orb big" style="background:${m.color}"></span>
            <div>
              <div class="reflection-title">A gentle thought</div>
              <div class="fineprint">${m.label} · saved privately</div>
            </div>
          </div>
          <div class="reflection-text">${U.esc(r.text).replace(/\n\n/g, '</p><p>')}</div>
          <div class="reflection-prompt">
            <div class="prompt-label">A question, if you want one</div>
            <div class="prompt-text">${U.esc(r.prompt)}</div>
          </div>
          <div class="reflection-choices">
            <button class="btn" id="r-reflect">Reflect on this feeling</button>
            ${r.activity ? `<button class="btn" id="r-activity">${U.esc(r.activity.label)}</button>` : ''}
            <button class="btn btn-primary" id="r-rest">Save this entry and rest</button>
          </div>
          <p class="fineprint disclaimer">Sanctuary is a game, not therapy. It cannot diagnose anything and does not replace professional care. You can close this at any time.</p>
        </div>`;
      body.querySelector('#r-reflect').addEventListener('click', () => {
        body.querySelector('.reflection-prompt').classList.add('pulse');
        UI.toast('Sit with the question. You do not have to answer it today.', 'info');
      });
      const act = body.querySelector('#r-activity');
      if (act) act.addEventListener('click', () => {
        const a = r.activity;
        if (a.type === 'sleep') { UI.closeAll(); SAN.actions.sleepConfirm(); return; }
        UI.closeAll();
        if (a.type === 'visit' && SAN.world.areas[a.area]) {
          UI.confirm('Go there now?', a.line, () => {
            const ar = SAN.world.areas[a.area];
            SAN.actions.enterArea(a.area, ar.spawn.x, ar.spawn.y);
          });
        }
      });
      body.querySelector('#r-rest').addEventListener('click', () => {
        UI.closeAll();
        UI.toast('Entry saved. It is yours. Nobody else has it.', 'info');
      });
    }

    function entriesView() {
      let q = '', moodFilter = '';
      const draw = () => {
        const list = SAN.journal.list({ q, mood: moodFilter });
        body.innerHTML = `
          <div class="journal-tools">
            <input id="j-search" class="text-input" placeholder="Search your entries…" value="${U.esc(q)}">
            <select id="j-mood-filter" class="text-input select">
              <option value="">All moods</option>
              ${SAN.data.moods.map((m) => `<option value="${m.id}" ${moodFilter === m.id ? 'selected' : ''}>${m.label}</option>`).join('')}
            </select>
            <button class="btn btn-small" id="j-export">Export</button>
          </div>
          <div class="entry-list">${list.length ? '' : '<div class="empty-note">No entries match. Your words are still there.</div>'}</div>`;
        const listEl = body.querySelector('.entry-list');
        list.forEach((e) => {
          const item = document.createElement('button');
          item.className = 'entry-card';
          item.innerHTML = `<div class="entry-top">${moodDot(e.mood)}<span class="entry-date">${U.SEASONS[e.season]} ${e.day}, Year ${e.year}</span>
            <span class="entry-mood">${SAN.journal.moodLabel(e.mood)}</span></div>
            <div class="entry-snippet">${U.esc(e.text.slice(0, 170))}${e.text.length > 170 ? '…' : ''}</div>
            <div class="entry-tags">${(e.tags || []).map((t) => `<span class="tag-pill">${U.esc(t)}</span>`).join('')}</div>`;
          item.addEventListener('click', () => entryDetail(e));
          listEl.appendChild(item);
        });
        body.querySelector('#j-search').addEventListener('input', (ev) => { q = ev.target.value; draw(); });
        body.querySelector('#j-mood-filter').addEventListener('change', (ev) => { moodFilter = ev.target.value; draw(); });
        body.querySelector('#j-export').addEventListener('click', exportJournal);
      };
      draw();
    }

    function entryDetail(e) {
      const r = e.reflection || {};
      const d = UI.panel('journalentry', U.SEASONS[e.season] + ' ' + e.day + ', Year ' + e.year, `
        <div class="entry-full">${U.esc(e.text).replace(/\n/g, '<br>')}</div>
        <div class="entry-meta-row">${moodDot(e.mood)} ${SAN.journal.moodLabel(e.mood)} · ${U.fmtTime(e.minutes)}
          ${(e.tags || []).map((t) => `<span class="tag-pill">${U.esc(t)}</span>`).join('')}</div>
        ${r.text ? `<div class="entry-reflection"><div class="prompt-label">What Sanctuary said</div><p>${U.esc(r.text).replace(/\n\n/g, '</p><p>')}</p>
          <div class="prompt-label">Prompt</div><p class="prompt-text">${U.esc(r.prompt || '')}</p></div>` : ''}
        <div class="item-actions">
          <button class="btn btn-ghost" id="j-del">Delete this entry</button>
        </div>`, { className: 'medium-panel' });
      d.querySelector('#j-del').addEventListener('click', () => {
        UI.confirm('Delete this entry?', 'This removes it from this device permanently. You cannot undo it.', () => {
          SAN.journal.remove(e.id);
          UI.closePanel('journalentry');
          UI.refreshPanel('journal');
        });
      });
    }

    function exportJournal() {
      const text = SAN.journal.exportData();
      try {
        const blob = new Blob([text], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'sanctuary-journal.json';
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        UI.toast('Journal exported to a file on your device.', 'save');
      } catch (err) {
        UI.toast('Export failed in this browser.', 'warn');
      }
    }

    function aboutView() {
      body.innerHTML = `
        <div class="journal-paper">
          <h3 class="paper-title">Your private pages</h3>
          <p>Journal entries and Memory Vault notes are stored only in this browser's local storage. They are never uploaded, sent to a server, or included in save exports unless you use the journal export button.</p>
          <p>Sanctuary uses a local, rule-based reflection engine. No AI service receives your writing. There is an optional setting for AI-assisted reflections, and it is off by default — even when enabled, nothing is sent unless you explicitly consent per entry.</p>
          <p>You can delete any entry or memory at any time. You can export everything and keep your own copy.</p>
          <p class="soft">Sanctuary is a game. It is not a therapist, a diagnosis, or a treatment. If you are struggling, please talk to a real person — a friend, a counsellor, or a local crisis line. You deserve support that can actually hold you.</p>
          <div class="journal-actions">
            <button class="btn btn-ghost" id="j-export2">Export journal + memories</button>
            <button class="btn btn-ghost" id="j-delall">Delete all entries</button>
          </div>
        </div>`;
      body.querySelector('#j-export2').addEventListener('click', exportJournal);
      body.querySelector('#j-delall').addEventListener('click', () => {
        UI.confirm('Delete every journal entry?', 'All ' + S().journal.length + ' entries will be removed from this device.', () => {
          S().journal = [];
          UI.refreshPanel('journal');
        });
      });
    }

    el.querySelectorAll('[data-j]').forEach((b) => {
      b.addEventListener('click', () => {
        el.querySelectorAll('[data-j]').forEach((x) => x.classList.toggle('active', x === b));
        const t = b.getAttribute('data-j');
        if (t === 'write') writeView();
        else if (t === 'entries') entriesView();
        else aboutView();
      });
    });

    if (data.entryId) entriesView(); else writeView();
  };

  P.memories = function (data) {

      const d = UI.panel('memorydetail', m.title, `
        <div class="memory-detail-art stage-${m.progress}">
          <span>${m.progress === 0 ? '🪨' : m.progress === 1 ? '🌱' : m.progress === 2 ? '🌿' : m.progress === 3 ? '🌷' : m.progress === 4 ? '🌸' : '✨'}</span>

        <div class="memory-detail-meta">${U.esc(m.emotion)} · ${U.esc(SAN.memory.stageName(m.progress))}</div>

          <button class="btn btn-ghost" id="mem-del">Let this stone go</button>
          <button class="btn" id="mem-close">Close</button>
        </div>
        <p class="fineprint">You can skip, pause, or close this at any time. You never have to revisit anything.</p>`,
        { className: 'medium-panel' });
      d.querySelectorAll('[data-care]').forEach((b) => {
        b.addEventListener('click', () => {
          const res = SAN.memory.care(m.id, b.getAttribute('data-care'));
          if (!res.ok) { UI.toast(res.msg, 'info'); return; }
          SAN.ui.closePanel('memorydetail');
          UI.dialogue({
            pages: [
              { speaker: 'narrator', text: res.line },
              { speaker: 'narrator', text: res.stage + '. ' + SAN.memory.stageDesc(res.progress) },
            ],
            choices: [{ label: 'Sit a moment longer', cb: () => detailView(m) }, { label: 'Return to the garden', cb: () => {} }],
          });
        });
      });
      const del = d.querySelector('#mem-del');
      del.addEventListener('click', () => {
        UI.confirm('Let this stone go?', 'It will be removed from your garden on this device. This cannot be undone.', () => {
          SAN.memory.delete(m.id);
          UI.closePanel('memorydetail');
          UI.refreshPanel('memories');
          UI.toast('The stone is gone. The garden is still yours.', 'info');
        });
      });
      d.querySelector('#mem-close').addEventListener('click', () => UI.closePanel('memorydetail'));
    }

    el.querySelectorAll('[data-v]').forEach((b) => {
      b.addEventListener('click', () => {
        el.querySelectorAll('[data-v]').forEach((x) => x.classList.toggle('active', x === b));
        if (b.getAttribute('data-v') === 'new') createView(); else gardenView();
      });
    });

  function relDetail(id) {
    const npc = SAN.data.npcs[id];
    const f = SAN.rel.get(id);
    const tier = SAN.data.friendTier(f.pts);
    const knowsTastes = f.pts >= 21;
    const S_ = SAN.state.S;
    const nearby = (SAN.world.npcs || []).find((n) => n.def.id === id);
    const here = nearby ? SAN.world.area.name : (SAN.world.areas[npc.homeArea] || {}).name || 'Somewhere in Sanctuary';
    const doing = nearby ? (nearby.act || 'going about their day') : 'away from the path';
    const milestones = ((SAN.data.npcLife[id] || {}).milestones) || {};
    const reached = Object.keys(milestones).map(Number).filter((n) => f.pts >= n).sort((a, b) => a - b);
    const next = Object.keys(milestones).map(Number).filter((n) => f.pts < n).sort((a, b) => a - b)[0];
    const d = UI.panel('reldetail', npc.name, `
      <div class="rel-detail-head">
        <div class="rel-detail-portrait">${SAN.render.portrait(id)}</div>
        <div class="rel-detail-text">
          <div class="rel-name big">${U.esc(npc.name)}</div>
          <div class="rel-title">${U.esc(npc.title)}${npc.age ? ' · ' + npc.age : ''}</div>
          <div class="rel-tier">${tier.name} · ${f.pts}/100</div>
          ${bar(f.pts)}
        </div>
      </div>
      <p class="rel-bio">${U.esc(npc.bio)}</p>
      <p class="rel-personality">${U.esc(npc.personality)}</p>
      <div class="rel-where">
        <span class="rel-where-dot"></span>
        <span><b>${U.esc(here)}</b> · ${U.esc(doing)}</span>
      </div>
      <div class="rel-milestones">
        <div class="prompt-label">Moments you have shared</div>
        <div class="ms-track">${Object.keys(milestones).map((k) => `<span class="ms-pip ${f.pts >= Number(k) ? 'on' : ''}" title="${Number(k)} friendship">${f.pts >= Number(k) ? '✦' : '·'}</span>`).join('')}</div>
        <div class="fineprint">${reached.length ? reached.length + ' of ' + Object.keys(milestones).length + ' milestone scenes unlocked' : 'No milestone scenes yet'}${next ? ' · next at ' + next + ' friendship' : ''}</div>

      <div class="likes-box">
        <div class="prompt-label">${knowsTastes ? 'Loves' : 'You do not know their tastes yet'}</div>
        <div class="likes-list">${knowsTastes ? (npc.loves || []).map((i) => `<span class="tag-pill">${U.esc(SAN.data.item(i).name)}</span>`).join('') : '<span class="fineprint">Talk with them more. People reveal themselves slowly.</span>'}</div>
      </div>
      <div class="fineprint">Friendship never decays — the village is not keeping score. Gifts: ${f.giftsToday || 0}/2 today.</div>`,
      { className: 'medium-panel' });
  }

  P.map = function () {
    const NODES = {
      meadow: { x: 50, y: 8, label: 'Hidden Meadow' },
      forest: { x: 50, y: 26, label: 'Memory Forest' },
      greenhouse: { x: 18, y: 20, label: 'Greenhouse' },
      garden: { x: 18, y: 40, label: 'The Garden' },
      village: { x: 50, y: 46, label: 'Village' },
      windmill: { x: 80, y: 38, label: 'Windmill' },
      beach: { x: 49, y: 68, label: 'The Shore' },
      lighthouse: { x: 78, y: 74, label: 'Lighthouse' },
      home: { x: 33, y: 58, label: 'Your Cottage' },
    };
    const S_ = S();
    const groveOpen = !!(S_.world && S_.world.groveOpen);
    if (groveOpen) NODES.grove = { x: 36, y: 12, label: 'Hidden Grove' };
    const LINKS = [['village', 'forest'], ['village', 'garden'], ['village', 'windmill'], ['village', 'beach'], ['beach', 'lighthouse'], ['garden', 'greenhouse'], ['forest', 'meadow'], ['home', 'village']];
    if (groveOpen) LINKS.push(['forest', 'grove']);
    let html = '<div class="map-canvas">';
    html += '<svg class="map-lines" viewBox="0 0 100 100" preserveAspectRatio="none">' +
      LINKS
        .map(([a, b]) => `<line x1="${NODES[a].x}" y1="${NODES[a].y}" x2="${NODES[b].x}" y2="${NODES[b].y}" />`).join('') +
      '</svg>';
    Object.keys(NODES).forEach((id) => {
      const n = NODES[id];
      const areaId = id === 'home' ? 'home' : id;
      const found = !!S_.discovered[areaId];
      const locked = id === 'meadow' && !S_.unlocked.meadow;
      const questHere = SAN.quests.activeList().some((q) => SAN.quests.locationHint(q.def).toLowerCase().includes((SAN.world.areas[areaId] || {}).name ? SAN.world.areas[areaId].name.toLowerCase() : '§'));
      const inArea = SAN.world.cur === areaId;
      html += `<button class="map-node ${found ? 'found' : 'unknown'} ${locked ? 'locked' : ''} ${inArea ? 'current' : ''}"
        style="left:${n.x}%;top:${n.y}%" data-area="${areaId}" ${found && !locked ? '' : 'disabled'}>
        <span class="map-node-icon">${locked ? '🔒' : found ? (inArea ? '◉' : '◈') : '?'}</span>
        <span class="map-node-label">${found ? U.esc(SAN.world.areas[areaId].name) : 'Undiscovered'}</span>
        ${questHere ? '<span class="map-quest">!</span>' : ''}
      </button>`;
    });
    html += '</div>';
    html += `<p class="fineprint map-hint">Click a discovered place to walk there. ${S_.unlocked.meadow ? '' : 'The meadow is hidden until you have explored more of Sanctuary.'}</p>`;
    const el = UI.panel('map', 'Map of Sanctuary', html, { wide: true, className: 'map-panel' });
    el.querySelectorAll('[data-area]').forEach((b) => {
      b.addEventListener('click', () => {
        const id = b.getAttribute('data-area');
        if (id === 'meadow' && !S_.unlocked.meadow) return;
        const a = SAN.world.areas[id];
        UI.closeAll();
        SAN.actions.enterArea(id, a.spawn.x, a.spawn.y);
      });
    });
  };

  /* =========================================================
     DECORATION
     ========================================================= */
  P.decorate = function (data) {
    const S_ = S();
    if (S_.player.area !== 'home') {
      UI.toast('You can decorate only inside your cottage.', 'info');
      return;
    }
    const zone = SAN.world.areas.home.decorZone;
    const cols = zone.x2 - zone.x1 + 1, rows = zone.y2 - zone.y1 + 1;
    let selected = (data && data.select) || null;
    let movingIndex = -1;
    const homeSolids = SAN.world.buildSolids(SAN.world.areas.home);

    const owned = SAN.state.inventoryList().filter((e) => e.def.placeable);
    const el = UI.panel('decorate', 'Decorate your home', `
      <div class="decor-layout">
        <div class="decor-grid-wrap">
          <div class="decor-grid" id="decor-grid" style="grid-template-columns:repeat(${cols},1fr)"></div>
          <p class="fineprint">Click a piece in your satchel, then click a floor tile. Click placed furniture to pick it up.</p>
        </div>
        <div class="decor-side">
          <div class="decor-side-title">Your furniture</div>
          <div class="decor-owned" id="decor-owned"></div>
          <div class="decor-actions">
            <button class="btn btn-small btn-ghost" id="decor-remove">Remove selected</button>
            <button class="btn btn-small" id="decor-done">Done</button>
          </div>
          <p class="fineprint">Placed: ${S_.house.furniture.length}</p>
        </div>
      </div>`, { wide: true });

    function renderGrid() {
      const grid = el.querySelector('#decor-grid');
      grid.innerHTML = '';
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const tx = zone.x1 + c, ty = zone.y1 + r;
          const cell = document.createElement('button');
          const placedIdx = S_.house.furniture.findIndex((f) => f.x === tx && f.y === ty);
          const isSolid = homeSolids[ty * SAN.world.areas.home.w + tx];
          cell.className = 'decor-cell' + (isSolid ? ' blocked' : '');
          if (placedIdx >= 0) {
            const f = S_.house.furniture[placedIdx];
            cell.classList.add('filled');
            cell.innerHTML = `<img src="${SAN.render.itemIcon(f.id)}" alt="">`;
            cell.addEventListener('click', () => {
              movingIndex = placedIdx;
              selected = null;
              el.querySelector('#decor-remove').disabled = false;
              UI.toast('Selected ' + SAN.data.item(f.id).name + '. Click an empty tile to move it.', 'info');
              highlight();
            });
          } else {
            cell.addEventListener('click', () => {
              if (isSolid) { UI.toast('Something is in the way there.', 'warn'); return; }
              if (movingIndex >= 0) {
                const f = S_.house.furniture[movingIndex];
                f.x = tx; f.y = ty;
                movingIndex = -1;
                SAN.audio.sfx('click');
                renderGrid(); renderOwned();
                return;
              }
              if (!selected) { UI.toast('Choose a piece of furniture first.', 'info'); return; }
              if (SAN.state.count(selected) <= 0) { selected = null; renderOwned(); return; }
              S_.house.furniture.push({ id: selected, x: tx, y: ty });
              SAN.state.removeItem(selected, 1);
              SAN.audio.sfx('click');
              SAN.quests.notify('decorate', selected, 1);
              SAN.progression.checkAchievements();
              renderGrid(); renderOwned();
            });
          }
          grid.appendChild(cell);
        }
      }
    }
    function highlight() {
      el.querySelectorAll('.decor-cell').forEach((c) => c.classList.remove('sel'));
    }
    function renderOwned() {
      const box = el.querySelector('#decor-owned');
      box.innerHTML = '';
      if (!owned.length) {
        box.innerHTML = '<div class="fineprint">Nothing placeable yet. Craft at your bench, or buy from the shops.</div>';
        return;
      }
      owned.forEach((e) => {
        const b = document.createElement('button');
        b.className = 'decor-owned-item' + (selected === e.id ? ' active' : '');
        b.innerHTML = `<img src="${SAN.render.itemIcon(e.id)}" alt=""><span>${U.esc(e.def.name)} ×${e.qty}</span>`;
        b.addEventListener('click', () => {
          selected = e.id; movingIndex = -1;
          renderOwned(); highlight();
          UI.toast('Click a floor tile to place ' + e.def.name + '.', 'info');
        });
        box.appendChild(b);
      });
    }
    el.querySelector('#decor-remove').disabled = true;
    el.querySelector('#decor-remove').addEventListener('click', () => {
      if (movingIndex < 0) return;
      const f = S_.house.furniture[movingIndex];
      if (!f) return;
      SAN.state.addItem(f.id, 1, { silent: true });
      S_.house.furniture.splice(movingIndex, 1);
      movingIndex = -1;
      renderGrid(); renderOwned();
      UI.toast('Returned to your satchel.', 'info');
    });
    el.querySelector('#decor-done').addEventListener('click', () => UI.closePanel('decorate'));
    renderGrid();
    renderOwned();
  };

      const input = el.querySelector('#' + id);
      input.addEventListener('input', () => {
        st[key] = parseFloat(input.value);
        input.parentElement.querySelector('b').textContent = Math.round(st[key] * 100) + '%';
        SAN.save.saveSettings(st);
        UI.applySettings();
        cb && cb();
      });
    };
    bindRange('set-music', 'musicVol');
    bindRange('set-sfx', 'sfxVol');
    bindRange('set-amb', 'ambVol');
    const speed = el.querySelector('#set-speed');
    speed.addEventListener('input', () => {
      st.textSpeed = parseFloat(speed.value);
      speed.parentElement.querySelector('b').textContent = st.textSpeed + '×';
      SAN.save.saveSettings(st);
    });
    const bindToggle = (id, key, cb) => {
      const input = el.querySelector('#' + id);
      input.addEventListener('change', () => {
        st[key] = input.checked;
        SAN.save.saveSettings(st);
        UI.applySettings();
        cb && cb();
      });
    };
    bindToggle('set-hints', 'showHints');
    bindToggle('set-motion', 'reduceMotion');
    bindToggle('set-touch', 'alwaysShowTouch');

    bindToggle('set-ai', 'useAI', () => {
      if (st.useAI) UI.toast('AI reflections are opt-in per entry. Your journal remains on this device.', 'info');
    });
    el.querySelector('#set-export').addEventListener('click', () => {
      const data = SAN.save.exportData();
      const blob = new Blob([data], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'sanctuary-save.json';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      UI.toast('Save exported.', 'save');
    });
    el.querySelector('#set-import').addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json,application/json';
      input.addEventListener('change', () => {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const res = SAN.save.importData(String(reader.result));
          if (!res.ok) { UI.toast(res.error, 'warn'); return; }
          UI.closeAll();
          SAN.state.apply(res.snap);
          SUN();
          UI.toast('Save imported and loaded.', 'save');
        };
        reader.readAsText(file);
      });
      input.click();
    });
    el.querySelector('#set-save').addEventListener('click', () => { UI.closePanel('settings'); UI.openPanel('saves'); });
    el.querySelector('#set-title').addEventListener('click', () => {
      UI.confirm('Return to the title screen?', 'Your progress is saved in the slot you loaded.', () => {
        SAN.save.autosave(true);
        UI.closeAll();
        SUN();
        SAN.screens.showTitle();
      });
    });
  };
