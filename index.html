      case 'craft': [392, 494, 587].forEach((f, i) => setTimeout(() => tone(f, 0.18, 'triangle', 0.07), i * 70)); break;
      case 'error': tone(220, 0.16, 'square', 0.04); break;
      case 'sparkle': [1318, 1568, 2093].forEach((f, i) => setTimeout(() => tone(f, 0.25, 'sine', 0.04), i * 90)); break;
      case 'achieve': [523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => tone(f, 0.3, 'sine', 0.07), i * 110)); break;
      case 'sleep': [392, 330, 262].forEach((f, i) => setTimeout(() => tone(f, 0.5, 'sine', 0.05), i * 220)); break;
      case 'thunder': noise(0.9, 0.14, 220, 0.4, 'lowpass'); break;
      case 'door': noise(0.2, 0.07, 500, 0.6, 'lowpass'); setTimeout(() => tone(196, 0.15, 'sine', 0.05), 120); break;
      case 'bell': tone(784, 1.2, 'sine', 0.06, { attack: 0.01 }); setTimeout(() => tone(1175, 1.4, 'sine', 0.035), 30); break;
      default: tone(700, 0.07, 'sine', 0.06);
    }
  };

  /* ---------------- Ambience ---------------- */
  function stopAmb() {
    ambNodes.forEach((n) => { try { n.stop ? n.stop() : n.disconnect(); } catch (e) { } });
    ambNodes = [];
    if (birdTimer) { clearInterval(birdTimer); birdTimer = null; }
    ambType = null;
  }

  A.ambient = function (type) {
    if (!ctx) { ambType = type; return; }
    if (ambType === type) return;
    stopAmb();
    ambType = type;
    if (!type) return;
    const g = ctx.createGain(); g.gain.value = 0.0001; g.connect(ambGain);
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    const f = ctx.createBiquadFilter();
    let target = 0.12;
    if (type === 'rain' || type === 'storm') { f.type = 'bandpass'; f.frequency.value = 2200; f.Q.value = 0.5; target = type === 'storm' ? 0.3 : 0.18; }
    else if (type === 'waves') { f.type = 'lowpass'; f.frequency.value = 520; target = 0.16; }
    else if (type === 'wind') { f.type = 'lowpass'; f.frequency.value = 380; target = 0.1; }
    else if (type === 'fire') { f.type = 'lowpass'; f.frequency.value = 700; target = 0.05; }
    else if (type === 'forest') { f.type = 'lowpass'; f.frequency.value = 900; target = 0.045; }
    else { f.type = 'lowpass'; f.frequency.value = 1200; target = 0.03; }
    src.connect(f); f.connect(g);
    src.start();
    g.gain.exponentialRampToValueAtTime(target, ctx.currentTime + 1.6);
    ambNodes.push(src, g);

    // wave swell animation
    if (type === 'waves') {
      const lfo = ctx.createOscillator(), lg = ctx.createGain();
      lfo.frequency.value = 0.12; lg.gain.value = target * 0.7;
      lfo.connect(lg); lg.connect(g.gain); lfo.start();
      ambNodes.push(lfo, lg);
    }
    if (type === 'birds' || type === 'forest') {
      birdTimer = setInterval(() => {
        if (!ctx || document.hidden) return;
        if (Math.random() < 0.55) {
          const base = 2200 + Math.random() * 1400;
          tone(base, 0.09, 'sine', 0.02, { glide: base * 1.3 });
          setTimeout(() => tone(base * 1.1, 0.07, 'sine', 0.016), 120);
        }
      }, 3200);
    }
    if (type === 'fire') {
      birdTimer = setInterval(() => {
        if (!ctx) return;
        if (Math.random() < 0.4) noise(0.06, 0.02, 900 + Math.random() * 900, 2);
      }, 1400);
    }
  };

  /* ---------------- Music ---------------- */
  function stopMusic() {
    if (schedTimer) { clearInterval(schedTimer); schedTimer = null; }
    current = null;
  }

  A.playMusic = function (trackName) {
    if (A.track === trackName) return;
    A.track = trackName;
    if (!ctx) return;
    stopMusic();
    const t = TRACKS[trackName];
    if (!t) return;
    current = t; step = 0; nextNote = ctx.currentTime + 0.1;
    A.ambient(t.amb);
    schedTimer = setInterval(schedule, 120);
  };

  function schedule() {
    if (!ctx || !current) return;
    const beat = 60 / current.bpm / 2; // eighth notes
    while (nextNote < ctx.currentTime + 0.6) {
      playStep(current, step, nextNote, beat);
      nextNote += beat;
      step++;
    }
  }

  function playStep(t, s, when, beat) {
    const bar = Math.floor(s / 8) % t.prog.length;
    const chord = t.prog[bar];
    const inBar = s % 8;
    const tnow = Math.max(when, ctx.currentTime + 0.01);

    // gentle arpeggio
    if (inBar % 2 === 0) {
      const noteIdx = (inBar / 2) % chord.length;
      const midi = t.root + chord[noteIdx] + (inBar >= 4 ? 12 : 0);
      pad(midi, tnow, beat * 2.4, t.wave, 0.055);
    }
    // pad on bar start
    if (inBar === 0) {
      chord.forEach((n, i) => pad(t.root + n, tnow, beat * 8, 'sine', 0.026 + i * 0.004));
    }
    // sparse melody
    if (inBar === 5 && Math.random() < 0.6) {
      pad(t.root + chord[2] + 24, tnow, beat * 2, 'sine', 0.03);
    }
  }

  function pad(midi, when, dur, wave, vol) {
    if (!ctx || !musicGain) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = wave || 'sine';
    o.frequency.value = midiToHz(midi);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(vol, when + Math.min(0.4, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(lp); lp.connect(g); g.connect(musicGain);
    o.start(when); o.stop(when + dur + 0.05);
  }

  A.stop = function () { stopMusic(); stopAmb(); };
  A.isReady = () => !!ctx;
})();
</script>
<script>
/* Sanctuary — input: keyboard, mouse, mobile joystick + action buttons */
(function () {
  const I = (SAN.input = {});
  const down = {};
  const pressedNow = {};
  const handlers = [];
  I.joy = { x: 0, y: 0, active: false };
  I.touchActionHeld = false;
  I.touchActionPressed = false;
  I.pointer = { x: 0, y: 0, worldX: 0, worldY: 0 };
  I.mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

  const MAP = {
    up: ['ArrowUp', 'w', 'W'],
    down: ['ArrowDown', 's', 'S'],
    left: ['ArrowLeft', 'a', 'A'],
    right: ['ArrowRight', 'd', 'D'],
    run: ['Shift'],
    interact: ['e', 'E', ' '],
  };

  I.bind = function () {
    window.addEventListener('keydown', (e) => {
      const k = e.key;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(k)) e.preventDefault();
      if (!down[k]) pressedNow[k] = true;
      down[k] = true;
      for (const h of handlers) {
        try { if (h(k, e) === true) { e.preventDefault(); break; } } catch (err) { console.error(err); }
      }
    });
    window.addEventListener('keyup', (e) => { down[e.key] = false; });
    window.addEventListener('blur', () => { for (const k in down) down[k] = false; I.joy.active = false; I.joy.x = I.joy.y = 0; });

    // first touch anywhere reveals the on-screen controls
    window.addEventListener('touchstart', () => document.body.classList.add('touch'), { passive: true });

    // mobile joystick
    const joyEl = document.getElementById('joystick');
    const knob = document.getElementById('joystick-knob');
    if (joyEl) {
      let id = null, cx = 0, cy = 0, R = 42;
      const start = (e) => {
        const t = e.changedTouches ? e.changedTouches[0] : e;
        const r = joyEl.getBoundingClientRect();
        cx = r.left + r.width / 2; cy = r.top + r.height / 2; R = r.width / 2;
        if (R <= 0) return;
        id = t.identifier != null ? t.identifier : 'mouse';
        I.joy.active = true;
        move(e);
        if (e.preventDefault) e.preventDefault();
      };
      const move = (e) => {
        if (!I.joy.active) return;
        let t = e;
        if (e.changedTouches) {
          t = Array.from(e.changedTouches).find((x) => (x.identifier != null ? x.identifier : 'mouse') === id);
          if (!t) return;
        }
        let dx = t.clientX - cx, dy = t.clientY - cy;
        const len = Math.hypot(dx, dy) || 1;
        const cl = Math.min(len, R);
        const nx = (dx / len) * (cl / R), ny = (dy / len) * (cl / R);
        I.joy.x = Math.abs(nx) < 0.18 ? 0 : nx;
        I.joy.y = Math.abs(ny) < 0.18 ? 0 : ny;
        if (knob) knob.style.transform = `translate(${nx * R * 0.6}px, ${ny * R * 0.6}px)`;
        e.preventDefault();
      };
      const end = (e) => {
        I.joy.active = false; I.joy.x = 0; I.joy.y = 0;
        if (knob) knob.style.transform = 'translate(0,0)';
      };
      joyEl.addEventListener('touchstart', start, { passive: false });
      joyEl.addEventListener('touchmove', move, { passive: false });
      joyEl.addEventListener('touchend', end);
      joyEl.addEventListener('mousedown', start);
      window.addEventListener('mousemove', (e) => { if (I.joy.active) move(e); });
      window.addEventListener('mouseup', end);
    }

    const bindBtn = (el, onDown, onUp) => {
      if (!el) return;
      const s = (e) => { e.preventDefault(); onDown(); };
      const u = (e) => { e.preventDefault(); if (onUp) onUp(); };
      el.addEventListener('touchstart', s, { passive: false });
      el.addEventListener('touchend', u, { passive: false });
      el.addEventListener('mousedown', s);
      el.addEventListener('mouseup', u);
      el.addEventListener('mouseleave', u);
    };
    bindBtn(document.getElementById('btn-action'), () => { I.touchActionPressed = true; I.touchActionHeld = true; }, () => { I.touchActionHeld = false; });
    bindBtn(document.getElementById('btn-run'), () => { I.touchRun = true; }, () => { I.touchRun = false; });
    bindBtn(document.getElementById('btn-menu'), () => { SAN.ui && SAN.ui.togglePause(); });
  };

  I.onKey = (fn) => handlers.push(fn);

  I.is = (action) => (MAP[action] || []).some((k) => down[k]);
  I.wasPressed = (action) => (MAP[action] || []).some((k) => pressedNow[k]);
  I.rawDown = (k) => !!down[k];

  I.moveVector = () => {
    let x = 0, y = 0;
    if (I.is('left')) x -= 1;
    if (I.is('right')) x += 1;
    if (I.is('up')) y -= 1;
    if (I.is('down')) y += 1;
    if (I.joy.x || I.joy.y) { x = I.joy.x; y = I.joy.y; }
    const m = Math.hypot(x, y);
    if (m > 1) { x /= m; y /= m; }
    return { x, y, mag: Math.min(1, m) };
  };

  I.running = () => I.is('run') || !!I.touchRun;
  I.consumeInteract = () => {
    const p = I.wasPressed('interact') || I.touchActionPressed;
    I.touchActionPressed = false;
    return p;
  };
  I.clearFrame = () => {
    for (const k in pressedNow) delete pressedNow[k];
    I.touchActionPressed = false;
  };
})();
</script>
<script>
/* Sanctuary — save system: 3 slots, autosave, export/import, corruption guards */
(function () {
  const KEY = 'sanctuary_saves_v1';
  const SETTINGS_KEY = 'sanctuary_settings_v1';
  const S = (SAN.save = {});
  S.autosaveEnabled = true;
  let lastAutosave = 0;

  function readAll() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return { slots: {} };
      const data = JSON.parse(raw);
      if (!data || typeof data !== 'object' || !data.slots) return { slots: {} };
      return data;
    } catch (e) {
      console.warn('Save data unreadable; keeping a backup.', e);
      try { localStorage.setItem(KEY + '_corrupt_' + Date.now(), localStorage.getItem(KEY) || ''); } catch (err) { }
      return { slots: {} };
    }
  }

  function writeAll(data) {
    try {
      localStorage.setItem(KEY, JSON.stringify(data));
      return true;
    } catch (e) {
      console.error('Save failed', e);
      return false;
    }
  }

  S.slotMeta = function () {
    const all = readAll();
    const out = [];
    for (let i = 1; i <= 3; i++) {
      const s = all.slots[i];
      out.push(s ? {
        slot: i,
        name: s.player ? s.player.name : 'Wanderer',
        day: s.time ? s.time.day : 1,
        season: s.time ? s.time.season : 0,
        year: s.time ? s.time.year : 1,
        money: s.money || 0,
        savedAt: s.savedAt || 0,
        playtime: s.playtime || 0,
        catName: s.cat && s.cat.name,
        area: s.player && s.player.area,
      } : { slot: i, empty: true });
    }
    return out;
  };

  S.hasAny = () => S.slotMeta().some((s) => !s.empty);

  S.write = function (slot, opts) {
    const state = SAN.state && SAN.state.S;
    if (!state) return false;
    const all = readAll();
    const snap = SAN.state.serialize();
    snap.savedAt = Date.now();
    snap.slot = slot;
    all.slots[slot] = snap;
    const ok = writeAll(all);
    if (ok && !(opts && opts.silent)) {
      SAN.ui && SAN.ui.toast('Saved to slot ' + slot, 'save');
    }
    return ok;
  };

  S.read = function (slot) {
    const all = readAll();
    const snap = all.slots[slot];
    if (!snap) return null;
    return snap;
  };

  S.clear = function (slot) {
    const all = readAll();
    delete all.slots[slot];
    writeAll(all);
  };

  S.autosave = function (force) {
    if (!S.autosaveEnabled) return;
    const now = Date.now();
    if (!force && now - lastAutosave < 45000) return;
    lastAutosave = now;
    const state = SAN.state && SAN.state.S;
    if (!state || !state.started) return;
    const all = readAll();
    const snap = SAN.state.serialize();
    snap.savedAt = now;
    snap.slot = snap.slot || 1;
    all.slots[snap.slot] = snap;
    if (writeAll(all)) {
      const el = document.getElementById('autosave-indicator');
      if (el) {
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 1800);
      }
    }
  };

  S.exportData = function () {
    const snap = SAN.state.serialize();
    return JSON.stringify({ game: 'sanctuary', version: 1, exportedAt: new Date().toISOString(), save: snap }, null, 2);
  };

  S.importData = function (text) {
    let obj;
    try { obj = JSON.parse(text); } catch (e) { return { ok: false, error: 'That is not valid save data (JSON parse failed).' }; }
    const snap = obj && obj.save ? obj.save : obj;
    if (!snap || !snap.player || !snap.time) return { ok: false, error: 'Save data is missing required fields.' };
    const all = readAll();
    const slot = snap.slot || 1;
    all.slots[slot] = snap;
    if (!writeAll(all)) return { ok: false, error: 'Could not write to storage.' };
    return { ok: true, slot, snap };
  };

  // settings persist separately so volume is honoured on the title screen
  S.loadSettings = function () {
    try {
      const raw = localStorage.getItem(SETTINGS_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { }
    return null;
  };
  S.saveSettings = function (settings) {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) { }
  };
})();
</script>

<script>
/* Sanctuary — the village's inner life: traits, histories, milestones, chatter,

(function () {

  /* =========================================================
     INNER LIFE — every villager has a past, habits and a way of
     being seen that changes as trust grows.
     ========================================================= */
  D.npcLife = {
    nyssa: {
      traits: ['ancient', 'patient', 'quietly amused'],
      history: 'She has watched Sanctuary through nine generations of gardens. She remembers every person who ever left, and every one who came back.',
      timeLines: {
        morning: '"The village is still yawning. This is my favourite hour — everyone is honest before they are awake."',
        afternoon: '"You are allowed to do nothing today. I will not tell anyone."',
        evening: '"Evenings are for putting things down. Whatever you are carrying can wait until morning."',
        night: '"The well and I keep each other company. It is not a lonely job if you like the company."',
      },
      weatherLines: {
        rain: '"Rain is the village exhaling. Stay a while."',
        fog: '"Fog makes everything a rumour. Even your worries."',
        snow: '"Snow is silence you can walk through."',
      },
      milestones: {
        21: {
          title: 'The Guardian Notices',
          pages: [
            { speaker: 'nyssa', text: '"You have started saying hello to the well. It told me. It is a terrible gossip."' },
            { speaker: 'nyssa', text: '"I do not need you to be grateful for this place. I only hoped you would stop bracing for it to be taken away."' },
          ],
        },
        41: {
          title: 'What The Village Remembers',
          pages: [
            { speaker: 'nyssa', text: '"When you first came, you walked like someone apologising for the space they took."' },
            { speaker: 'nyssa', text: '"You take up room now. I have been waiting to see it."' },
          ],
        },
        61: {
          title: 'The Long Watch',
          pages: [
            { speaker: 'nyssa', text: '"I am not a god, whatever the older villagers say. I am a promise that outlived the people who made it."' },
            { speaker: 'nyssa', text: '"Someone once asked me to keep this valley kind. I have been doing that ever since. It is the only thing I have ever wanted to be good at."' },
          ],
        },
        81: {
          title: 'A Place You Can Return To',
          pages: [
            { speaker: 'nyssa', text: '"You know you can leave, don\'t you? Sanctuary will still be here. That is the whole point of it."' },
            { speaker: 'nyssa', text: '"And you will still be welcome. That is the other half of the point."' },
          ],
        },
      },
    },

    liora: {
      traits: ['steady', 'warm', 'braced for departure'],
      history: 'She came inland-to-sea at nineteen and stayed. Her mother left in spring, four years ago, and Liora has kept a lamp for strangers ever since.',
      timeLines: {
        morning: '"The tide went out further than usual. I always take that personally, which is silly."',
        afternoon: '"Afternoon light makes the lens look like it is full of honey. I polish it slower than I need to."',
        evening: '"This is the hour I used to dread. It is getting easier. Some evenings."',
        night: '"The lamp is lit. Whatever else is true, that part is done."',
      },
      weatherLines: {
        rain: '"Ships cannot see rain. They can see the lamp. That is why I keep it clean."',
        storm: '"Storms are honest. They do not pretend to be anything else."',
        fog: '"Fog is the worst. You keep the light on and trust that someone is out there."',
      },
      milestones: {
        21: {
          title: 'The West Step',
          pages: [
            { speaker: 'liora', text: '"You can sit here. It is not reserved. I only say that because I used to pretend it was."' },
            { speaker: 'liora', text: 'She does not move over to make room. She has already left space.' },
          ],
        },
        41: {
          title: 'A Door Left Unlocked',
          pages: [
            { speaker: 'liora', text: '"I have been thinking about why I keep the lamp lit for strangers and not for — anyone else."' },
            { speaker: 'liora', text: '"I think it is easier to be needed by people who cannot leave. Ships always leave."' },
            { speaker: 'narrator', text: 'She looks at you, then away. "That was more than I meant to say. You can stay anyway."' },
          ],
        },
        61: {
          title: 'The Photograph',
          pages: [
            { speaker: 'liora', text: '"I found the photograph again. I put it in a drawer with the letters, which is progress, or at least tidying."' },
            { speaker: 'liora', text: '"I used to think if I stopped waiting, it meant I agreed with how she left. I do not think that anymore. Mostly."' },
          ],
        },
        81: {
          title: 'Someone To Look For',
          pages: [
            { speaker: 'liora', text: '"When you are out walking, I find myself checking the path. Not because I am worried."' },
            { speaker: 'liora', text: '"Because there is somebody I would be glad to see. That is different. I had to learn the difference."' },
          ],
        },
      },
    },

    elowen: {
      traits: ['observant', 'self-reliant', 'easily embarrassed by kindness'],
      history: 'She rebuilt the greenhouse roof alone last winter and tells everyone it was fine. She keeps a cutting of every plant that survived her.',
      timeLines: {
        morning: '"Morning is for checking who made it through the night. Plants are very honest about that."',
        afternoon: '"I have been repotting since noon. My hands smell like soil and I have forgotten to eat. Again."',
        evening: '"The light in here goes gold at this hour. It makes even the weeds look intentional."',
        night: '"I should go home. I am going to stay a bit longer. Do not tell anyone."',
      },
      weatherLines: {
        rain: '"Rain means I do not have to water. It also means I have no excuse to avoid thinking."',
        storm: '"The roof holds. I checked it twice. Three times."',
        snow: '"Everything outside is asleep. In here it is still stubbornly green."',
      },
      milestones: {
        21: {
          title: 'A Cutting',
          pages: [
            { speaker: 'elowen', text: '"I saved this for you. It is a lavender cutting. It is not a — I am not good at this part."' },
            { speaker: 'elowen', text: '"You do not have to keep it alive. But it would be nice."' },
          ],
        },
        41: {
          title: 'The Cost Of Asking',
          pages: [
            { speaker: 'elowen', text: '"I practised asking you for help in my head for two days. Then I did it myself and cried in the shed."' },
            { speaker: 'elowen', text: '"It is not that I think you would say no. It is that I do not know who I am if I need someone."' },
          ],
        },
        61: {
          title: 'The Sister',
          pages: [
            { speaker: 'elowen', text: '"My sister sends letters. I answer them with plant advice, because plant advice is safe."' },
            { speaker: 'elowen', text: '"She wrote: \'I do not need you to be useful, I need you to be my sister.\' I have not answered that one yet. I will."' },
          ],
        },
        81: {
          title: 'Two Pairs Of Hands',
          pages: [
            { speaker: 'elowen', text: '"The starflower came back this year. I did not do that alone."' },
            { speaker: 'elowen', text: 'She says it plainly, without apologising, and goes back to the trays. It is the most she has ever said.' },
          ],
        },
      },
    },

    rowan: {
      traits: ['curious', 'self-critical', 'kind in a sideways way'],
      history: 'He took over the windmill from a man who never explained anything. He has been reverse-engineering the gears, and his own thoughts, ever since.',
      timeLines: {
        morning: '"I was awake at four. Not on purpose. My brain had a meeting and I was not invited."',
        afternoon: '"I have been oiling the same gear for twenty minutes. It is very well oiled now."',
        evening: '"The wind drops at this hour. My head gets louder. I am trying to find that funny."',
        night: '"If I am still up, come and sit. Misery loves company, and so does almost everything else."',
      },
      weatherLines: {
        rain: '"Rain on the mill roof is the best sound. It drowns out about forty percent of me."',
        fog: '"Fog days are dangerous. My imagination has nowhere else to go."',
        snow: '"Look — the whole world has stopped performing. Very restful."',
      },
      milestones: {
        21: {
          title: 'A Smaller Story',
          pages: [
            { speaker: 'rowan', text: '"I replayed our last conversation for an hour. You did not do anything wrong. I just wanted you to know that I know that."' },
            { speaker: 'rowan', text: '"My brain writes sequels nobody asked for."' },
          ],
        },
        41: {
          title: 'The Argument In My Head',
          pages: [
            { speaker: 'rowan', text: '"There is a version of this conversation where you are bored of me. He is very convincing. He has citations."' },
            { speaker: 'rowan', text: '"You are still here, though. That is evidence. I am trying to collect evidence."' },
          ],
        },
        61: {
          title: 'Something Kind, Said Plainly',
          pages: [
            { speaker: 'rowan', text: '"I have been trying to say one kind thing about myself a day. Today: I got out of bed and the mill is still standing."' },
            { speaker: 'rowan', text: '"It sounds small. It is not small. You would be surprised how loud small can be."' },
          ],
        },
        81: {
          title: 'The Quiet After',
          pages: [
            { speaker: 'rowan', text: '"I had a whole evening without analysing anything. My brain kept offering, and I kept saying: not now."' },
            { speaker: 'rowan', text: '"You were there. I think that helped more than the technique."' },
          ],
        },
      },
    },

    mira: {
      traits: ['generous', 'cheerful', 'never asks for anything'],
      history: 'She has run the bakery since she was twenty-two and gives away more than she sells. She is the first to notice when someone has not eaten.',
      timeLines: {
        morning: '"Everything is out of the oven and the whole street smells like a promise."',
        afternoon: '"The afternoon lull. I always mean to sit down and then I start on the next batch."',
        evening: '"I love this hour. The shop is warm and everyone is a bit softer."',
        night: '"I am supposed to be closed. I am not closed. I am \'finishing up\'."',
      },
      weatherLines: {
        rain: '"Rain days are bread days. Everyone wants something warm to hold."',
        storm: '"I keep the oven on for the smell. It makes the storm less dramatic."',
        snow: '"Snow means cinnamon. It is not a rule, it is just true."',
      },
      milestones: {
        21: {

<script>
/* Sanctuary — world areas. Hand-laid tile grids + props + transitions. */
(function () {
  const W = SAN.world || (SAN.world = {});

  /* tile chars:
     . grass  , flowery grass  # dirt path  = stone  ~ water  s sand  w wood  g glass
     m forest floor  c soil  x wall  o stone floor  r rug  _ void  F flowerbed */
  const SOLID_CHARS = '~x_';

  function mk(cfg) {
    const grid = [];
    for (let y = 0; y < cfg.h; y++) {
      const row = new Array(cfg.w).fill(cfg.fill || '.');
      grid.push(row);
    }
    return {
      id: cfg.id, name: cfg.name, w: cfg.w, h: cfg.h, grid,
      props: [], exits: [], plots: [], spawn: cfg.spawn || { x: 2, y: 2 },
      region: cfg.region || 'outdoor', music: cfg.music || 'village',
      ambient: cfg.ambient || 'birds', weatherFx: cfg.weatherFx !== false,
      safe: !!cfg.safe, decorZone: cfg.decorZone || null,
      light: cfg.light || 1,
    };
  }

  function fillRect(a, x, y, w, h, ch) {
    for (let yy = y; yy < y + h; yy++) {
      for (let xx = x; xx < x + w; xx++) {
        if (yy < 0 || yy >= a.h || xx < 0 || xx >= a.w) continue;
        a.grid[yy][xx] = ch;
      }
    }
  }
  function setTile(a, x, y, ch) {
    if (x < 0 || x >= a.w || y < 0 || y >= a.h) return;
    a.grid[y][x] = ch;
  }
  function add(a, t, x, y, opts) {
    const p = Object.assign({ t, x, y, w: 1, h: 1, solid: false }, opts || {});
    if (p.w == null) p.w = 1;
    if (p.h == null) p.h = 1;
    a.props.push(p);
    return p;
  }
  function door(a, x, y, to, tx, ty, label, opts) {
    add(a, 'door', x, y, Object.assign({ solid: false, clear: true, auto: true, interact: { type: 'area', to, tx, ty } }, opts || {}));
    a.grid[y][x] = a.region === 'indoor' ? 'w' : '=';
  }
  function occupied(a, x, y) {
    return a.props.some((p) => x >= p.x && x < p.x + (p.w || 1) && y >= p.y && y < p.y + (p.h || 1));
  }
  function scatter(a, type, count, seed, opts) {
    const rng = SAN.util.rng(seed);
    let placed = 0, tries = 0;
    const o = opts || {};
    while (placed < count && tries < count * 40) {
      tries++;
      const x = 1 + Math.floor(rng() * (a.w - 2));
      const y = 1 + Math.floor(rng() * (a.h - 2));
      if (occupied(a, x, y)) continue;
      if (a.grid[y][x] !== (o.on || '.')) continue;
      if (o.avoid && o.avoid(x, y)) continue;
      if (o.noEdge && (x < 3 || y < 3 || x > a.w - 4 || y > a.h - 4)) continue;
      add(a, type, x, y, o.props ? (typeof o.props === 'function' ? o.props(x, y) : o.props) : undefined);
      placed++;
    }
    return placed;
  }
  function flowers(a, count, seed, chars) {
    const rng = SAN.util.rng(seed);
    for (let i = 0; i < count; i++) {
      const x = 1 + Math.floor(rng() * (a.w - 2));
      const y = 1 + Math.floor(rng() * (a.h - 2));
      if (a.grid[y][x] === '.') a.grid[y][x] = (chars && chars[Math.floor(rng() * chars.length)]) || ',';

  function scatteredFlowersForest(a) {
    const rng = SAN.util.rng(304);
    for (let i = 0; i < 120; i++) {

<script>
/* Sanctuary — pixel-art renderer: tiles, props, characters, weather, portraits */
(function () {
  const R = (SAN.render = {});
  const T = 16;

  /* ---------------- palette ---------------- */
  const C = {
    grass: '#8fbf7a', grass2: '#7fb06a', grassDark: '#6d9e5c', grassLight: '#a6cf8f',
    flowerA: '#f2d0e0', flowerB: '#f6e7b8', flowerC: '#cbc3ee',
    path: '#c9a97e', path2: '#b8976c', pathDark: '#a8865c',
    stone: '#cfc8bb', stone2: '#bdb5a6', stoneJoint: '#a49c8d',
    water: '#7fb6c9', water2: '#6aa4ba', waterLight: '#a9d6e2', waterDeep: '#5b93aa',
    sand: '#efdfb8', sand2: '#e3d0a4', sandDark: '#d3bd8f',
    wood: '#b98d62', wood2: '#a67a52', woodLine: '#8f6743', woodLight: '#cfa87b',
    glassF: '#cfe4cf', glassF2: '#bcd8bc',
    forestF: '#5c7a56', forestF2: '#526e4d', forestLeaf: '#6b8a5f',
    soil: '#8a6247', soil2: '#7a553d', soilLine: '#6b4a35',
    wallp: '#e6d3c4', wallLine: '#d3bda9',
    stoneF: '#b9b2a6', stoneF2: '#aca497', stoneFL: '#c6bfb2',
    rugC: '#b98ba0',
    bedC: '#7fa07c',
  };

  R.T = T;
  R.palette = C;

  let canvas, ctx, W = 480, H = 270;

  let viewH = 270, viewW = 480;

  function layout() {
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    const cw = Math.max(1, rect.width || window.innerWidth || 480);
    const ch = Math.max(1, rect.height || window.innerHeight || 270);
    const aspect = cw / ch;
    // Portrait screens get a taller, closer view so the world fills the screen;
    // desktop/landscape sees more of the surroundings.
    let targetH = 300;
    if (aspect < 0.75) targetH = 344;
    else if (aspect < 1.05) targetH = 326;
    else if (aspect > 2.1) targetH = 306;
    let targetW = Math.round(targetH * aspect);
    targetW = Math.max(188, Math.min(920, targetW));
    targetH = Math.round(targetW / aspect);
    if (targetW === viewW && targetH === viewH && canvas.width === targetW) return;
    viewW = targetW; viewH = targetH;
    canvas.width = viewW;
    canvas.height = viewH;
    if (ctx) ctx.imageSmoothingEnabled = false;
    W = viewW; H = viewH;
    R.view = { w: viewW, h: viewH, scale: ch / viewH };
  }

  R.resize = function () {
    layout();
  };

  R.setup = function (cv) {
    canvas = cv;
    ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    layout();
    return ctx;
  };
  R.width = () => W;
  R.height = () => H;
  R.ctx = () => ctx;

  function px(x, y, w, h, col) {
    ctx.fillStyle = col;
    ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  }
  function circle(x, y, r, col) {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  function ellipse(x, y, rx, ry, col) {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  /* =========================================================
     TILES
     ========================================================= */
  R.drawTile = function (ch, sx, sy, tx, ty, t) {
    const h = SAN.util.hash(tx, ty);
    switch (ch) {
      case '.': {
        px(sx, sy, T, T, C.grass);
        // soft patchwork so large lawns do not read as flat colour
        if (h > 0.5) px(sx + 2, sy + 2, 5, 4, 'rgba(104,150,88,0.22)');
        if (h < 0.3) px(sx + 9, sy + 7, 5, 5, 'rgba(198,224,164,0.2)');
        if (h > 0.24 && h < 0.42) px(sx + 8, sy + 1, 4, 6, 'rgba(96,140,80,0.14)');
        // blades and tufts
        px(sx + 3, sy + 6, 1, 2, C.grassDark);
        px(sx + 4, sy + 5, 1, 3, C.grass2);
        px(sx + 11, sy + 10, 1, 2, C.grassDark);
        if (h > 0.62) { px(sx + 7, sy + 12, 3, 1, C.grassLight); px(sx + 8, sy + 11, 1, 2, C.grass2); }
        if (h < 0.18) { px(sx + 12, sy + 3, 2, 1, C.grassLight); px(sx + 12, sy + 4, 1, 2, C.grassDark); }
        if (h > 0.93) { px(sx + 5, sy + 9, 1, 1, '#f6f0d0'); }
        break;
      }
      case ',': {
        px(sx, sy, T, T, C.grass);
        px(sx + 2, sy + 3, 4, 3, 'rgba(120,170,100,0.14)');
        px(sx + 3, sy + 4, 2, 1, C.grassDark);
        px(sx + 9, sy + 11, 2, 1, C.grassDark);
        const c = h > 0.66 ? C.flowerA : h > 0.33 ? C.flowerB : C.flowerC;
        // little flower with petals and stem
        px(sx + 7, sy + 8, 1, 4, '#5f8a52');
        circle(sx + 7.5, sy + 7, 1.8, c);
        px(sx + 7, sy + 7, 1, 1, h > 0.5 ? '#f6e6b8' : '#fbf4e0');
        if (h > 0.5) {
          px(sx + 12, sy + 12, 1, 3, '#5f8a52');
          circle(sx + 12.5, sy + 11, 1.4, C.flowerC);
        }
        if (h < 0.2) { px(sx + 3, sy + 11, 1, 2, C.grassDark); px(sx + 3, sy + 10, 1, 1, '#f0e0c0'); }
        break;
      }
      case '#': {
        // packed earth with soft trodden edges and small stones
        px(sx, sy, T, T, C.path);
        px(sx, sy, T, 3, 'rgba(210,180,140,0.35)');
        px(sx, sy + 12, T, 4, 'rgba(150,118,86,0.25)');
        for (let i = 0; i < 4; i++) {
          const hx2 = (h * (i + 1) * 97) % 12;
          const hy2 = (h * (i + 1) * 53) % 12;
          circle(sx + 2 + hx2, sy + 2 + hy2, 0.9 + (i % 2) * 0.4, i % 2 ? 'rgba(160,130,96,0.5)' : 'rgba(225,205,170,0.45)');
        }
        if (h > 0.8) px(sx + 3, sy + 4, 2, 1, 'rgba(120,160,100,0.45)');
        if (h < 0.12) { px(sx + 11, sy + 10, 2, 1, '#b08d66'); px(sx + 12, sy + 9, 1, 1, '#c9a97e'); }
        break;
      }
      case '=': {
        // irregular flagstones, warm stone, mossy joints
        px(sx, sy, T, T, '#b4aa9a');
        ctx.fillStyle = h > 0.5 ? '#d3cabb' : '#c8bfaf';
        ctx.beginPath();
        ctx.moveTo(sx + 1, sy + 2);
        ctx.quadraticCurveTo(sx + 7, sy - 0.5, sx + 14, sy + 1.5);
        ctx.quadraticCurveTo(sx + 16, sy + 8, sx + 14.5, sy + 14);
        ctx.quadraticCurveTo(sx + 8, sy + 16, sx + 1.5, sy + 14);
        ctx.quadraticCurveTo(sx - 0.5, sy + 8, sx + 1, sy + 2);
        ctx.closePath(); ctx.fill();
        px(sx + 2, sy + 3, 5, 1, 'rgba(255,250,240,0.35)');
        px(sx + 9, sy + 12, 4, 1, 'rgba(140,130,112,0.35)');
        if (h > 0.72) { px(sx + 12, sy + 2, 2, 1, 'rgba(120,155,100,0.5)'); px(sx + 13, sy + 3, 1, 1, 'rgba(120,155,100,0.4)'); }
        if (h < 0.2) px(sx + 2, sy + 13, 2, 1, 'rgba(120,155,100,0.4)');
        break;
      }
      case '~': {
        const wob = Math.sin(t * 1.6 + tx * 0.7 + ty * 0.4) * 2;
        px(sx, sy, T, T, C.water);
        px(sx, sy + 5, T, 6, 'rgba(150,205,220,0.18)');
        px(sx, sy + 6 + wob, T, 2, C.water2);
        px(sx + 2, sy + 12 - wob, 6, 1, C.waterLight);
        px(sx + 10, sy + 2 + wob, 4, 1, 'rgba(200,235,242,0.7)');
        if (h > 0.7) { px(sx + 4, sy + 3, 2, 1, '#d7eef4'); px(sx + 12, sy + 10, 2, 1, '#d7eef4'); }
        break;
      }
      case 's':
        px(sx, sy, T, T, C.sand);
        if (h > 0.7) px(sx + 4, sy + 6, 2, 1, C.sand2);
        if (h < 0.2) px(sx + 10, sy + 12, 3, 1, C.sandDark);
        // ripples and tiny shells
        px(sx + 2, sy + 10, 5, 1, 'rgba(210,190,150,0.5)');
        px(sx + 8, sy + 4, 4, 1, 'rgba(255,246,226,0.55)');
        if (h > 0.9) circle(sx + 12, sy + 8, 1.2, '#fbf1e2');
        if (h < 0.08) px(sx + 5, sy + 2, 1, 1, '#c9ad86');
        break;
      case 'w':
        px(sx, sy, T, T, C.wood);
        px(sx, sy + 7, T, 1, C.woodLine);
        px(sx, sy + 15, T, 1, C.woodLine);
        if (h > 0.5) px(sx + 5, sy + 3, 1, 4, C.wood2);
        break;
      case 'g':
        px(sx, sy, T, T, C.glassF);
        px(sx, sy, T, 1, '#e6f2e2');
        px(sx + 7, sy, 1, T, C.glassF2);
        px(sx, sy + 7, T, 1, C.glassF2);
        break;
      case 'm':
        px(sx, sy, T, T, C.forestF);
        if (h > 0.7) px(sx + 3, sy + 4, 3, 2, C.forestLeaf);
        if (h < 0.25) px(sx + 10, sy + 10, 2, 2, '#7d6b4f');
        break;
      case 'c':
        px(sx, sy, T, T, C.soil);
        px(sx, sy + 4, T, 1, C.soilLine);
        px(sx, sy + 11, T, 1, C.soilLine);
        if (h > 0.5) px(sx + 5, sy + 7, 2, 1, C.soil2);
        break;
      case 'x':
        px(sx, sy, T, T, C.wallp);
        px(sx, sy, T, 1, '#efdfd1');
        px(sx + 6, sy + 4, 4, 4, '#dcc3b1');
        px(sx + 6, sy + 4, 4, 1, '#cbb09c');
        break;
      case 'o':
        px(sx, sy, T, T, C.stoneF);
        px(sx, sy, T, 1, C.stoneFL);
        px(sx + 8, sy, 1, T, C.stoneF2);
        px(sx, sy + 8, T, 1, C.stoneF2);
        break;
      case 'r':
        px(sx, sy, T, T, C.rugC);
        px(sx + 1, sy + 1, T - 2, T - 2, '#d0a3b6');
        px(sx + 4, sy + 4, 3, 3, '#e5c6a0');
        break;
      case '_':
        px(sx, sy, T, T, '#1b1a20');
        break;
      case 'F':
        px(sx, sy, T, T, '#93b673');
        px(sx + 2, sy + 3, 1, 6, '#c9b56a');
        px(sx + 6, sy + 2, 1, 7, '#d3bf72');
        px(sx + 10, sy + 3, 1, 6, '#c9b56a');
        px(sx + 13, sy + 4, 1, 5, '#d3bf72');
        break;
      default:
        px(sx, sy, T, T, C.grass);
    }
  };

  /* =========================================================
     PROPS
     ========================================================= */
  function drawTree(x, y, variant) {
    const tm = Date.now() / 1000;
    const sw = Math.sin(tm * 0.85 + x * 0.11 + y * 0.05) * 1.3;
    ellipse(x + 9, y + 16, 9, 3, 'rgba(30,42,28,0.22)');
    // trunk with bark and roots
    px(x + 6, y + 7, 5, 9, '#7b5a3c');
    px(x + 6, y + 7, 2, 9, '#8d6b49');
    px(x + 10, y + 9, 1, 7, '#664a30');
    px(x + 4, y + 14, 3, 1, '#6d5138');
    px(x + 10, y + 15, 3, 1, '#6d5138');
    if (variant === 2) {
      // blossom tree
      circle(x + 8 + sw * 0.4, y + 2, 8, '#d9a3bd');
      circle(x + 3 + sw * 0.6, y + 6, 5.5, '#cf93b0');
      circle(x + 13 + sw * 0.3, y + 5, 6, '#dba9c2');
      circle(x + 8 + sw * 0.5, y + 5, 7, '#e8bcd1');
      circle(x + 6 + sw * 0.4, y + 0.5, 4.5, '#f0cadd');
      px(x + 4, y + 3, 2, 1, '#fbe2ee');
      px(x + 10, y + 4, 2, 1, '#f7d6e6');
      if (Math.sin(tm * 0.8 + x) > 0.6) px(x + 3 + (tm * 6 % 5), y + 8, 1, 1, '#f7d6e6');
      return;
    }
    // layered canopy
    circle(x + 8 + sw * 0.3, y + 1, 7.5, '#456f43');
    circle(x + 2.5 + sw * 0.5, y + 6, 6, '#527c4a');
    circle(x + 13 + sw * 0.2, y + 5.5, 6, '#4d7647');
    circle(x + 8 + sw * 0.45, y + 4.5, 7, '#5c8651');
    circle(x + 6 + sw * 0.35, y + 0.5, 4.6, '#6f9c5e');
    // dappled light + leaves
    px(x + 4, y + 2, 2, 1, '#8dba75');
    px(x + 10, y + 3, 2, 1, '#7fae6c');
    px(x + 7, y + 7, 1, 1, '#a6cf8f');
    if (variant === 1) { px(x + 11, y + 7, 2, 2, '#f0d98a'); px(x + 5, y + 9, 1, 1, '#e8a9c0'); }
    if (Math.sin(tm * 0.6 + x) > 0.85) px(x + 2 + (tm * 5 % 6), y + 9, 1, 1, '#9dc487');
  }
  function drawPine(x, y) {
    const tm = Date.now() / 1000;
    const sway = Math.sin(tm * 0.7 + x * 0.2) * 0.9;
    ellipse(x + 8, y + 16, 7, 3, 'rgba(24,38,30,0.26)');
    px(x + 7, y + 11, 3, 5, '#604a36');
    const layer = (top, bottom, half, col) => {
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(x + 8 + sway, y + top);
      ctx.lineTo(x + 8 + half + sway, y + bottom);
      ctx.lineTo(x + 8 - half + sway, y + bottom);
      ctx.closePath(); ctx.fill();
    };
    layer(-6, 6, 7, '#2f5740');
    layer(-3, 10, 8, '#38624a');
    layer(0, 14, 9, '#3f6d4f');
    layer(3, 17, 8, '#477a56');
    // highlights
    px(x + 6 + sway, y + 4, 1, 6, '#5c8f66');
    px(x + 10 + sway, y + 8, 1, 5, '#54865f');
    px(x + 3 + sway, y + 12, 2, 1, '#5f9269');
  }
  function drawBush(x, y, berries) {
    const sw = Math.sin(Date.now() / 1600 + x) * 0.6;
    ellipse(x + 8, y + 15, 7.5, 2.6, 'rgba(36,52,34,0.2)');
    circle(x + 5.5 + sw, y + 9, 4.8, '#4f7c48');
    circle(x + 11 + sw * 0.6, y + 9, 4.8, '#487141');
    circle(x + 8 + sw, y + 6, 5, '#5d8a52');
    circle(x + 8 + sw, y + 4.4, 3.4, '#6b9a5d');
    px(x + 6 + sw, y + 3, 2, 1, '#86b477');
    if (berries) {
      px(x + 3, y + 8, 2, 2, '#c9697a'); px(x + 10, y + 6, 2, 2, '#c9697a');
      px(x + 8, y + 11, 2, 2, '#b8556a'); px(x + 6, y + 4, 1, 1, '#d98a98');
    } else if (Math.sin(Date.now() / 2200 + x) > 0.2) {
      px(x + 4, y + 7, 1, 1, '#f0d98a'); px(x + 10, y + 5, 1, 1, '#e8c9e0');
    }
  }
  function drawRock(x, y) {
    ellipse(x + 8, y + 15, 7, 2.6, 'rgba(38,38,34,0.22)');
    ctx.fillStyle = '#9d988b';
    ctx.beginPath();
    ctx.moveTo(x + 1, y + 14); ctx.lineTo(x + 3, y + 7); ctx.lineTo(x + 7, y + 4);
    ctx.lineTo(x + 12, y + 5); ctx.lineTo(x + 15, y + 10); ctx.lineTo(x + 14, y + 14);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#b3ae9f';
    ctx.beginPath();
    ctx.moveTo(x + 3, y + 7); ctx.lineTo(x + 7, y + 4); ctx.lineTo(x + 12, y + 5); ctx.lineTo(x + 9, y + 9);
    ctx.closePath(); ctx.fill();
    px(x + 4, y + 11, 4, 1, '#8b877b');
    px(x + 9, y + 12, 3, 1, '#7f7b70');
    px(x + 5, y + 13, 2, 1, '#6f9c62');
  }
  function windowsLit() {
    const S = SAN.state && SAN.state.S;
    if (!S || !S.time) return false;
    const m = S.time.minutes;
    return m >= 17 * 60 + 20 || m < 6 * 60 + 30;
  }

  function drawBuilding(p, x, y) {
    const w = (p.w || 1) * T, h = (p.h || 1) * T;
    const style = p.style || 'cottage';
    const roofs = { home: '#a8667a', store: '#8a7aa8', bakery: '#c07f56', library: '#66758f', flower: '#b57a9a', teashop: '#84945f', cottage: '#a8846a', shed: '#8a7a68', lighthouse: '#e8e4dc' };
    const walls = { home: '#f4e8d9', store: '#efe4d2', bakery: '#f8ead4', library: '#e8e2d4', flower: '#f6e6ee', teashop: '#eef0dd', cottage: '#eddfcc', shed: '#e2d6c4', lighthouse: '#f4f2ec' };
    const trims = { home: '#8e5f70', store: '#6f6290', bakery: '#9a6240', library: '#55627a', flower: '#94607e', teashop: '#687a4e', cottage: '#8a6a52', shed: '#6f6252' };
    const lit = windowsLit();
    if (style === 'lighthouse') { drawLighthouse(x, y, w, h); return; }
    const roofH = Math.max(14, h * 0.44);
    ellipse(x + w / 2, y + h - 2, w * 0.6, 4.5, 'rgba(34,30,26,0.22)');
    // stone foundation
    px(x + 2, y + h - 7, w - 4, 6, '#bcb2a2');
    for (let i = 0; i < w - 8; i += 7) {
      px(x + 3 + i, y + h - 6, 6, 2, i % 14 ? '#c8bfae' : '#aea596');
      px(x + 3 + i, y + h - 3, 5, 2, '#c2b9a9');
    }
    // plaster wall with soft vertical gradient
    const wg = ctx.createLinearGradient(0, y + roofH, 0, y + h - 4);
    wg.addColorStop(0, walls[style] || '#efe2d0');
    wg.addColorStop(1, SAN.util.shade(walls[style] || '#efe2d0', -0.08));
    ctx.fillStyle = wg;
    ctx.fillRect(x + 2, y + roofH, w - 4, h - roofH - 5);
    // timber frame
    const trim = trims[style] || '#8a6a52';
    px(x + 2, y + roofH, 3, h - roofH - 5, trim);
    px(x + w - 5, y + roofH, 3, h - roofH - 5, trim);
    px(x + 2, y + roofH, w - 4, 2, trim);
    if (w > 56) px(x + Math.round(w * 0.62), y + roofH + 6, 2, h - roofH - 12, 'rgba(120,92,70,0.35)');

    // roof with shingle rows
    const apexX = x + w / 2, apexY = y - 3, eaveY = y + roofH + 3;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x - 4, eaveY);
    ctx.lineTo(apexX, apexY);
    ctx.lineTo(x + w + 4, eaveY);
    ctx.closePath();
    ctx.clip();
    const rg = ctx.createLinearGradient(0, apexY, 0, eaveY);
    rg.addColorStop(0, SAN.util.shade(roofs[style] || '#a8667a', 0.16));
    rg.addColorStop(1, SAN.util.shade(roofs[style] || '#a8667a', -0.12));
    ctx.fillStyle = rg;
    ctx.fillRect(x - 4, apexY, w + 8, eaveY - apexY + 1);
    // shingle courses
    for (let ry = apexY + 4; ry < eaveY; ry += 4) {
      px(x - 4, ry, w + 8, 0.8, 'rgba(60,38,44,0.18)');
      const off = (ry - apexY) % 8 > 4 ? 3 : 0;
      for (let sx2 = x - 4 + off; sx2 < x + w + 4; sx2 += 7) {
        px(sx2, ry - 3, 0.8, 3, 'rgba(255,255,255,0.10)');
      }
    }
    // left-light gradient
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    ctx.beginPath();
    ctx.moveTo(x - 4, eaveY); ctx.lineTo(apexX, apexY); ctx.lineTo(apexX, eaveY);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    // ridge cap + eaves
    px(apexX - 1, apexY + 1, 2, roofH, 'rgba(80,50,56,0.35)');
    px(x - 4, eaveY, w + 8, 2.5, trim);
    px(x - 4, eaveY + 2, w + 8, 1, 'rgba(40,26,30,0.2)');
    circle(apexX, apexY + 1, 1.6, trim);
    // chimney + smoke
    if (style === 'bakery' || style === 'home' || style === 'teashop') {
      const chx = x + w - 16, chy = apexY + roofH * 0.32;
      px(chx, chy, 6, 12, '#b9a08c');
      px(chx - 1, chy, 8, 3, '#8d7a6a');
      px(chx + 1, chy - 1, 4, 2, '#d6c4b2');
      const t0 = Date.now() / 900;
      for (let i = 0; i < 3; i++) {
        const ph = (t0 + i * 0.7) % 3;
        circle(chx + 3 + Math.sin(t0 + i) * 2, chy - 4 - ph * 4, 1.6 + ph * 0.9, `rgba(244,240,232,${0.34 - ph * 0.09})`);
      }
    }
    const winY = y + roofH + 9;
    const winLit = lit ? '#ffe8a8' : '#cfe2e8';
    for (let i = 0; i < 2; i++) {
      const wx = x + 8 + i * (w - 27);
      if (w < 54 && i === 1) continue;
      // frame, glass, mullions, curtains, flower box
      px(wx - 1, winY - 1, 12, 11, trim);
      px(wx, winY, 10, 9, winLit);
      if (lit) {
        const gg = ctx.createRadialGradient(wx + 5, winY + 4, 1, wx + 5, winY + 4, 13);
        gg.addColorStop(0, 'rgba(255,226,150,0.75)');
        gg.addColorStop(1, 'rgba(255,226,150,0)');
        ctx.fillStyle = gg;
        ctx.fillRect(wx - 9, winY - 9, 28, 27);
      }
      px(wx + 4.5, winY, 1, 9, trim);
      px(wx, winY + 4, 10, 1, trim);
      px(wx + 1, winY + 1, 2, 7, 'rgba(255,255,255,0.45)');
      px(wx - 2, winY + 10, 14, 2, '#a98460');
      for (let k = 0; k < 4; k++) circle(wx - 1 + k * 3.5, winY + 9, 1.2, ['#e8a9c0', '#f0d98a', '#d9b8e8', '#c9dfae'][(k + i) % 4]);
    }
    // door with panels, handle, step
    if (p.doorRel) {
      const dx = x + p.doorRel.x * T, dy = y + p.doorRel.y * T;
      px(dx + 1, dy + 1, 14, 16, trim);
      px(dx + 2, dy + 2, 12, 14, '#7d5a40');
      px(dx + 3, dy + 3, 10, 5, '#8f6a4c');
      px(dx + 3, dy + 9, 10, 6, '#8f6a4c');
      px(dx + 10, dy + 9, 1.6, 1.6, '#e8c98a');
      px(dx + 1, dy + 15, 14, 2, '#b0a392');
      px(dx - 1, dy - 1, 16, 2, 'rgba(90,60,44,0.3)');
    }
    if (p.sign) {
      const sw2 = Math.max(38, Math.min(70, String(p.sign).length * 5.4 + 10));
      px(x + w / 2 - sw2 / 2, y + roofH + 2, sw2, 9, '#f4e7cf');
      px(x + w / 2 - sw2 / 2, y + roofH + 2, sw2, 1, '#c9b58a');
      px(x + w / 2 - sw2 / 2, y + roofH + 10, sw2, 1, '#c9b58a');
      ctx.fillStyle = '#7c5a40';
      ctx.font = '6px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(p.sign, x + w / 2, y + roofH + 8.4);
      ctx.textAlign = 'left';
    }
    if (style === 'store') {
      // striped awning
      for (let i = 0; i < Math.floor((w - 8) / 6); i++) px(x + 4 + i * 6, winY - 4, 5, 4, i % 2 ? '#f4ecd8' : '#b9a6d8');
      px(x + 4, winY - 4, w - 8, 1, 'rgba(90,70,90,0.3)');
    }
    if (style === 'flower') {
      for (let i = 0; i < 5; i++) circle(x + 6 + i * 6, y + h - 8, 2, i % 2 ? '#e8a9c0' : '#d9b8e8');
      px(x + 3, y + h - 8, w - 6, 1, '#7f9a6a');
    }
    if (style === 'teashop') {
      px(x + 5, y + roofH + 4, 1, 6, '#6f5a44');
      px(x + 3, y + roofH + 10, 5, 6, '#e8b8a0');
      px(x + 4, y + roofH + 11, 3, 4, '#f6e6b8');
    }
  }
  function drawLighthouse(x, y, w, h) {
    const cx = x + w / 2;
    px(cx - 18, y + 10, 36, h - 12, '#f4f2ea');
    px(cx - 18, y + 10, 4, h - 12, '#e2ded2');
    for (let i = 0; i < 4; i++) px(cx - 18, y + 22 + i * 34, 36, 8, '#c96f7a');
    // lantern room
    px(cx - 12, y - 6, 24, 18, '#d9eef7');
    px(cx - 12, y - 6, 24, 3, '#a9c4d2');
    const glow = 0.4 + Math.sin(Date.now() / 700) * 0.15;
    circle(cx, y + 3, 9, `rgba(255,236,170,${glow})`);
    px(cx - 10, y - 10, 20, 5, '#7a8fa0');
    ctx.fillStyle = '#7a8fa0';
    ctx.beginPath(); ctx.moveTo(cx - 12, y - 10); ctx.lineTo(cx, y - 18); ctx.lineTo(cx + 12, y - 10); ctx.closePath(); ctx.fill();
    // door + windows
    px(cx - 6, y + h - 16, 12, 14, '#8a6a4c');
    px(cx - 5, y + h - 15, 10, 12, '#6d4f38');
    px(cx - 3, y + 30, 6, 7, '#f6e6b8');
    px(cx - 3, y + 56, 6, 7, '#f6e6b8');
    ellipse(x + w / 2, y + h - 2, w * 0.5, 4, 'rgba(40,40,40,0.18)');
  }
  function drawWindmill(x, y, w, h) {
    ellipse(x + w / 2, y + h - 2, w * 0.45, 4, 'rgba(40,40,40,0.2)');
    px(x + 14, y + 20, w - 28, h - 22, '#efe6d2');
    px(x + 14, y + 20, 5, h - 22, '#ddd3bd');
    ctx.fillStyle = '#a8766a';
    ctx.beginPath(); ctx.moveTo(x + 10, y + 22); ctx.lineTo(x + w / 2, y + 2); ctx.lineTo(x + w - 10, y + 22); ctx.closePath(); ctx.fill();
    px(x + w / 2 - 6, y + h - 18, 12, 16, '#8a6a4c');
    px(x + w / 2 - 3, y + 34, 7, 8, '#f6e6b8');
    // sails
    const ang = Date.now() / 2600;
    ctx.save();
    ctx.translate(x + w / 2, y + 26);
    ctx.rotate(ang);
    for (let i = 0; i < 4; i++) {
      ctx.rotate(Math.PI / 2);
      ctx.fillStyle = '#f7efe0';
      ctx.fillRect(-2, -40, 4, 38);
      ctx.fillStyle = '#d8c6a8';
      ctx.fillRect(-4, -38, 8, 16);
    }
    ctx.restore();
    circle(x + w / 2, y + 26, 3, '#6d5a44');
  }
  function drawFountain(x, y, t) {
    const w = 48, h = 48;
    ellipse(x + 24, y + 44, 24, 6, 'rgba(40,40,40,0.2)');
    px(x + 2, y + 16, 44, 28, '#c9c2b4');
    px(x + 4, y + 18, 40, 24, '#a9c9d4');
    const wob = Math.sin(t * 2) * 1.5;
    px(x + 6, y + 20 + wob, 36, 2, '#c6e4ec');
    px(x + 16, y + 10, 16, 22, '#cfc8bb');
    px(x + 18, y + 12, 12, 8, '#b9d6e0');
    for (let i = 0; i < 4; i++) {
      const ph = (t * 1.5 + i * 0.9) % 4;
      circle(x + 24 + Math.sin(i * 2 + t) * 8, y + 8 - ph * 3, 1.6, `rgba(200,235,245,${0.9 - ph / 5})`);
    }
    circle(x + 24, y + 6, 3, '#dfeef5');
  }

  function drawBubble(text, cx, cy, a) {
    if (!text) return;
    ctx.font = '6px monospace';
    const maxW = 92;
    const words = String(text).split(' ');
    const lines = [];
    let cur = '';
    words.forEach((w) => {
      const test = cur ? cur + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; }
      else cur = test;
    });
    if (cur) lines.push(cur);
    const wpx = Math.min(maxW, Math.max.apply(null, lines.map((l) => ctx.measureText(l).width))) + 8;
    const hpx = lines.length * 8 + 5;
    const x0 = Math.round(cx - wpx / 2), y0 = Math.round(cy - hpx);
    ctx.fillStyle = 'rgba(250,246,236,' + (0.92 * a) + ')';
    ctx.fillRect(x0, y0, wpx, hpx);
    ctx.fillStyle = 'rgba(120,100,84,' + a + ')';
    ctx.fillRect(x0, y0 + hpx - 1, wpx, 1);
    ctx.fillStyle = 'rgba(60,48,40,' + a + ')';
    ctx.textAlign = 'left';
    lines.forEach((l, i) => ctx.fillText(l, x0 + 4, y0 + 8 + i * 8));
    ctx.fillStyle = 'rgba(250,246,236,' + (0.92 * a) + ')';
    ctx.beginPath();
    ctx.moveTo(cx - 3, y0 + hpx);
    ctx.lineTo(cx + 3, y0 + hpx);
    ctx.lineTo(cx, y0 + hpx + 4);
    ctx.closePath();
    ctx.fill();
    ctx.textAlign = 'left';
  }

  function drawProp(p, x, y, t) {
    const w = (p.w || 1) * T, h = (p.h || 1) * T;
    switch (p.t) {
      case 'tree': drawTree(x, y, p.variant || 0); break;
      case 'pine': drawPine(x, y); break;
      case 'bush': drawBush(x, y, false); break;
      case 'berrybush': drawBush(x, y, true); break;
      case 'rock': drawRock(x, y); break;
      case 'building': drawBuilding(p, x, y); break;
      case 'windmill': drawWindmill(x, y, w, h); break;
      case 'fountain': drawFountain(x, y, t); break;
      case 'bench':
        px(x + 1, y + 8, w - 2, 4, '#a8764f');
        px(x + 1, y + 5, w - 2, 3, '#c08a5c');
        px(x + 2, y + 12, 2, 3, '#7a5a3c');
        px(x + w - 4, y + 12, 2, 3, '#7a5a3c');
        break;
      case 'lamp': {
        const gl = 0.5 + Math.sin(t * 2 + x) * 0.12;
        px(x + 7, y + 5, 2, 10, '#6d5a44');
        px(x + 6, y + 15, 4, 1, '#5a4a38');
        px(x + 4, y + 1, 8, 6, '#7d6a50');
        px(x + 5, y + 2, 6, 4, 'rgba(255,236,170,0.9)');
        px(x + 4, y, 8, 1, '#5f5344');
        circle(x + 8, y + 3, 3.5, `rgba(255,230,160,${gl})`);
        circle(x + 8, y + 4, 9, `rgba(255,230,160,${gl * 0.12})`);
        break;
      }
      case 'bunting': {
        const sag = Math.sin(t * 1.1) * 0.6;
        ctx.strokeStyle = '#8a7358';
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(x + 2, y + 4);
        ctx.quadraticCurveTo(x + w / 2, y + 9 + sag, x + w - 2, y + 4);
        ctx.stroke();
        const bcols = ['#e8c6d8', '#f4ecd8', '#c9b6e3', '#f0d98a'];
        for (let i = 0; i < 9; i++) {
          const px2 = x + 5 + i * ((w - 10) / 8);
          const py2 = y + 5 + Math.sin((i / 8) * Math.PI) * 4 + sag * 0.6;
          ctx.fillStyle = bcols[i % 4];
          ctx.beginPath();
          ctx.moveTo(px2 - 2, py2); ctx.lineTo(px2 + 2, py2); ctx.lineTo(px2, py2 + 4);
          ctx.closePath(); ctx.fill();
        }
        break;
      }
      case 'board':
        px(x + 1, y + 2, w - 2, 12, '#b98d62');
        px(x + 2, y + 3, w - 4, 10, '#d8b98c');
        px(x + 4, y + 5, 10, 7, '#f4ecd8');
        px(x + 16, y + 6, 8, 5, '#e6dcc0');

  /* =========================================================

    const hx = sx + 3, hy = y - 1;

      px(sx + 5, y + 18 - liftL, 2, 5, skinDark);

      px(sx + 5, y + 21 - liftL, 2, 2, '#6b5442');
      px(sx + 9, y + 21 - liftR, 2, 2, '#6b5442');

      }
      if (p.accessory === 'leaf') { px(hx + 2, hy + 1, 3, 2, '#7dad6e'); px(hx + 3, hy, 1, 1, '#8fbf7a'); }
      if (p.accessory === 'apron') { px(hx + 4, hy + 10, 7, 3, accent); px(hx + 4, hy + 9, 1, 2, accent); px(hx + 10, hy + 9, 1, 2, accent); }
    } else {
      px(hx, hy + 1, 12, 11, hair);
      px(hx + 1, hy + 1, 10, 4, hair);
      px(hx + 2, hy + 3, 8, 1, hairLight);
      px(hx + 2, hy + 9, 8, 3, hairDark);
      if (p.accessory === 'hat' || p.accessory === 'cap') px(hx - 1, hy - 2, 14, 4, accent);
      if (p.accessory === 'halo') ellipse(hx + 6, hy - 3, 6, 1.6, 'rgba(255,240,190,0.85)');
      if (p.accessory === 'ribbon') px(hx + 5, hy + 1, 4, 2, c.ribbon || '#e8a9c0');
    }
    // hair sway on walk
    if (p.moving && (p.hair === 'long' || p.hair === 'wavy')) {
      px(hx + (swing > 0 ? -2 : 13), hy + 9, 1, 4, hair);
    }
  };

  R.drawNPC = function (n, sx, sy, t) {
    if (!n) return;
    const sitting = n.pose === 'sit';
    const bob = sitting ? 0 : n.moving ? Math.sin(t * 6 + n.x) * 1 : Math.sin(t * 1.5 + (n.x || 0)) * 0.4;
    R.drawPlayer({
      colors: Object.assign({ skinDark: '#e0bfa8' }, n.colors),
      hair: n.hair, accessory: n.accessory, facing: n.facing || 'down',
      moving: n.moving, walkPhase: t * 7, glow: n.colors && n.colors.glow,
      gender: n.gender, outfit: n.outfit,
    }, sx, sy + bob + (sitting ? 2.5 : 0), t);
    if (sitting) px(sx + 1, sy + 10, 12, 4, 'rgba(60,45,35,0.18)');
    if (n.act === 'baking' || n.act === 'arranging' || n.act === 'kneading') {
      circle(sx + 12, sy + 14, 2, 'rgba(255,255,255,0.25)');
    }
  };

  R.drawCat = function (cat, sx, sy, t) {
    if (!cat) return;
    const c = cat.colorHex || '#d8a878';
    ellipse(sx + 6, sy + 10, 5, 2, 'rgba(30,30,30,0.22)');
    const sleeping = cat.state === 'sleep';
    if (sleeping) {
      ellipse(sx + 6, sy + 7, 6, 4.5, c);
      ellipse(sx + 3, sy + 6, 3, 3, c);
      px(sx + 1, sy + 3, 2, 3, c);
      px(sx + 5, sy + 3, 2, 3, c);
      px(sx + 2, sy + 6, 2, 1, '#4a3a30');
      px(sx + 5, sy + 6, 2, 1, '#4a3a30');
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.font = '7px monospace';
      ctx.fillText('z', sx + 9, sy + 2 - Math.sin(t * 2) * 2);
      return;
    }
    const wag = Math.sin(t * 3) * 2;
    px(sx + 4, sy + 7, 6, 4, c);
    px(sx + 3, sy + 5, 4, 4, c);
    px(sx + 4, sy + 3, 2, 2, c);
    px(sx + 6, sy + 3, 2, 2, c);
    px(sx + 4, sy + 4, 1, 1, '#f2a0a0');
    px(sx + 6, sy + 4, 1, 1, '#f2a0a0');
    px(sx + 5, sy + 6, 1, 1, '#3a2f28');
    px(sx + 7, sy + 6, 1, 1, '#3a2f28');
    px(sx + 2, sy + 8, 2, 1, c);
    px(sx + 10, sy + 5 + wag * 0.5, 2, 2, c);
    if (cat.accessory === 'collar') px(sx + 4, sy + 7, 6, 1, '#c9b8a0');
    if (cat.mood === 'happy') px(sx + 9, sy + 8, 1, 1, '#f0a0c0');
  };

  /* =========================================================
     WORLD FRAME
     ========================================================= */
  R.drawAmbient = function (area, cam, t, weather) {
    if (!area || area.region === 'indoor' || area.weatherFx === false) return;
    const S = SAN.state && SAN.state.S;
    const mins = S ? S.time.minutes : 12 * 60;
    const night = mins >= 20 * 60 || mins < 5 * 60;
    const golden = mins >= 16 * 60 + 30 && mins < 19 * 60;
    // drifting petals / pollen
    const count = area.id === 'forest' || area.id === 'meadow' ? 26 : 14;
    for (let i = 0; i < count; i++) {
      const seed = i * 37.7;
      const speed = 7 + (i % 5) * 2.4;
      const x = ((seed * 13 + t * speed) % (W + 40)) - 20;
      const y = ((seed * 7 + Math.sin(t * 0.6 + i) * 12 + t * 4.5) % (H + 20)) - 10;
      const a = 0.22 + Math.sin(t * 1.4 + i) * 0.14;
      if (night) {
        if (i % 3 === 0) circle(x, y, 0.9, `rgba(240,248,180,${Math.max(0, a + 0.2)})`);
      } else {
        px(x, y, 1.3, 1.3, area.id === 'forest' ? `rgba(214,196,238,${a})` : `rgba(250,232,210,${a})`);
      }
    }
    // fireflies at night
    if (night) {
      for (let i = 0; i < 16; i++) {
        const fx = ((i * 53 + t * 9 + Math.sin(t * 0.7 + i) * 22) % (W + 30)) - 15;
        const fy = ((i * 31 + Math.cos(t * 0.8 + i * 2) * 16 + t * 5) % (H + 30)) - 15;
        const gl = 0.35 + Math.sin(t * 2 + i * 1.7) * 0.3;
        circle(fx, fy, 1.5, `rgba(236,246,160,${Math.max(0, gl)})`);
        circle(fx, fy, 4.5, `rgba(236,246,160,${Math.max(0, gl) * 0.12})`);
      }
    }
    // slow cloud shadows
    if (area.id !== 'library' && area.id !== 'teashop' && area.id !== 'store' && area.id !== 'bakery') {
      ctx.globalAlpha = golden ? 0.05 : 0.035;
      ctx.fillStyle = '#2f3a44';
      for (let i = 0; i < 2; i++) {
        const cx = ((t * (8 + i * 4) + i * 320) % (W + 260)) - 130;
        ctx.beginPath();
        ctx.ellipse(cx, H * (0.2 + i * 0.42), 90, 26, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    // passing birds by day
    if (!night && Math.sin(t * 0.11) > 0.55) {
      const bx = ((t * 26) % (W + 120)) - 60;
      const by = 34 + Math.sin(t * 0.5) * 8;
      ctx.strokeStyle = 'rgba(70,66,78,0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(bx - 6, by); ctx.quadraticCurveTo(bx - 3, by - 3, bx, by);
      ctx.quadraticCurveTo(bx + 3, by - 3, bx + 6, by);
      ctx.stroke();
    }
  };

  R.drawWorld = function (scene) {
    if (!ctx) return;
    const { area, cam, player, npcs, cat, timeSec, weather } = scene;
    ctx.fillStyle = '#2a2a30';
    ctx.fillRect(0, 0, W, H);
    const startX = Math.floor(cam.x / T) - 1;
    const startY = Math.floor(cam.y / T) - 1;
    const cols = Math.ceil(W / T) + 2;
    const rows = Math.ceil(H / T) + 2;

    for (let ty = startY; ty < startY + rows; ty++) {
      for (let tx = startX; tx < startX + cols; tx++) {
        const sx = Math.round(tx * T - cam.x), sy = Math.round(ty * T - cam.y);
        if (tx < 0 || ty < 0 || tx >= area.w || ty >= area.h) { px(sx, sy, T, T, '#2f3a2c'); continue; }
        R.drawTile(area.grid[ty][tx], sx, sy, tx, ty, timeSec);
      }
    }

    // soft grass fringe where lawn meets paths and water
    for (let ty = startY; ty < startY + rows; ty++) {
      for (let tx = startX; tx < startX + cols; tx++) {
        if (tx < 0 || ty < 0 || tx >= area.w || ty >= area.h) continue;
        const ch = area.grid[ty][tx];
        if (ch !== '.' && ch !== ',') continue;
        const sx = Math.round(tx * T - cam.x), sy = Math.round(ty * T - cam.y);
        const at = (dx, dy) => (area.grid[ty + dy] || [])[tx + dx] || '';
        const edge = '~=#s';
        if (edge.indexOf(at(0, -1)) >= 0) {
          for (let i = 0; i < 4; i++) px(sx + 1 + i * 4, sy, 1, 2 + (i % 2), 'rgba(86,128,74,0.55)');
        }
        if (edge.indexOf(at(0, 1)) >= 0) {
          for (let i = 0; i < 4; i++) px(sx + 2 + i * 4, sy + 13 - (i % 2), 1, 2, 'rgba(118,160,96,0.5)');
        }
        if (edge.indexOf(at(-1, 0)) >= 0) {
          for (let i = 0; i < 3; i++) px(sx, sy + 3 + i * 4, 2, 1, 'rgba(86,128,74,0.5)');
        }
        if (edge.indexOf(at(1, 0)) >= 0) {
          for (let i = 0; i < 3; i++) px(sx + 13, sy + 4 + i * 4, 2, 1, 'rgba(86,128,74,0.5)');
        }
      }
    }

    // farm plots state overlay
    if (area.plots && area.plots.length) {
      const S = SAN.state.S;
      area.plots.forEach((pl) => {
        const key = pl.area + ':' + pl.x + ',' + pl.y;
        const plot = S.farm.plots[key];
        const sx = Math.round(pl.x * T - cam.x), sy = Math.round(pl.y * T - cam.y);
        if (sx < -32 || sy < -32 || sx > W + 32 || sy > H + 32) return;
        if (plot) {
          px(sx, sy, T, T, plot.watered ? '#6b4a35' : '#8a6247');
          px(sx, sy + 13, T, 3, '#5f4330');
          if (plot.watered) px(sx + 2, sy + 2, 2, 2, 'rgba(160,210,230,0.5)');
        } else {
          px(sx, sy, T, T, '#8a6247');
          px(sx, sy + 8, T, 1, '#6b4a35');
        }
        if (plot && plot.crop) {
          const c = SAN.data.crops[plot.crop];
          const stage = plot.stage || 0;
          const ratio = Math.min(1, stage / Math.max(1, c.days));
          if (ratio >= 1) {
            circle(sx + 8, sy + 6, 5, '#6f9c62');
            const cols = { lavender: '#b9a4d8', marigold: '#e8a04a', moonpetal: '#dfe6f2', sunrose: '#f2c05a', bluebell: '#8fa8e0', starflower: '#f0e0a0', pumpkin: '#e0a04a', carrot: '#e8a06a' };
            circle(sx + 8, sy + 4, 4, cols[c.id] || '#e8a9c0');
            circle(sx + 8, sy + 4, 1.6, '#f6e6b8');
          } else if (ratio > 0.05) {
            px(sx + 7, sy + 8 - ratio * 4, 2, 6 + ratio * 4, '#6f9c62');
            px(sx + 4, sy + 7 - ratio * 3, 4, 2, '#7dad6e');
            px(sx + 9, sy + 9 - ratio * 2, 3, 2, '#7dad6e');
          } else {
            px(sx + 6, sy + 11, 4, 2, '#5f4330');
            px(sx + 7, sy + 9, 2, 2, '#7dad6e');
          }
        }
      });
    }

    const items = [];
    area.props.forEach((p) => {
      const sx = p.x * T - cam.x, sy = p.y * T - cam.y;
      const h = (p.h || 1) * T, w2 = (p.w || 1) * T;
      if (sx + w2 < -40 || sy + h < -60 || sx > W + 40 || sy > H + 60) return;
      items.push({ p, sx, sy, depth: (p.y + (p.h || 1)) * 100 + p.x * 0.01 });
    });
    // placed furniture
    if (area.id === 'home') {
      const S = SAN.state.S;
      (S.house.furniture || []).forEach((f, i) => {
        items.push({ p: { t: 'furn_' + f.id, id: f.id, x: f.x, y: f.y, w: 1, h: 1 }, sx: f.x * T - cam.x, sy: f.y * T - cam.y, depth: (f.y + 1) * 100 + f.x * 0.02 + 0.5 });
      });
    }
    // entities
    npcs.forEach((n) => items.push({ npc: n, sx: n.px - cam.x, sy: n.py - cam.y, depth: (n.py / T + 1) * 100 }));
    if (cat) items.push({ cat, sx: cat.px - cam.x, sy: cat.py - cam.y, depth: (cat.py / T + 1) * 100 + 0.2 });
    items.push({ player, sx: player.px - cam.x, sy: player.py - cam.y, depth: (player.py / T + 1) * 100 + 0.3 });
    items.sort((a, b) => a.depth - b.depth);
    items.forEach((it) => {
      if (it.p) {
        if (it.p.t && it.p.t.indexOf('furn_') === 0) drawFurniture(it.p.id, it.sx, it.sy);
        else drawProp(it.p, it.sx, it.sy, timeSec);
        if (it.p.t === 'designator') { }
      } else if (it.npc) {
        const npcDef = Object.assign({}, it.npc.def, { pose: it.npc.pose, moving: it.npc.moving, facing: it.npc.facing });
        R.drawNPC(npcDef, it.sx, it.sy, timeSec);
        if (it.npc.def.id === 'nyssa' && Math.sin(timeSec) > 0.5) {
          circle(it.sx + 7, it.sy - 2, 1.2, 'rgba(255,250,220,0.7)');
        }
        if (it.npc.bubble && it.npc.bubble.t > 0) drawBubble(it.npc.bubble.text, it.sx + 7, it.sy - 12, Math.min(1, it.npc.bubble.t));
      } else if (it.cat) {
        R.drawCat(it.cat, it.sx, it.sy, timeSec);
      } else if (it.player) {
        R.drawPlayer(it.player.sprite, it.sx, it.sy, timeSec);
      }
    });

    R.drawAmbient(area, cam, timeSec, weather);

    // interaction hint
    if (scene.hint) {
      const hx = scene.hint.px - cam.x, hy = scene.hint.py - cam.y;
      ctx.fillStyle = 'rgba(40,32,26,0.82)';
      const label = scene.hint.label || 'E';
      ctx.font = '7px monospace';
      const tw = Math.max(12, ctx.measureText(label).width + 6);
      ctx.fillRect(Math.round(hx - tw / 2), Math.round(hy - 22), tw, 10);
      ctx.fillStyle = '#f6eeda';
      ctx.textAlign = 'center';
      ctx.fillText(label, Math.round(hx), Math.round(hy - 14.5));
      ctx.textAlign = 'left';
    }
    if (scene.label) {
      ctx.font = '7px monospace';
      ctx.fillStyle = 'rgba(20,18,24,0.65)';
      const tw = ctx.measureText(scene.label).width + 10;
      ctx.fillRect(6, 6, tw, 12);
      ctx.fillStyle = '#efe6d4';
      ctx.fillText(scene.label, 11, 14.5);
    }
  };

  function drawFurniture(id, x, y) {
    switch (id) {
      case 'bed_oak': case 'bed_rose':
        px(x + 1, y + 2, 14, 13, '#b98d62');
        px(x + 2, y + 3, 12, 10, id === 'bed_rose' ? '#e8d0e0' : '#e8dcc8');
        px(x + 4, y + 5, 8, 4, '#f4ecd8');
        break;
      case 'chair_wicker': case 'chair_velvet':
        px(x + 3, y + 6, 10, 3, '#b98d62');
        px(x + 3, y + 3, 10, 3, id === 'chair_velvet' ? '#a87a9a' : '#c9a97e');
        px(x + 4, y + 9, 2, 5, '#8a6a4a'); px(x + 10, y + 9, 2, 5, '#8a6a4a');

      case 'table_round':

      case 'bookshelf_tall':
        px(x + 2, y, 12, 16, '#9a7150');
        for (let r = 0; r < 3; r++) for (let i = 0; i < 3; i++) px(x + 3 + i * 4, y + 2 + r * 5, 3, 4, ['#c98a8a', '#8aa9c9', '#c9c08a'][(i + r) % 3]);
        break;
      case 'rug_rose': case 'rug_sage':

      case 'lamp_glow':

      case 'lamp_candle':

      case 'plant_fern': case 'plant_lavender':

      case 'curtain_lace':

        break;
      case 'cat_bed':
        ellipse(x + 8, y + 11, 7, 4, '#c9a3b6');

      case 'cat_tower':
        px(x + 3, y + 5, 10, 11, '#c9a97e');

      case 'wind_chime':

        break;

      default:
        px(x + 2, y + 4, 12, 10, '#b0a89a');
    }
  }

  /* =========================================================
     WEATHER + LIGHT
     ========================================================= */
  R.drawLighting = function (minutes, weather, area) {
    if (!ctx) return;
    const h = minutes / 60;
    let tint = null, alpha = 0;
    if (h >= 5 && h < 7.5) { tint = '#ffc79a'; alpha = 0.2 * (1 - (h - 5) / 2.5); }
    else if (h >= 7.5 && h < 16) { tint = null; alpha = 0; }
    else if (h >= 16 && h < 18.5) { tint = '#ffb072'; alpha = 0.16 + 0.12 * ((h - 16) / 2.5); }
    else if (h >= 18.5 && h < 20) { tint = '#a07ab8'; alpha = 0.3 * ((h - 18.5) / 1.5); }
    else if (h >= 20 || h < 5) { tint = '#33406e'; alpha = area && area.safe ? 0.2 : 0.46; }
    if (weather === 'storm') alpha += 0.1;
    if (weather === 'rain') alpha += 0.05;
    if (tint && alpha > 0) {
      ctx.save();
      ctx.globalCompositeOperation = 'multiply';
      ctx.fillStyle = SAN.util.rgba(tint, Math.min(0.55, alpha));
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    if (h >= 20 || h < 5) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const grd = ctx.createRadialGradient(W / 2, H / 2, 20, W / 2, H / 2, Math.max(150, W * 0.6));
      grd.addColorStop(0, area && area.safe ? 'rgba(255,210,140,0.16)' : 'rgba(190,205,255,0.10)');
      grd.addColorStop(1, 'rgba(255,220,150,0)');
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    // gentle vignette frames the scene without hiding gameplay
    if (area && !area.safe) {
      const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.max(W, H) * 0.78);
      vg.addColorStop(0, 'rgba(24,18,30,0)');
      vg.addColorStop(1, 'rgba(24,18,30,0.22)');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
    }
    if (weather === 'fog') {
      ctx.fillStyle = 'rgba(220,225,235,0.28)';
      ctx.fillRect(0, 0, W, H);
    }
    if (weather === 'cloudy' || weather === 'rain' || weather === 'storm') {
      ctx.fillStyle = 'rgba(90,100,120,0.10)';
      ctx.fillRect(0, 0, W, H);
    }
  };

  R.drawWeather = function (weather, t, intensity) {
    if (!ctx) return;
    const n = intensity || 1;
    if (weather === 'rain' || weather === 'storm') {
      ctx.strokeStyle = 'rgba(190,215,235,0.5)';
      ctx.lineWidth = 1;
      const count = Math.floor(90 * n);
      for (let i = 0; i < count; i++) {
        const seed = i * 37.7;
        const x = (seed * 13 + t * 260) % (W + 40) - 20;
        const y = (seed * 29 + t * 620) % (H + 40) - 20;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 2, y + 7); ctx.stroke();
      }
      if (weather === 'storm' && Math.sin(t * 0.8) > 0.995) {
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fillRect(0, 0, W, H);
      }
    } else if (weather === 'snow') {
      for (let i = 0; i < 70 * n; i++) {
        const seed = i * 53.3;
