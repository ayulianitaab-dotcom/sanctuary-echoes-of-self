    },
  ];

  const CRISIS = ['kill myself', 'suicide', 'suicidal', 'end my life', 'want to die', 'self harm', 'self-harm', 'hurt myself', 'no reason to live'];
  const SUPPORT_LINE = 'If you are in danger or thinking about harming yourself, please reach out to a local crisis line or emergency service, or a person you trust. This game can be a quiet place to breathe, but it cannot keep you safe — you deserve real support from a human being.';

  J.analyze = function (text, moodId) {
    const t = (text || '').toLowerCase();
    if (CRISIS.some((k) => t.includes(k))) {
      return {
        theme: 'care',
        text: SUPPORT_LINE,
        prompt: 'Can you reach out to one person or service right now? Even a message counts.',
        activity: null,
        choices: ['Save this entry', 'Sit quietly in Sanctuary for a moment'],
        crisis: true,
      };
    }
    let best = null, bestScore = 0;
    THEMES.forEach((th) => {
      let score = 0;
      th.keys.forEach((k) => { if (t.includes(k)) score += k.length > 6 ? 2 : 1.5; });
      if (score > bestScore) { bestScore = score; best = th; }
    });
    const moodThemes = { anxious: 'anxiety', sad: 'sadness', lonely: 'loneliness', angry: 'anger', tired: 'exhaustion', hopeful: 'gratitude', grateful: 'gratitude', calm: 'gratitude', confused: 'confusion', happy: 'gratitude' };
    if ((!best || bestScore < 2) && moodThemes[moodId]) best = THEMES.find((x) => x.id === moodThemes[moodId]);
    if (!best) best = THEMES.find((x) => x.id === (moodId === 'anxious' ? 'anxiety' : 'confusion'));

    const prompt = Math.random() < 0.5 ? U.pick(best.prompts) : U.pick(SAN.data.reflectPrompts);
    const closing = [
      'Take this at whatever pace you need. You can close this page at any time.',
      'Nothing here is a test. You can skip any part of this.',
      'You do not have to feel differently after writing. Writing is enough on its own.',
      'There is no right way to be a person. There is only the next kind thing.',
    ];
    const response = `${best.feel}\n\n${best.support}\n\n${U.pick(closing)}`;
    return {
      theme: best.id,
      text: response,
      prompt,
      activity: best.activity,
      choices: ['Reflect on this feeling', best.activity ? best.activity.label : 'Take a slow breath', 'Save this entry and rest'],
      crisis: false,
    };
  };

  J.save = function (entry) {
    const S = SAN.state.S;
    const now = new Date();
    const reflection = entry.reflection || J.analyze(entry.text, entry.mood);
    const record = {
      id: U.uid(),
      text: entry.text,
      mood: entry.mood || 'calm',
      tags: entry.tags || [],
      day: S.time.day, season: S.time.season, year: S.time.year, minutes: S.time.minutes,
      createdAt: now.getTime(),
      reflection,
    };
    S.journal.unshift(record);
    S.stats.journalEntries = S.journal.length;
    SAN.quests.notify('journal', 'any', 1);
    SAN.progression.addXp('exploration', 6);
    SAN.progression.checkAchievements();
    SAN.audio.sfx('page');
    S.tutorial.journaled = true;
    SAN.save.autosave();
    return record;
  };

  J.remove = function (id) {
    const S = SAN.state.S;
    const i = S.journal.findIndex((e) => e.id === id);
    if (i >= 0) { S.journal.splice(i, 1); return true; }
    return false;
  };

  J.list = function (filter) {
    const S = SAN.state.S;
    const f = filter || {};
    let list = S.journal.slice();
    if (f.mood) list = list.filter((e) => e.mood === f.mood);
    if (f.tag) list = list.filter((e) => (e.tags || []).includes(f.tag));
    if (f.q) {
      const q = f.q.toLowerCase();
      list = list.filter((e) => e.text.toLowerCase().includes(q) || (e.tags || []).join(' ').toLowerCase().includes(q));
    }
    return list;
  };

  J.exportData = function () {
    const S = SAN.state.S;
    return JSON.stringify({
      game: 'Sanctuary: Echoes of Self',
      exported: new Date().toISOString(),
      note: 'Private journal export. Only you have this file.',
      entries: S.journal,
      memories: S.memories,
    }, null, 2);
  };

  J.moodDef = (id) => SAN.data.moods.find((m) => m.id === id) || SAN.data.moods[8];
  J.moodLabel = (id) => (J.moodDef(id) || {}).label || id;
})();
</script>
<script>
/* Sanctuary — the Memory Vault: symbolic stones, optional care, gentle growth.
   Nothing here is compulsory; any activity can be skipped or closed at any time. */
(function () {
  const M = (SAN.memory = {});
  const U = SAN.util;

  M.create = function (data) {
    const S = SAN.state.S;
    const rec = {
      id: U.uid(),
      title: (data.title || 'An unnamed thing').slice(0, 80),
      desc: (data.desc || '').slice(0, 800),
      emotion: data.emotion || 'longing',
      object: data.object || 'stone',
      progress: 0,
      cares: {},
      createdDay: S.time.day,
      createdSeason: S.time.season,
      lastCareDay: 0,
    };
    S.memories.unshift(rec);
    SAN.audio.sfx('sparkle');
    return rec;
  };

  M.get = function (id) { return SAN.state.S.memories.find((m) => m.id === id); };

  M.care = function (id, actionId) {
    const S = SAN.state.S;
    const m = M.get(id);
    if (!m) return { ok: false, msg: 'That memory is not here.' };
    if (m.lastCareDay === S.time.day) {
      return { ok: false, msg: 'You have already spent a moment here today. That is enough.' };
    }
    const action = SAN.data.memoryCare.find((a) => a.id === actionId);
    if (!action) return { ok: false, msg: '' };
    m.lastCareDay = S.time.day;
    m.cares[actionId] = (m.cares[actionId] || 0) + 1;
    m.progress = Math.min(5, m.progress + 1);
    S.stats.memoriesCared++;
    if (m.progress === 3 && !m.shardGiven) {
      m.shardGiven = true;
      SAN.state.addItem('memory_shard', 1);
    }
    SAN.quests.notify('memory', 'any', 1);
    SAN.progression.addXp('exploration', 5);
    SAN.progression.checkAchievements();
    SAN.audio.sfx('sparkle');
    SAN.save.autosave();
    const stage = M.stageName(m.progress);
    return { ok: true, line: action.line, stage, progress: m.progress };
  };

  M.stageName = function (p) {
    if (p >= 5) return 'A glowing memory garden';
    if (p >= 4) return 'In full bloom';
    if (p >= 3) return 'Flowers around the stone';
    if (p >= 2) return 'A small green sprout';
    if (p >= 1) return 'A little softer, a little lighter';
    return 'A grey stone, held';
  };

  M.stageDesc = function (p) {
    const names = [
      'It is here. That is all it has to do right now.',
      'Something small has started to grow beside it.',
      'You put something living next to it. It did not have to be permanent.',
      'Flowers. Small, bright, and entirely yours.',
      'The whole little garden is glowing. It is still your memory. It is just not the only thing.',
    ];
    return names[Math.min(5, Math.max(0, p))];
  };

  M.careActionsToday = function (id) {
    const S = SAN.state.S;
    const m = M.get(id);
    if (!m) return [];
    return SAN.data.memoryCare.filter((a) => m.lastCareDay !== S.time.day);
  };

  M.delete = function (id) {
    const S = SAN.state.S;
    const i = S.memories.findIndex((m) => m.id === id);
    if (i >= 0) { S.memories.splice(i, 1); return true; }
    return false;
  };

  M.byStone = function (idx) {
    return SAN.state.S.memories[idx] || null;
  };

  M.forestProgress = function () {
    const S = SAN.state.S;
    return [0, 1, 2].map((i) => (S.memories[i] ? S.memories[i].progress : 0));
  };
})();
</script>
<script>
/* Sanctuary — friendship: talking, gifts, tiers. No decay, ever. */
(function () {
  const R = (SAN.rel = {});

  R.get = function (id) {
    const S = SAN.state.S;
    if (!S.friendship[id]) S.friendship[id] = { pts: 0, talkedDay: 0, giftsToday: 0, met: false };
    return S.friendship[id];
  };
  R.pts = (id) => R.get(id).pts;
  R.tier = (id) => SAN.data.friendTier(R.get(id).pts);

  R.add = function (id, pts, silent) {
    const S = SAN.state.S;
    const f = R.get(id);
    const before = SAN.data.friendTier(f.pts).name;
    f.pts = Math.max(0, Math.min(100, f.pts + pts));
    const after = SAN.data.friendTier(f.pts).name;
    if (before !== after && !silent) {
      const npc = SAN.data.npcs[id];
      SAN.ui.toast(f.pts >= 21 ? (npc ? npc.name : id) + ' now sees you as: ' + after : after, 'friend');
      SAN.audio.sfx('sparkle');
      SAN.progression.checkAchievements();
    }
    return f.pts;
  };

  R.talk = function (id) {
    const S = SAN.state.S;
    const f = R.get(id);
    if (f.talkedDay === S.time.day) return 0;
    f.talkedDay = S.time.day;
    let gain = 2;
    if (SAN.time.isFestival('tea_gathering') && S.time.minutes >= 17 * 60) gain *= 2;
    if (SAN.time.isFestival('flower_festival')) gain *= 2;
    R.add(id, gain);
    f.met = true;
    SAN.progression.addXp('exploration', 2);
    return gain;
  };

  R.gift = function (id, itemId) {
    const S = SAN.state.S;
    const npc = SAN.data.npcs[id];
    const f = R.get(id);
    if (!npc) return { pts: 0, reaction: 'neutral' };
    if (f.giftsToday >= 2) return { tooMany: true, pts: 0, reaction: 'neutral' };
    const item = SAN.data.item(itemId);
    let reaction = 'neutral', pts = 2;
    if ((npc.loves || []).includes(itemId)) { reaction = 'love'; pts = 9; }
    else if ((npc.likes || []).includes(itemId)) { reaction = 'like'; pts = 6; }
    else if ((npc.dislikes || []).includes(itemId)) { reaction = 'dislike'; pts = -1; }
    else if (item.cat === 'fish' || item.rarity === 'rare') { reaction = 'like'; pts = 5; }
    else if (item.cat === 'food') { reaction = 'like'; pts = 4; }
    else if (item.cat === 'flowers') { reaction = 'like'; pts = 4; }
    if (SAN.time.isFestival('flower_festival')) pts = Math.round(pts * 2);
    f.giftsToday++;
    f.giftCount = (f.giftCount || 0) + 1;
    R.add(id, pts);
    S.stats.giftsGiven++;
    SAN.quests.notify('gift', id, 1);
    return { reaction, pts, line: (npc.gift || {})[reaction] };
  };

  R.reactionLine = function (id, reaction) {
    const npc = SAN.data.npcs[id];
    if (!npc) return '';
    return (npc.gift || {})[reaction] || '';
  };

  R.metCount = function () {
    const S = SAN.state.S;
    return Object.keys(S.friendship).filter((k) => S.friendship[k].met).length;
  };

  R.allTiers = function () { return SAN.data.FRIEND_TIERS; };
})();
</script>
<script>
/* Sanctuary — quest system: chapters, objectives, rewards, board */
(function () {
  const Q = (SAN.quests = {});
  const D = SAN.data;

  Q.def = (id) => D.quests[id];

  Q.start = function (id, silent) {
    const S = SAN.state.S;
    const q = D.quests[id];
    if (!q || S.quests.active[id] || S.quests.completed[id]) return null;
    S.quests.active[id] = { id, progress: q.objectives.map(() => 0), startedDay: S.time.day, startedSeason: S.time.season, ready: false };
    if (!silent) {
      SAN.ui.toast('New quest — ' + q.title, 'quest');
      SAN.audio.sfx('open');
      SAN.state.log('Quest started: ' + q.title);
    }
    return S.quests.active[id];
  };

  Q.availableFor = function (npcId) {
    const S = SAN.state.S;
    const list = Object.values(D.quests);
    for (const q of list) {
      if (q.type === 'main' || q.type === 'story' || q.type === 'side') {
        if (q.giver !== npcId) continue;
        if (S.quests.active[q.id] || S.quests.completed[q.id]) continue;
        const prev = list.find((x) => x.next === q.id);
        if (prev && !S.quests.completed[prev.id]) continue;
        if (q.id === 'side_memory' && !S.unlocked.memory_vault) continue;
        if (q.id === 'side_cat' && !S.cat.adopted) continue;
        return q;
      }
    }
    return null;
  };

  Q.activeList = function () {
    const S = SAN.state.S;
    return Object.keys(S.quests.active).map((id) => ({ id, def: D.quests[id], state: S.quests.active[id] })).filter((x) => x.def);
  };

  Q.progressOf = function (id, idx) {
    const S = SAN.state.S;
    const q = D.quests[id];
    const st = S.quests.active[id];
    if (!q) return { cur: 0, need: 1, done: false, label: '' };
    const obj = q.objectives[idx];
    if (!obj) return { cur: 0, need: 1, done: true, label: '' };
    let cur = 0;
    if (obj.kind === 'collect') cur = SAN.state.count(obj.target);
    else if (st) cur = st.progress[idx] || 0;
    const need = obj.qty || 1;
    return { cur: Math.min(cur, need), need, done: cur >= need, label: obj.label || obj.target };
  };

  Q.isComplete = function (id) {
    const q = D.quests[id];
    if (!q) return false;
    return q.objectives.every((o, i) => Q.progressOf(id, i).done);
  };

  Q.refreshReady = function (id) {
    const S = SAN.state.S;
    const st = S.quests.active[id];
    if (!st) return false;
    const wasReady = st.ready;
    st.ready = Q.isComplete(id);
    if (st.ready && !wasReady) {
      SAN.ui.toast('Quest ready to turn in: ' + D.quests[id].title, 'quest');
      SAN.audio.sfx('sparkle');
      st.ready = true;
    }
    if (id.indexOf('board_') === 0) st.ready = Q.isComplete(id);
    return st.ready;
  };

  Q.notify = function (kind, target, amount, itemId) {
    const S = SAN.state.S;
    if (!S) return;
    const n = amount == null ? 1 : amount;
    Object.keys(S.quests.active).forEach((id) => {
      const q = D.quests[id];
      const st = S.quests.active[id];
      if (!q || !st) return;
      q.objectives.forEach((o, i) => {
        if ((st.progress[i] || 0) >= (o.qty || 1)) return;
        if (o.kind !== kind) return;
        const match = (o.target === 'any' || o.target === target) && (!o.item || o.item === itemId);
        if (!match) return;
        if (st.progress[i] == null) st.progress[i] = 0;
        st.progress[i] = Math.min(o.qty || 1, st.progress[i] + n);
      });
      Q.refreshReady(id);
    });
  };

  Q.setFlag = function (name, value) {
    const S = SAN.state.S;
    S.flags[name] = value == null ? true : value;
    Q.notify('flag', name, 1);
  };

  Q.turnIn = function (id, opts) {
    const S = SAN.state.S;
    const q = D.quests[id];
    const st = S.quests.active[id];
    if (!q || !st) return false;
    if (!Q.isComplete(id)) return false;
    delete S.quests.active[id];
    S.quests.completed[id] = { day: S.time.day, season: S.time.season, year: S.time.year };
    S.stats.questsDone++;
    const r = q.rewards || {};
    if (r.money) SAN.state.earn(r.money);
    if (r.items) r.items.forEach(([iid, qty]) => SAN.state.addItem(iid, qty, { silent: true }));
    if (r.friendship) Object.keys(r.friendship).forEach((npc) => SAN.rel.add(npc, r.friendship[npc]));
    if (r.xp) Object.keys(r.xp).forEach((k) => SAN.progression.addXp(k, r.xp[k]));
    else SAN.progression.addXp('exploration', 25);
    if (r.achievement) SAN.progression.unlock(r.achievement);
    if (r.unlock === 'memory_vault') {
      S.unlocked.memory_vault = true;
      SAN.ui.toast('The Memory Vault is open. The forest stones are listening.', 'unlock');
    }
    if (r.unlock === 'greenhouse_beds') {
      S.unlocked.greenhouse_beds = true;
      SAN.ui.toast('Elowen has given you a bed in the greenhouse.', 'unlock');
    }
    if (r.unlock === 'lighthouse_key') S.unlocked.lighthouse_key = true;
    if (r.recipe) {
      const cr = D.craftRecipes.find((x) => x.id === r.recipe);
      if (cr) SAN.state.addItem(cr.out, 1, { silent: true });
    }
    SAN.audio.sfx('achieve');
    SAN.state.log('Quest complete: ' + q.title);
    SAN.ui.toast('Quest complete — ' + q.title, 'quest');
    if (q.next) {
      setTimeout(() => {
        Q.start(q.next);
        const next = D.quests[q.next];
        if (next && SAN.ui) SAN.ui.toast('Next chapter — ' + next.title, 'story');
      }, 1400);
    }
    SAN.progression.checkAchievements();
    SAN.save.autosave(true);
    return true;
  };

  Q.readyTurnInsFor = function (npcId) {
    return Q.activeList().filter((x) => x.def.giver === npcId && Q.isComplete(x.id));
  };

  Q.refreshBoard = function () {
    const S = SAN.state.S;
    if (S.quests.boardDay === S.time.day && S.quests.board.length) return;
    S.quests.boardDay = S.time.day;
    const pool = D.boardQuests.slice();
    const picks = [];
    for (let i = 0; i < 3 && pool.length; i++) {
      const idx = Math.floor(Math.random() * pool.length);
      picks.push(pool.splice(idx, 1)[0]);
    }
    S.quests.board = picks.map((b) => ({ ...b, taken: false, done: false }));
  };

  Q.acceptBoard = function (idx) {
    const S = SAN.state.S;
    const b = S.quests.board[idx];
    if (!b || b.taken) return false;
    const id = 'board_' + b.id + '_' + S.time.day;
    const need = Object.keys(b.need)[0];
    const qty = b.need[need];
    D.quests[id] = {
      id, title: b.text.slice(0, 46) + (b.text.length > 46 ? '…' : ''), giver: 'board', type: 'daily',
      desc: b.text,
      objectives: [{ kind: 'collect', target: need, qty, label: 'Deliver ' + (D.item(need).name) + ' ×' + qty }],
      rewards: { money: b.money, items: b.items || [] },
    };
    b.taken = true;
    S.quests.board[idx] = b;
    Q.start(id);
    return true;
  };

  Q.boardReady = function () {
    const S = SAN.state.S;
    return Q.activeList().filter((x) => x.def.type === 'daily' && Q.isComplete(x.id));
  };

  Q.objectiveList = function (id) {
    const q = D.quests[id];
    if (!q) return [];
    return q.objectives.map((o, i) => Q.progressOf(id, i));
  };

  Q.currentStory = function () {
    const S = SAN.state.S;
    return Q.activeList().filter((x) => x.def.type === 'story');
  };

  Q.locationHint = function (q) {
    if (!q) return '';
    const giver = D.npcs[q.giver];
    if (q.id.indexOf('board_') === 0) return 'Village bulletin board';
    if (q.id.startsWith('lh_')) return 'The Lighthouse';
    if (q.id.startsWith('gh_')) return 'The Shared Greenhouse';
    if (q.id.startsWith('wm_')) return 'The Whispering Windmill';
    if (giver) return giver.homeArea ? SAN.world.areas[giver.homeArea].name : 'Sanctuary';
    return 'Sanctuary';
  };
})();
</script>
<script>
/* Sanctuary — the cat companion: follows, wanders, sleeps, finds little things */
(function () {
  const C = (SAN.cat = {});
  const U = SAN.util;

  C.sprite = null;
  C.timer = 6;
  C.discoverTimer = 70;
  C.purrTimer = 0;

  C.init = function () {
    const S = SAN.state.S;
    if (!S) return;
    C.sprite = {
      px: (S.cat.x || 8) * 16, py: (S.cat.y || 9) * 16,
      x: S.cat.x || 8, y: S.cat.y || 9,
      state: S.cat.state || 'follow', mood: S.cat.mood, timer: 4,
      colorHex: S.cat.colorHex, accessory: S.cat.accessory, target: null,
    };
  };

  C.syncFromState = function () {
    const S = SAN.state.S;
    if (!S.cat.adopted) { C.sprite = null; return; }
    C.init();
    C.placeNearPlayer();
  };

  C.placeNearPlayer = function () {
    const S = SAN.state.S;
    if (!C.sprite) C.init();
    if (!C.sprite) return;
    const W = SAN.world;
    const p = W.player;
    for (let r = 1; r < 6; r++) {
      for (const [dx, dy] of [[-r, 0], [r, 0], [0, r], [0, -r], [-r, -r], [r, r]]) {
        const tx = Math.floor(p.x) + dx, ty = Math.floor(p.y) + dy;
        if (!W.isSolid(tx, ty)) {
          C.sprite.px = (tx + 0.5) * 16; C.sprite.py = (ty + 0.5) * 16;
          C.sprite.x = tx + 0.5; C.sprite.y = ty + 0.5;
          return;
        }
      }
    }
  };

  C.update = function (dt) {
    const S = SAN.state.S;
    if (!S || !S.cat.adopted) { C.sprite = null; return; }
    if (!C.sprite) C.init();
    const W = SAN.world;
    if (!W.area || S.player.area !== W.cur) return;
    const s = C.sprite;
    const p = W.player;
    // stays close when the player leaves
    if (Math.hypot(p.px - s.px, p.py - s.py) > 260) { C.placeNearPlayer(); }

    // mood / hunger drift
    S.cat.hunger = U.clamp(S.cat.hunger - dt * 0.045, 0, 100);
    if (S.cat.hunger < 25) S.cat.mood = U.clamp(S.cat.mood - dt * 0.02, 0, 100);

    C.timer -= dt;
    if (C.timer <= 0) {
      C.timer = 4 + Math.random() * 8;
      const roll = Math.random();
      if (S.player.area === 'home' && roll < 0.3) s.state = 'sleep';
      else if (roll < 0.5) s.state = 'sit';
      else if (roll < 0.55) s.state = 'play';
      else s.state = 'follow';
      if (s.state === 'sleep') SAN.audio.sfx('purr');
    }

    if (s.state === 'follow') {
      const d = Math.hypot(p.px - s.px, p.py - s.py);
      if (d > 46) {
        const sp = 92 * dt;
        const nx = s.px + ((p.px - s.px) / d) * Math.min(sp, d - 30);
        const ny = s.py + ((p.py - s.py) / d) * Math.min(sp, d - 30);
        if (!W.isSolid(Math.floor(nx / 16), Math.floor(ny / 16))) { s.px = nx; s.py = ny; }
        else C.placeNearPlayer();
      }
      if (d > 500) C.placeNearPlayer();
    } else if (s.state === 'wander') {
      if (!s.target || Math.hypot(s.target.x - s.px, s.target.y - s.py) < 4) {
        const tx = Math.floor(s.px / 16) + Math.round((Math.random() - 0.5) * 4);
        const ty = Math.floor(s.py / 16) + Math.round((Math.random() - 0.5) * 4);
        if (!W.isSolid(tx, ty)) s.target = { x: tx * 16 + 8, y: ty * 16 + 8 };
        else s.target = null;
      } else {
        const dx = s.target.x - s.px, dy = s.target.y - s.py;
        const d = Math.hypot(dx, dy);
        s.px += (dx / d) * 26 * dt;
        s.py += (dy / d) * 26 * dt;
      }
    }
    if (s.state === 'sleep' || s.state === 'sit') {
      // remain near the player
      if (Math.hypot(p.px - s.px, p.py - s.py) > 70) { s.state = 'follow'; }
    }
    s.x = s.px / 16; s.y = s.py / 16;
    S.cat.x = s.x; S.cat.y = s.y;
    S.cat.state = s.state;
    S.cat.mood = U.clamp(S.cat.mood, 0, 100);

    // small discoveries
    if (S.cat.trust > 25 && W.area && W.area.region === 'outdoor') {
      C.discoverTimer -= dt;
      if (C.discoverTimer <= 0) {
        C.discoverTimer = 90 + Math.random() * 120;
        const finds = ['shell', 'fiber', 'berry', 'stone', 'daisy'];
        const item = U.pick(finds);
        SAN.state.addItem(item, 1);
        SAN.ui.toast(S.cat.name + ' trots over with something in their mouth: ' + SAN.data.item(item).name, 'cat', SAN.render.itemIcon(item));
        SAN.audio.sfx('purr');
        S.cat.trust = U.clamp(S.cat.trust + 1, 0, 100);
      }
    }
  };

  C.onPlayerWalk = function () {
    const S = SAN.state.S;
    if (!S || !S.cat.adopted || !C.sprite) return;
    if (C.sprite.state === 'sleep') return;
    if (S.cat.mood > 50 && C.sprite.state === 'follow') { /* trots along */ }
  };

  C.pet = function () {
    const S = SAN.state.S;
    if (!S.cat.adopted) return;
    S.stats.catPets++;
    S.cat.mood = U.clamp(S.cat.mood + 8, 0, 100);
    S.cat.trust = U.clamp(S.cat.trust + 2, 0, 100);
    if (C.sprite) C.sprite.state = 'sit';
    SAN.audio.sfx('purr');
    const lines = [
      S.cat.name + ' leans into your hand and closes their eyes.',
      S.cat.name + ' purrs like a small warm engine.',
      S.cat.name + ' rolls over. This is a tremendous honour.',
      S.cat.name + ' blinks slowly at you. In cat, that is a whole declaration.',
    ];
    SAN.ui.toast(U.pick(lines), 'cat');
    SAN.progression.checkAchievements();
    SAN.save.autosave();
  };

  C.feed = function () {
    const S = SAN.state.S;
    const foods = SAN.state.inventoryList().filter((e) => e.def.energy);
    if (!foods.length) { SAN.ui.toast('You have no food to share. The bakery is south of the square.', 'info'); return; }
    const choice = foods[0];
    SAN.state.removeItem(choice.id, 1);
    S.cat.hunger = U.clamp(S.cat.hunger + 34, 0, 100);
    S.cat.mood = U.clamp(S.cat.mood + 10, 0, 100);
    S.cat.trust = U.clamp(S.cat.trust + 3, 0, 100);
    SAN.ui.toast(S.cat.name + ' eats the ' + choice.def.name + ' with enormous seriousness. Trust +3.', 'cat', SAN.render.itemIcon(choice.id));
    SAN.audio.sfx('purr');
    SAN.save.autosave();
  };

  C.play = function () {
    const S = SAN.state.S;
    const hasToy = SAN.state.count('yarn_ball') > 0;
    S.cat.mood = U.clamp(S.cat.mood + (hasToy ? 16 : 6), 0, 100);
    S.cat.trust = U.clamp(S.cat.trust + (hasToy ? 3 : 1), 0, 100);
    if (C.sprite) C.sprite.state = 'play';
    SAN.audio.sfx('purr');
    SAN.ui.toast(hasToy
      ? 'You roll the yarn across the floor. ' + S.cat.name + ' is not dignified about it.'
      : 'You dangle a ribbon. ' + S.cat.name + ' watches it with the gravity of a scholar.', 'cat');
    SAN.save.autosave();
  };

  C.newDay = function () {
    const S = SAN.state.S;
    if (!S.cat.adopted) return;
    S.cat.hunger = U.clamp(S.cat.hunger + 22, 0, 100);
    S.cat.trust = U.clamp(S.cat.trust + 0.5, 0, 100);
    S.cat.state = 'follow';
    if (C.sprite) C.sprite.state = 'follow';
    // cat leaves a gift on the doorstep sometimes
    if (S.cat.trust > 40 && Math.random() < 0.45) {
      const gifts = ['shell', 'daisy', 'fiber', 'forget_me_not', 'pearl'];
      const g = U.pick(gifts);
      SAN.state.addItem(g, 1);
      SAN.ui.toast('A small gift on the doorstep, from ' + S.cat.name + ': ' + SAN.data.item(g).name, 'cat', SAN.render.itemIcon(g));
    }
  };

  C.hungerLabel = function () {
    const S = SAN.state.S;
    if (!S.cat.adopted) return '';
    if (S.cat.hunger > 70) return 'content';
    if (S.cat.hunger > 40) return 'peckish';
    if (S.cat.hunger > 18) return 'hungry';
    return 'starving';
  };
})();
</script>
<script>
/* Sanctuary — living world: village routines, overheard conversations, random
   events, secrets, branching moments and small optional activities. */
(function () {
  const L = (SAN.living = {});
  const D = SAN.data;
  const U = SAN.util;
  const S = () => SAN.state.S;

  let eventTimer = 16;
  let chatterTimer = 5;

  /* =========================================================
     DISCOVERIES
     ========================================================= */
  L.discover = function (id, silent) {
    const S_ = S();
    const sec = D.secrets[id];
    if (!S_ || !sec) return false;
    if (!S_.discoveries) S_.discoveries = {};
    if (S_.discoveries[id]) return false;
    S_.discoveries[id] = { day: S_.time.day, season: S_.time.season, year: S_.time.year };
    if (!silent) {
      SAN.ui.toast('Discovered — ' + sec.name, 'discover');
      SAN.audio.sfx('sparkle');
    }
    SAN.progression.addXp('exploration', 16);
    SAN.state.log('Discovered: ' + sec.name);
    SAN.save.autosave();
    return true;
  };
  L.discoveryCount = function () {
    const S_ = S();
    return S_ && S_.discoveries ? Object.keys(S_.discoveries).length : 0;
  };

  /* =========================================================
     FRIENDSHIP MILESTONES
     ========================================================= */
  L.pendingMilestone = function (npcId) {
    const S_ = S();
    const life = D.npcLife[npcId];
    if (!S_ || !life || !life.milestones) return null;
    const pts = SAN.rel.pts(npcId);
    for (const t of [21, 41, 61, 81]) {
      if (pts >= t && !S_.dialogueSeen['ms_' + npcId + '_' + t] && life.milestones[t]) {
        return { tier: t, scene: life.milestones[t] };
      }
    }
    return null;
  };

  L.playMilestone = function (npcId, ms) {
    const S_ = S();
    if (!S_ || !ms) return;
    S_.dialogueSeen['ms_' + npcId + '_' + ms.tier] = true;
    const npc = D.npcs[npcId];
    const pages = [{ speaker: 'narrator', text: ms.scene.title }].concat(ms.scene.pages);
    SAN.ui.dialogue({ pages });
    SAN.rel.add(npcId, 3, true);
    SAN.state.log('A moment with ' + (npc ? npc.name : npcId) + ': ' + ms.scene.title);
    SAN.progression.checkAchievements();
    SAN.save.autosave(true);
  };

  /* =========================================================
     GREETING EXTRAS — time, weather, remembered kindnesses
     ========================================================= */
  L.phaseKey = function () {
    const S_ = S();
    if (!S_) return 'afternoon';
    const mins = S_.time.minutes;
    if (mins >= 6 * 60 && mins < 12 * 60) return 'morning';
    if (mins < 17 * 60) return 'afternoon';
    if (mins < 21 * 60) return 'evening';
    return 'night';
  };

  L.extras = function (id) {
    const S_ = S();
    const life = D.npcLife[id];
    const out = [];
    if (!S_ || !life) return out;
    const w = S_.time.weather;
    if (life.weatherLines && life.weatherLines[w] && Math.random() < 0.7) out.push(life.weatherLines[w]);
    else if (life.timeLines && life.timeLines[L.phaseKey()] && Math.random() < 0.55) out.push(life.timeLines[L.phaseKey()]);
    if (!S_.world) return out;
    const gift = S_.world.gifts && S_.world.gifts[id];
    if (gift && S_.world.giftDay[id] !== S_.time.day && Math.random() < 0.4) {
      S_.world.giftDay[id] = S_.time.day;
      const item = D.item(gift);
      out.push('"The ' + item.name.toLowerCase() + ' you gave me is still on the shelf. I look at it more than I admit."');
    }
    const done = Object.keys(S_.quests.completed).filter((qid) => D.quests[qid] && D.quests[qid].giver === id);
    if (done.length && S_.world.favorDay[id] !== S_.time.day) {
      S_.world.favorDay[id] = S_.time.day;
      const ch = {
        liora: '"You came back. You keep coming back. I am starting to believe it is a habit and not a favour."',
        elowen: '"The beds you helped with are still growing. I keep expecting you to want something for it. You never do."',
        rowan: '"I used the thing you said. The reframe. It worked for about an hour, which is a record."',
        mira: '"You are the only person who has ever asked me how I am and waited for the answer."',
        finn: '"You still have not asked me for a fishing secret. It is unsettling. In a nice way."',
        aria: '"I added a line about you. It is not a fact, strictly. It is a good line."',
        celeste: '"The lighthouse flowers are still going. You never asked who they were for."',
        theo: '"I owe you one. I do not say that to people. I am saying it to you."',
        nyssa: '"The village is doing well. You keep showing up for it. That is the whole job, you know."',
      }[id] || '"You helped me. I remember that."';
      out.push(ch);
    }
    return out;
  };

  /* =========================================================
     SMALL ACTIVITIES
     ========================================================= */
  L.activity = function (key) {
    const S_ = S();
    if (!S_ || !S_.world) return false;
    const k = key + '_' + S_.time.day;
    if (S_.world.activities[k]) return false;
    S_.world.activities[k] = true;
    return true;
  };

  /* =========================================================
     RUNE PUZZLE & THE HIDDEN GROVE
     ========================================================= */
  L.RUNE_ORDER = ['moth', 'wave', 'leaf'];

  L.rune = function (symbol) {
    const S_ = S();
    if (!S_) return;
    if (S_.world.groveOpen) {
      SAN.ui.dialogue({ pages: [{ speaker: 'narrator', text: 'The rune is warm and quiet. The forest is still holding the path open for you.' }] });
      return;
    }
    if (!Array.isArray(S_.world.runes)) S_.world.runes = [];
    S_.world.runes.push(symbol);
    const ok = S_.world.runes.every((v, i) => L.RUNE_ORDER[i] === v);
    if (!ok) {
      S_.world.runes = [];
      SAN.audio.sfx('close');
      SAN.ui.dialogue({
        pages: [
          { speaker: 'narrator', text: 'The rune dims, and something in the forest settles back to sleep.' },
          { speaker: 'narrator', text: 'Three stones. An order. You should look at the old wall again.' },
        ],
      });
      return;
    }
    if (S_.world.runes.length === L.RUNE_ORDER.length) {
      S_.world.groveOpen = true;
      SAN.audio.sfx('achieve');
      L.discover('rune_puzzle');
      L.discover('grove_open');
      SAN.ui.dialogue({
        pages: [
          { speaker: 'narrator', text: 'The three runes glow at once, and the vines between the trees draw back like a held breath.' },
          { speaker: 'narrator', text: 'A path opens to the north-west. It smells of rain and old flowers.' },
        ],
      });
      SAN.save.autosave(true);
      return;
    }
    SAN.audio.sfx('sparkle');
    SAN.ui.dialogue({ pages: [{ speaker: 'narrator', text: 'The rune glows. Somewhere behind the trees, something shifts and waits for the next word.' }] });
  };

  L.groveGate = function (fromArea) {
    const S_ = S();
    if (!S_.world.groveOpen) {
      SAN.ui.dialogue({
        pages: [
          { speaker: 'narrator', text: 'Vines grow across the path in a deliberate, patient way. Three stones stand along the forest trail, each carved with a shape.' },
          { speaker: 'narrator', text: 'The old wall near the ruin might say more. It usually does.' },
        ],
      });
      return;
    }
    SAN.ui.fadeTo(function () { SAN.world.load('grove', 13, 17); }, 280);
  };

  L.onEnter = function (areaId) {
    const S_ = S();
    if (!S_) return;
    if (areaId === 'grove') L.discover('grove_open');
  };

  /* =========================================================
     WORLD EVENTS
     ========================================================= */
  const EVENTS = [];
  function event(def) { EVENTS.push(def); }

  /* --- a very small wet cat --- */
  event({
    id: 'lost_kitten', area: 'village', phases: ['morning', 'afternoon'], once: true, minDay: 2, chance: 0.5,
    run: function () {
      SAN.audio.sfx('purr');
      SAN.ui.dialogue({
        pages: [
          { speaker: 'narrator', text: 'A very small kitten is sitting in the middle of the path, soaked through and furious about it.' },
          { speaker: 'narrator', text: 'It looks at you the way cats look at weather: personally offended, and willing to negotiate.' },
        ],
        choices: [
          {
            label: 'Sit down and wait for it to calm',
            cb: function () {
              SAN.living.discover('lost_kitten');
              SAN.progression.addXp('exploration', 10);
              SAN.ui.dialogue({
                pages: [
                  { speaker: 'narrator', text: 'You sit on the wet stones and do nothing at all. After a while the kitten climbs into your lap, as if it was your idea.' },
                  { speaker: 'narrator', text: 'When it is warm and dry it walks off without a backward glance. You feel absurdly honoured.' },
                ],
              });
              SAN.save.autosave();
            },
          },
          {
            label: 'Carry it to the bakery door',
            cb: function () {
              SAN.living.discover('lost_kitten');
              SAN.rel.add('mira', 5);
              SAN.state.addItem('yarn_ball', 1);
              SAN.ui.dialogue({
                pages: [
                  { speaker: 'narrator', text: 'You tuck the kitten inside your coat and leave it by the warm bakery door with a saucer of milk.' },
                  { speaker: 'narrator', text: 'Later, Mira will tell you a cat has moved into the bakery and has opinions about the bread schedule.' },
                ],
              });
              SAN.save.autosave();
            },
          },
        ],
      });
    },
  });

  /* --- someone at the pond --- */
  event({
    id: 'pond_crying', area: 'garden', phases: ['evening'], once: true, minDay: 3, chance: 0.6,
    check: function () { return !!SAN.world.npcById('elowen'); },
    run: function () {
      const npc = SAN.world.npcById('elowen');
      if (!npc) return;
      SAN.ui.dialogue({
        pages: [
          { speaker: 'narrator', text: 'Elowen is sitting on the bench by the pond with her hands in her lap. She is crying, very quietly, the way people do when they have practised not making noise.' },
          { speaker: 'elowen', text: '"Oh. Hello." She wipes her face with her sleeve. "It is the soil. It is not — it is fine."' },
        ],
        choices: [
          {
            label: 'Sit down beside her and say nothing',
            cb: function () {
              SAN.rel.add('elowen', 7);
              SAN.quests.setFlag('sat_with_elowen', true);
              SAN.audio.sfx('sparkle');
              SAN.ui.dialogue({
                pages: [
                  { speaker: 'narrator', text: 'You sit. The frogs keep arguing. After a long time her breathing evens out.' },
                  { speaker: 'elowen', text: '"You did not ask me what was wrong." She sounds almost surprised. "Thank you."' },
                ],
              });
              SAN.save.autosave(true);
            },
          },
          {
            label: 'Ask if she wants to talk about it',
            cb: function () {
              SAN.rel.add('elowen', 4);
              SAN.ui.dialogue({
                pages: [
                  { speaker: 'elowen', text: '"Not really. But I like that you asked instead of deciding for me."' },
                  { speaker: 'narrator', text: 'She stays a while longer. So do you.' },
                ],
              });
              SAN.save.autosave();
            },
          },
          {
            label: 'Give her space',
            cb: function () {
              SAN.rel.add('elowen', 2);
              SAN.ui.dialogue({
                pages: [{ speaker: 'narrator', text: 'You leave quietly. There is no penalty for not being needed. She knows where to find you.' }],
              });
            },
          },
        ],
      });
    },
  });

  /* --- a letter on the tide line --- */
  event({
    id: 'beach_letter', area: 'beach', phases: ['morning', 'afternoon'], once: true, minDay: 2, chance: 0.55,
    run: function () {
      SAN.state.addItem('letter_old', 1);
      SAN.living.discover('letter_beach');
      SAN.ui.dialogue({
        pages: [
          { speaker: 'narrator', text: 'Something pale is caught in the wrack. A sealed letter in a waxed envelope, addressed only: "The lighthouse. For whoever is there."' },
          { speaker: 'narrator', text: 'The ink has bled at the edges. It is not yours to open. It is yours to carry.' },
        ],
      });
      SAN.save.autosave(true);
    },
  });

  /* --- the visitor --- */
  event({
    id: 'mysterious_visitor', area: 'village', phases: ['evening'], once: true, minDay: 4, chance: 0.5,
    run: function () {
      SAN.ui.dialogue({
        pages: [
          { speaker: 'narrator', text: 'A traveller in a grey cloak has set a crate on the edge of the square. They do not look like they are selling anything.' },
          { speaker: 'narrator', text: '"I heard there is a gardener here," they say, "who can keep a starflower alive through a bad winter."' },
          { speaker: 'narrator', text: 'They hold up a paper packet: a single seed, very old, very carefully kept.' },
        ],
        choices: [
          {
            label: 'Trade a bramble rose for it',
            cb: function () {
              if (!SAN.state.count('wild_rose')) {
                SAN.ui.toast('You do not have a bramble rose.', 'info');
                return;
              }
              SAN.state.removeItem('wild_rose', 1);
              SAN.state.addItem('seed_starflower', 1);
              SAN.ui.dialogue({ pages: [{ speaker: 'narrator', text: 'They wrap the seed in a square of cloth and hand it over with both hands. "It likes being spoken to. Do not tell anyone I said that."' }] });
              SAN.save.autosave(true);
            },
          },
          {
            label: 'Buy it for 120 coins',
            cb: function () {
              if (!SAN.state.spend(120)) { SAN.ui.toast('You do not have enough coins.', 'warn'); return; }
              SAN.state.addItem('seed_starflower', 1);
              SAN.ui.dialogue({ pages: [{ speaker: 'narrator', text: 'They count the coins without looking at them. "It likes being spoken to," they say. "That is all the advice I have."' }] });
              SAN.save.autosave(true);
            },
          },
          { label: 'Say no, and let them rest a while', cb: function () {
              SAN.rel.add('nyssa', 1);
              SAN.ui.dialogue({ pages: [{ speaker: 'narrator', text: 'They nod, unsurprised, and sit on the fountain rim with you for a while. In the morning the crate is gone, but the square smells of rain and old flowers.' }] });
            } },
        ],
      });
    },
  });

  /* --- something blooming out of season --- */
  event({
    id: 'sudden_bloom', area: 'garden', phases: ['morning', 'afternoon'], once: true, minDay: 3, chance: 0.45,
    run: function () {
      SAN.state.addItem('starflower', 1);
      SAN.state.addItem('glow_moss', 1);
      SAN.living.discover('sudden_bloom');
      SAN.audio.sfx('sparkle');
      SAN.ui.dialogue({
        pages: [
          { speaker: 'narrator', text: 'At the edge of the beds, where nobody planted anything, a starflower has opened in the wrong season.' },
          { speaker: 'narrator', text: 'It is not supposed to be here. It is doing it anyway. You take one bloom and leave the rest.' },
        ],
      });
      SAN.save.autosave();
    },
  });

  /* --- a small request --- */
  event({
    id: 'village_favour', area: 'village', phases: ['morning', 'afternoon', 'evening'], cooldownDays: 3, minDay: 3, chance: 0.5,
    check: function () { return SAN.state.count('fiber') >= 3; },
    run: function () {
      const present = SAN.world.npcs.filter((n) => n.def.id !== 'nyssa');
      const npc = present.length ? U.pick(present) : null;
      const name = npc ? npc.def.name : 'Someone';
      SAN.ui.dialogue({
        pages: [
          { speaker: npc ? npc.def.id : 'narrator', text: '"Oh — good, you are here. I need three bundles of soft fibre for the winter repair list, and I keep forgetting to ask."' },
          { speaker: 'narrator', text: 'They say it lightly. Asking is the hard part, for some people.' },
        ],
        choices: [
          { label: 'Hand over three fibre', cb: function () {
              if (!SAN.state.count('fiber') >= 3) return;
              SAN.state.removeItem('fiber', 3);
              SAN.state.earn(90);
              if (npc) SAN.rel.add(npc.def.id, 6);
              SAN.ui.dialogue({ pages: [{ speaker: npc ? npc.def.id : 'narrator', text: '"You did not make it into a whole thing. I appreciate that more than the fibre."' }] });
              SAN.save.autosave(true);
            } },
          { label: 'Ask what it is for', cb: function () {
              SAN.ui.dialogue({ pages: [{ speaker: npc ? npc.def.id : 'narrator', text: '"The shelter roof. The one behind the store. It leaks on the crates." A pause. "I have been meaning to ask someone for a month."' }] });
            } },
        ],
      });
    },
  });

  /* --- a cache under the roots --- */
  event({
    id: 'forest_cache', area: 'forest', phases: ['morning', 'afternoon', 'evening', 'night'], cooldownDays: 4, minDay: 2, chance: 0.5,
    run: function () {
      const loot = U.pick([['sea_glass', 2], ['pearl', 1], ['glow_moss', 2], ['stone', 3]]);
      SAN.state.addItem(loot[0], loot[1]);
      SAN.living.discover('secret_cache');
      SAN.ui.dialogue({
        pages: [
          { speaker: 'narrator', text: 'Your boot knocks something hollow under the roots. A tin, rusted at the seams, wrapped in oilcloth.' },
          { speaker: 'narrator', text: 'Inside: ' + loot[1] + ' ' + D.item(loot[0]).name.toLowerCase() + ', and a note that says "I was here. That is enough."' },
        ],
      });
      SAN.save.autosave(true);
    },
  });

  /* --- the weather turns --- */
  event({
    id: 'sudden_storm', area: null, outdoor: true, phases: ['afternoon', 'evening'], cooldownDays: 5, minDay: 3, chance: 0.4,
    check: function (S_) { return S_.time.weather === 'sunny' || S_.time.weather === 'cloudy'; },
    run: function () {
      const S_ = S();
      S_.time.weather = 'storm';
      SAN.audio.ambient('storm');
      SAN.ui.toast('The sky turns over. Rain arrives all at once.', 'info');
      SAN.ui.dialogue({
        pages: [
          { speaker: 'narrator', text: 'The light goes green-grey, the wind picks up, and the whole village starts moving toward doors at the same time.' },
          { speaker: 'narrator', text: 'You are soaked through in nine seconds. It is somehow wonderful.' },
        ],
      });
      S_.energy = Math.max(0, S_.energy - 3);
      SAN.save.autosave(true);
    },
  });

  /* --- lantern night --- */
  event({
    id: 'lantern_night', area: 'village', phases: ['night'], once: true, minDay: 5, chance: 0.6,
    run: function () {
      const S_ = S();
      S_.world.lanternNight = true;
      S_.world.lanternDay = S_.time.day;
      SAN.audio.sfx('bell');
      SAN.ui.dialogue({
        pages: [
          { speaker: 'narrator', text: 'The square is full of lanterns. Nobody announced this. Somebody simply started, and everyone else brought a light.' },
          { speaker: 'narrator', text: 'Mira is handing out something warm. Liora has come down from the lighthouse without being asked. Rowan is standing in the middle of it, not analysing anything.' },
          { speaker: 'narrator', text: 'Nobody asks you to do anything. You are allowed to just be here.' },
        ],
      });
      D.npcOrder.forEach((id) => { if (S_.friendship[id]) SAN.rel.add(id, 2); });
      SAN.progression.addXp('exploration', 12);
      SAN.living.discover('lantern_night');
      SAN.save.autosave(true);
    },
  });

  /* =========================================================
     EVENT SCHEDULER
     ========================================================= */
  function currentPhase() { return L.phaseKey(); }

  L.attemptEvent = function (force) {
    const S_ = S();
    const W = SAN.world;
    if (!S_ || !W.cur || !S_.started) return false;
    if (!S_.world) return false;
    if (S_.world.eventDay !== S_.time.day) { S_.world.eventDay = S_.time.day; S_.world.eventsToday = 0; }
    if (!force && S_.world.eventsToday >= 2) return false;
    const area = W.area;
    const phase = currentPhase();
    const pool = EVENTS.filter((ev) => {
      if (ev.area && ev.area !== W.cur) return false;
      if (ev.outdoor && area && (area.region === 'indoor')) return false;
      if (ev.phases && ev.phases.indexOf(phase) < 0) return false;
      if (ev.minDay && S_.time.day < ev.minDay) return false;
      const seen = S_.world.seen[ev.id];
      if (ev.once && seen) return false;
      if (ev.cooldownDays && seen && S_.time.day - seen.day < ev.cooldownDays) return false;
      if (ev.check && !ev.check(S_)) return false;
      return true;
    });
    if (!pool.length) return false;
    const ev = U.pick(pool);
    if (!force && Math.random() > (ev.chance == null ? 0.55 : ev.chance)) return false;
    S_.world.seen[ev.id] = { day: S_.time.day, season: S_.time.season };
    S_.world.eventsToday = (S_.world.eventsToday || 0) + 1;
    S_.world.lastEventMinute = S_.time.minutes;
    ev.run(S_);
    return true;
  };

  /* =========================================================
     NPC OVERHEARD CONVERSATIONS
     ========================================================= */
  const GENERIC_CHATTER = [
    '"Cold for the season." / "Mm. Good for the soil."',
    '"Did you see the light this morning?" / "I slept through it. Deliberately."',
    '"The bread is good today." / "The bread is good every day. Say something else."',
    '"Any luck with the nets?" / "Define luck."',
    '"You look tired." / "I am awake. That is the whole claim."',
    '"I am going to sit down for a minute." / "You said that an hour ago. Sit down anyway."',
    '"Did you water the bluebells?" / "The sky did. I supervised."',
    '"I keep meaning to ask you something." / "Ask me later. Ask me later is my favourite conversation."',
    '"The wind is doing that thing again." / "It is a windmill. It does the thing."',
  ];

  function tickChatter(dt) {
    const S_ = S();
    const W = SAN.world;
    if (!S_ || !W.cur) return;
    W.npcs.forEach((n) => { if (n.bubble) n.bubble.t -= dt; });
    chatterTimer -= dt;
    if (chatterTimer > 0) return;
    chatterTimer = 2.4 + Math.random() * 3.6;
    if (W.npcs.length < 2) return;
    for (let i = 0; i < W.npcs.length; i++) {
      for (let j = i + 1; j < W.npcs.length; j++) {
        const a = W.npcs[i], b = W.npcs[j];
        if (a.bubble || b.bubble) continue;
        if (Math.hypot(a.px - b.px, a.py - b.py) > 56) continue;
        const convo = D.chatter.find((c) => (c.a === a.def.id && c.b === b.def.id) || (c.a === b.def.id && c.b === a.def.id));
        const line = convo ? U.pick(convo.lines) : U.pick(GENERIC_CHATTER);
        if (!line) continue;
        const parts = line.split(' / ');
        const saidA = parts[0].replace(/^"|"$/g, '');
        const saidB = (parts[1] || '…').replace(/^"|"$/g, '');
        a.bubble = { text: saidA, t: 4.6, self: true };
        b.bubble = { text: saidB, t: 4.6, self: false };
        a.facing = b.px < a.px ? 'left' : 'right';
        b.facing = a.px < b.px ? 'left' : 'right';
        a.chatting = b.chatting = true;
        a.huddle = b.huddle = false;
        a.chatTimer = b.chatTimer = 4.6;
        return;
      }
    }
    // nobody close enough to talk: bring the nearest pair together
    let best = null;
    for (let i = 0; i < W.npcs.length; i++) {
      for (let j = i + 1; j < W.npcs.length; j++) {
        const a = W.npcs[i], b = W.npcs[j];
        if (a.pose === 'sit' || b.pose === 'sit' || a.chatTimer > 0 || b.chatTimer > 0) continue;
        const d = Math.hypot(a.px - b.px, a.py - b.py);
        if (d > 230 || d < 12) continue;
        if (!best || d < best.d) best = { a, b, d };
      }
    }
    if (!best || Math.random() > 0.75) return;
    const a = best.a, b = best.b;
    const ax = a.px / 16, ay = a.py / 16, bx = b.px / 16, by = b.py / 16;
    const nearA = { x: ax + (bx - ax) * 0.38, y: ay + (by - ay) * 0.38 };
    const nearB = { x: bx + (ax - bx) * 0.38, y: by + (ay - by) * 0.38 };
    if (!SAN.world.isSolid(Math.floor(nearA.x), Math.floor(nearA.y))) { a.target = nearA; a.pose = 'hurry'; a.huddle = true; }
    if (!SAN.world.isSolid(Math.floor(nearB.x), Math.floor(nearB.y))) { b.target = nearB; b.pose = 'hurry'; b.huddle = true; }
  }

  /* =========================================================
     UPDATE
     ========================================================= */
  L.update = function (dt) {
    const S_ = S();
    if (!S_ || !S_.started) return;
    tickChatter(dt);

    if (S_.world.eventDay !== S_.time.day) { S_.world.eventDay = S_.time.day; S_.world.eventsToday = 0; }
    if (S_.world.eventsToday >= 2) return;
    if (S_.world.lastEventMinute != null && S_.time.minutes - S_.world.lastEventMinute < 70) return;
    eventTimer -= dt;
    if (eventTimer > 0) return;
    eventTimer = 18 + Math.random() * 12;
    if (S_.stats.daysPlayed < 2) return;
    L.attemptEvent(false);
  };

  /* Debug/testing hook */
  L.events = EVENTS;
})();
</script>
<script>
/* Sanctuary — camera, photo mode, album and photo challenges. */
(function () {
  const P = (SAN.photos = {});
  const S = () => SAN.state.S;
  P.MAX = 18;
  P.mode = false;
  let el = null;
  let lastCapture = null;

  P.available = function () { return !!(S() && S().started && S().world && S().world.hasCamera !== false); };

  function frameRect() {
    const W = SAN.world;
    return { x: W.cam.x + 16, y: W.cam.y + 12, w: 448, h: 252 };
  }
  function contains(fr, px, py) {
    return px >= fr.x && px <= fr.x + fr.w && py >= fr.y && py <= fr.y + fr.h;
  }

  /* ---------------- challenges ---------------- */
  P.challengeList = function () {
    const S_ = S();
    return (SAN.data.photoChallenges || []).map((c) => Object.assign({}, c, { done: !!(S_ && S_.world.photoChallenges[c.id]) }));
  };

  P.evaluateChallenges = function () {
    const S_ = S();
    const W = SAN.world;
    if (!S_ || !W.area) return [];
    const out = [];
    const mins = S_.time.minutes;
    const area = W.cur;
    const fr = frameRect();
    if (area === 'village') {
      const hx = 14.5 * 16, hy = 13 * 16;
      if (Math.abs(W.player.px - hx) < 260 && Math.abs(W.player.py - hy) < 240) out.push('ph_home');
    }
    if ((area === 'beach' || area === 'lighthouse') && mins >= 17 * 60 && mins <= 20 * 60 + 30) out.push('ph_lighthouse');
    if (SAN.cat.sprite && contains(fr, SAN.cat.sprite.px, SAN.cat.sprite.py) && SAN.cat.sprite.state === 'sleep') out.push('ph_cat');
    if (W.npcs.filter((n) => contains(fr, n.px, n.py)).length >= 3) out.push('ph_life');
    if (S_.time.weather === 'rain' || S_.time.weather === 'storm') out.push('ph_rain');
    if (area === 'meadow' && (mins >= 21 * 60 || mins < 5 * 60)) out.push('ph_night');
    if (area === 'grove') out.push('ph_grove');
    if (S_.time.festivalToday || (S_.world.lanternNight && S_.world.lanternDay === S_.time.day)) out.push('ph_festival');
    return out;
  };

  /* ---------------- photo mode ---------------- */
  P.open = function () {
    const S_ = S();
    if (!S_ || !S_.started || P.mode) return;
    P.mode = true;
    if (SAN.ui.dialogueState) SAN.ui.closeDialogue();
    el = document.createElement('div');
    el.id = 'photo-mode';
    el.innerHTML = `
      <div class="photo-frame">
        <span class="pfc tl"></span><span class="pfc tr"></span><span class="pfc bl"></span><span class="pfc br"></span>
        <div class="photo-top">
          <span class="photo-brand">SANCTUARY CAMERA</span>
          <span class="photo-meta" id="photo-meta"></span>
        </div>
        <div class="photo-bottom">
          <input id="photo-caption" class="photo-caption" maxlength="60" placeholder="a small caption (optional)">
          <div class="photo-actions">
            <button class="btn btn-ghost" id="photo-close">Exit</button>
            <button class="btn btn-primary" id="photo-shoot">Take photo</button>
          </div>
        </div>
        <div class="photo-flash" id="photo-flash"></div>
      </div>`;
    document.getElementById('ui-root').appendChild(el);
    const meta = document.getElementById('photo-meta');
    if (meta) meta.textContent = SAN.util.SEASONS[S_.time.season] + ' ' + S_.time.day + ' · ' + SAN.time.clockLabel() + ' · ' + SAN.world.area.name;
    el.querySelector('#photo-close').addEventListener('click', () => P.close());
    el.querySelector('#photo-shoot').addEventListener('click', () => P.capture());
    SAN.audio.sfx('open');
  };

  P.close = function () {
    P.mode = false;
    if (el) { el.remove(); el = null; }
  };

  P.capture = function () {
    const S_ = S();
    const W = SAN.world;
    if (!S_ || !W.area) return null;
    const src = document.getElementById('game');
    if (!src) return null;
    const out = document.createElement('canvas');
    out.width = 336; out.height = 189;
    const ctx = out.getContext('2d');
    try { ctx.drawImage(src, 16, 12, 448, 252, 0, 0, 336, 189); } catch (e) { return null; }
    const data = out.toDataURL('image/jpeg', 0.55);
    const captionEl = document.getElementById('photo-caption');
    const photo = {
      id: 'p' + Date.now() + Math.floor(Math.random() * 999),
      data,
      area: W.cur,
      areaName: W.area.name,
      season: S_.time.season,
      day: S_.time.day,
      year: S_.time.year,
      minutes: Math.round(S_.time.minutes),
      weather: S_.time.weather,
      caption: captionEl ? captionEl.value.trim().slice(0, 60) : '',
      at: Date.now(),
    };
    S_.photos.unshift(photo);
    while (S_.photos.length > P.MAX) S_.photos.pop();

    const done = P.evaluateChallenges();
    let reward = 0;
    const names = [];
    done.forEach((id) => {
      if (S_.world.photoChallenges[id]) return;
      S_.world.photoChallenges[id] = true;
      const ch = (SAN.data.photoChallenges || []).find((c) => c.id === id);
      if (ch) { reward += ch.reward; names.push(ch.name); }
    });
    if (reward) SAN.state.earn(reward);

    const flash = document.getElementById('photo-flash');
    if (flash) {
      flash.classList.add('on');
      setTimeout(() => flash.classList.remove('on'), 220);
    }
    SAN.audio.sfx('catch');
    if (names.length) {
      SAN.ui.toast('Photo challenge — ' + names.join(', ') + (reward ? ' (+' + reward + ' coins)' : ''), 'achievement');
    } else {
      SAN.ui.toast('Photograph saved to your album.', 'info');
    }
    lastCapture = { photo, done, reward, names };
    SAN.save.autosave(true);
    return lastCapture;
  };

  P.last = function () { return lastCapture; };

  /* album helpers */
  P.remove = function (id) {
    const S_ = S();
    if (!S_) return;
    S_.photos = S_.photos.filter((p) => p.id !== id);
    SAN.save.autosave(true);
  };
  P.setCaption = function (id, caption) {
    const S_ = S();
    const p = S_ && S_.photos.find((x) => x.id === id);
    if (!p) return;
    p.caption = (caption || '').slice(0, 60);
    SAN.save.autosave();
  };
  P.timeLabel = function (p) {
    return SAN.util.SEASONS[p.season] + ' ' + p.day + ', Year ' + p.year + ' · ' + SAN.util.fmtTime(p.minutes);
  };
})();
</script>
<script>
/* Sanctuary — interaction dispatch and all dialogue/scene scripting */
(function () {
  const A = (SAN.actions = {});
  const U = SAN.util;

  const S = () => SAN.state.S;

  /* =========================================================
     WORLD TRANSITIONS
     ========================================================= */
  A.transition = function (ex) {
    if (ex.locked && SAN.world.locked(ex.locked)) {
      SAN.ui.toast('The path is hidden. Something must change first.', 'info');
      return;
    }
    SAN.ui.fadeTo(function () {
      SAN.world.load(ex.to, ex.tx, ex.ty);
      SAN.cat.placeNearPlayer();
    }, 260);
  };

  A.enterArea = function (id, tx, ty) {
    SAN.ui.fadeTo(function () {
      SAN.world.load(id, tx, ty);
      SAN.cat.placeNearPlayer();
    }, 260);
  };

  /* =========================================================
     INTERACTION ENTRY
     ========================================================= */
  A.interact = function () {
    const S_ = S();
    if (!S_) return;
    const h = SAN.world.hint;
    if (!h) return;
    if (h.kind === 'npc') { A.talkTo(h.npc); return; }
    if (h.kind === 'cat') { SAN.cat.pet(); return; }
    if (h.kind === 'water') { A.fish(); return; }
    if (h.kind === 'plot') { A.plotAction(h.plot); return; }
    if (h.kind === 'prop') { A.prop(h.prop); return; }
  };

  A.fish = function () {
    const S_ = S();
    if (S_.player.energy <= 0) { SAN.ui.toast('You are too tired to hold a rod steady.', 'warn'); return; }
    SAN.fishing.start();
  };

  A.plotAction = function (plot) {
    const S_ = S();
    const st = SAN.farming.stateAt(plot);
    if (!st || !st.tilled) { SAN.farming.till(plot); return; }
    if (!st.crop) { SAN.ui.openPanel('seeds', { plot }); return; }
    const crop = SAN.data.crops[st.crop];
    if (st.stage >= crop.days) { SAN.farming.harvest(plot); return; }
    if (!st.watered) { SAN.farming.water(plot); return; }
    SAN.ui.toast('The ' + crop.name + ' is ' + SAN.farming.describe(plot) + '.', 'info');
  };

  A.prop = function (p) {
    const it = p.interact || {};
    const S_ = S();
    if (SAN.world.cur === 'home' && !S_.flags.looked_around) {
      SAN.quests.setFlag('looked_around', true);
    }
    switch (it.type) {
      case 'area':
        if (it.to === 'meadow' && !S().unlocked.meadow) { SAN.ui.toast('The path north is overgrown. The forest is not ready to share it.', 'info'); return; }
        A.enterArea(it.to, it.tx, it.ty); return;
      case 'shop': SAN.ui.openPanel('shop', { shopId: it.shop }); return;
      case 'board': SAN.ui.openPanel('board'); return;
      case 'sleep': A.sleepConfirm(); return;
      case 'journal': SAN.ui.openPanel('journal'); return;
      case 'customize': SAN.ui.openPanel('customize', { mode: 'wardrobe' }); return;
      case 'collection': SAN.ui.openPanel('collection'); return;
      case 'cook': SAN.ui.openPanel('cook'); return;
      case 'craft': SAN.ui.openPanel('craft'); return;
      case 'fireplace':
        S().flags.fireplace = !S().flags.fireplace;
        SAN.ui.toast(S().flags.fireplace ? 'You light the fire. The cottage fills with warmth.' : 'You let the fire settle down to embers.', 'info');
        if (S().flags.fireplace) SAN.audio.sfx('water');
        return;
      case 'fountain': A.fountain(); return;
      case 'well': A.well(); return;
      case 'sign': SAN.ui.dialogue({ pages: [{ speaker: 'narrator', text: it.text }] }); return;
      case 'sit': A.sit(p); return;
      case 'rune': SAN.living.rune(p.symbol || 'moth'); return;
      case 'grove': SAN.living.groveGate(); return;
      case 'read': A.readBook(p); return;
      case 'peek': A.peekWindow(p); return;
      case 'music': A.playMusic(p); return;
      case 'birds': A.feedBirds(p); return;
      case 'sunset': A.watchSunset(p); return;
      case 'stargaze': A.stargaze(p); return;
      case 'letter': A.readLetter(p); return;
      case 'camera': SAN.photos.open(); return;
      case 'chest': A.chest(p); return;
      case 'forage': A.forage(p); return;
      case 'memory': A.memoryStone(p); return;
      case 'lamp': A.lighthouseLamp(); return;
      case 'shrine': A.shrine(); return;
      default: return;
    }
  };

  A.sleepConfirm = function () {
    SAN.ui.confirm('Sleep until morning?', 'Your crops will grow, and the day will begin again at 6:00 AM.', function () {
      SAN.time.sleep();
    });
  };

  A.fountain = function () {
    const S_ = S();
    const lines = [
      'The water catches the light and gives it back in pieces. You feel, briefly, like a person with time.',
      'You toss a small pebble in. It does not grant a wish, but the sound is satisfying.',
      'Someone has left flowers at the rim. You add nothing. You are allowed to just look.',
    ];
    if (Math.random() < 0.4) {
      S_.energy = Math.min(S_.maxEnergy, S_.energy + 4);
      SAN.ui.toast('The sound of the water restores a little energy.', 'info');
    }
    SAN.ui.dialogue({ pages: [{ speaker: 'narrator', text: U.pick(lines) }] });
  };

  A.well = function () {
    const S_ = S();
    if (Math.random() < 0.5) {
      SAN.state.addItem('stone', 1, { silent: true });
      SAN.ui.dialogue({ pages: [{ speaker: 'narrator', text: 'You draw up the bucket. It comes back with cold water and a small smooth stone. You keep the stone.' }] });
    } else {
      SAN.ui.dialogue({ pages: [{ speaker: 'narrator', text: 'The well is deep and quiet. For a moment, the whole village is far away.' }] });
    }
  };

  A.shrine = function () {
    const S_ = S();
    if (!S_.flags.shrineBlessed) {
      S_.flags.shrineBlessed = true;
      S_.maxEnergy = 115;
      SAN.ui.dialogue({
        pages: [
          { speaker: 'narrator', text: 'The little shrine in the meadow is warm to the touch. Someone tends it, though you have never seen anyone here.' },
          { speaker: 'narrator', text: 'You leave a flower. The air smells briefly of rain and lilac.' },
          { speaker: 'narrator', text: 'You feel a little more room inside you for long days. (Max energy increased.)' },
        ],
      });
      SAN.audio.sfx('sparkle');
    } else {
      SAN.ui.dialogue({ pages: [{ speaker: 'narrator', text: 'The shrine is quiet. Your flower from before is still there, a little faded and entirely valid.' }] });
    }
  };

  A.chest = function (p) {
    const S_ = S();
    const cid = p.interact.cid;
    if (S_.chests[cid]) {
      SAN.ui.dialogue({ pages: [{ speaker: 'narrator', text: 'The chest is empty now. It still smells of old wood and possibility.' }] });
      return;
    }
    S_.chests[cid] = true;
    SAN.audio.sfx('catch');
    const pages = [{ speaker: 'narrator', text: 'The lid opens with a sound like an old apology.' }];
    (p.interact.loot || []).forEach(([id, qty]) => {
      SAN.state.addItem(id, qty);
      pages.push({ speaker: 'narrator', text: 'You found: ' + SAN.data.item(id).name + ' ×' + qty + '.' });
    });
    SAN.ui.dialogue({ pages });
    SAN.progression.checkAchievements();
  };

  A.forage = function (p) {
    const S_ = S();
    const f = p.interact;
    const key = f.fid + '_' + S_.time.day;
    if (S_.forage[key]) {
      SAN.ui.dialogue({ pages: [{ speaker: 'narrator', text: 'You have already gathered everything here today. It will be back tomorrow, the way small things are.' }] });
      return;
    }
    S_.forage[key] = true;
    SAN.audio.sfx('harvest');
    const items = f.items || ['fiber'];
    const id = items[Math.floor(Math.random() * items.length)];
    SAN.state.addItem(id, 1);
    const flavour = {
      shell: 'A shell, perfectly curled. The sea is generous in small ways.',
      sea_glass: 'Sea glass, green and soft-edged. It survived the ocean and got prettier.',
      star_hook: 'Finn\'s grandfather\'s star-shaped hook, caught between two planks. It glints like it has been waiting.',
      old_photo: 'A faded photograph, half-buried in the sand: two people by a lighthouse, a heart drawn on the back. This is not yours. You think you know whose it is.',
      sea_letter: 'A bottle with a letter inside. It reads: "If you are reading this, the tide brought you something kind."',
      music_box: 'A broken music box. Three notes, then silence, then an attempt at starting again.',
      windmill_note: 'One of Rowan\'s notes. It says: "it is fine, probably" eleven times, then stops.',
      starflower: 'A starflower, growing where nobody planted it.',
      moonpetal: 'A moonpetal, folded shut and waiting for the dark.',
      snowdrop: 'A snowdrop. It only blooms when the world is quiet.',
    };
    SAN.ui.dialogue({
      pages: [
        { speaker: 'narrator', text: 'You search ' + f.name + '.' },
        { speaker: 'narrator', text: flavour[id] || 'You find ' + SAN.data.item(id).name + '.' },
      ],
    });
    SAN.quests.notify('collect', id, 1);
    if (id === 'letter_old') SAN.living.discover('letter_beach');
    if (id === 'letter_unknown') SAN.living.discover('letter_library');
    if (id === 'letter_grove') SAN.living.discover('letter_grove');
    if (id === 'star_hook') SAN.living.discover('secret_cache');
  };

  A.memoryStone = function (p) {
    const S_ = S();
    if (!S_.unlocked.memory_vault) {
      SAN.ui.dialogue({
        pages: [
          { speaker: 'narrator', text: 'A grey stone, ringed by smaller stones. It looks like it has been waiting a long time.' },
          { speaker: 'narrator', text: 'You do not know what to do with it yet. Perhaps the journal on your desk will explain.' },
        ],
      });
      return;
    }
    SAN.ui.openPanel('memories', { idx: p.idx || 0 });
  };

  A.lighthouseLamp = function () {
    const S_ = S();
    const q = S_.quests.active.lh_3;
    if (q && !S_.flags.lamp_lit) {
      S_.flags.lamp_lit = true;
      S_.world.lampLit = true;
      A.lampScene();

  A.speakerName = function (def) { return def ? def.name : ''; };

  A.talkTo = function (npc) {
    const def = npc.def;
    const S_ = S();
    const firstTime = !SAN.rel.get(def.id).met;
    SAN.rel.talk(def.id);
    SAN.rel.get(def.id).met = true;
    SAN.quests.notify('talk', def.id, 1);
    SAN.quests.notify('talk', 'any_npc', 1);
    // story scenes that belong to this exact moment
    if (def.id === 'rowan' && S_.quests.active.wm_3 && !S_.flags.wm_quiet && S_.quests.progressOf('wm_3', 0).done) {
      S_.flags.wm_quiet = true;
      A.windmillScene();
      return;
    }
    const ready = SAN.quests.readyTurnInsFor(def.id);
    if (ready.length) { A.turnInDialogue(ready[0].id); return; }
    if (def.id === 'liora' && S_.quests.active.lh_2 && !S_.flags.lh_letter_choice && SAN.state.count('old_photo') > 0) { A.letterScene(npc); return; }
    if (def.id === 'elowen' && S_.quests.active.gh_1 && !S_.flags.gh_help_choice) { A.helpScene(npc); return; }
    if (def.id === 'rowan' && S_.quests.active.wm_1 && !S_.flags.reframe_choice) { A.reframeScene(npc); return; }
    if (!firstTime) {
      const ms = SAN.living.pendingMilestone(def.id);
      if (ms) { SAN.living.playMilestone(def.id, ms); return; }
    }
    const avail = SAN.quests.availableFor(def.id);
    if (avail) { A.offerQuest(avail); return; }
    A.chat(npc, { firstTime });
  };

  A.greetingFor = function (def) {
    const pts = SAN.rel.pts(def.id);
    const tiers = [0, 21, 41, 61, 81];
    let tier = 0;
    tiers.forEach((t, i) => { if (pts >= t) tier = t; });
    const pool = def.greetings[tier] || def.greetings[0] || ['"Hello."'];
    const festival = SAN.time.todayEvent();
    const lines = [U.pick(pool)];
    if (festival) lines.unshift('"' + festival.name + ' — I always forget how much I like it until it is happening."');
    if (S().time.weather === 'rain' && Math.random() < 0.5) lines.push('"Rain again. I do not mind. It gives everyone permission to stay in."');
    if (S().time.weather === 'snow') lines.push('"Look at the snow. The whole village has gone quiet and polite."');
    const extras = SAN.living.extras(def.id);
    extras.slice(0, 2).forEach((l) => lines.push(l));
    return lines;
  };

  A.chat = function (npc, opts) {
    const def = npc.def;
    const S_ = S();
    const f = SAN.rel.get(def.id);
    const firstMeeting = !!(opts && opts.firstTime);

    const lines = [];
    if (firstMeeting) {
      lines.push({ speaker: def.id, text: 'You must be the one in the cottage on the hill. I heard about you.' });
      lines.push({ speaker: 'player', text: 'All good things, I hope.' });
      lines.push({ speaker: def.id, text: (def.greetings[0] || ['"All things."'])[0] });
    } else {
      A.greetingFor(def).forEach((l) => lines.push({ speaker: def.id, text: l }));
      const reaction = {
        liora: S_.flags.lh_letter_choice ? '"You did not push me about the letters. I keep thinking about that."' : null,
        elowen: S_.flags.sat_with_elowen ? '"You sat with me by the pond. I have not forgotten, you know."' : null,
        rowan: S_.flags.reframe_choice ? '"I used the thing you said. It worked for about an hour. That is a record."' : null,
      }[def.id];
      if (reaction && !S_.dialogueSeen['react_' + def.id]) {
        S_.dialogueSeen['react_' + def.id] = true;
        lines.push({ speaker: def.id, text: reaction });
      }
    }

    const choices = [];
    (def.topics || []).forEach((t) => {
      if (SAN.rel.pts(def.id) >= t.min && !(S_.dialogueSeen[def.id + '_' + t.id])) {
        choices.push({
          label: t.min >= 41 ? 'Ask something closer' : 'Ask about them',
          cb: function () { A.topic(npc, t); },
        });
      }
    });
    choices.push({ label: 'Give a gift', cb: function () { SAN.ui.openPanel('gift', { npcId: def.id }); } });
    choices.push({ label: 'Just talk', cb: function () { A.smallTalk(npc); } });
    choices.push({ label: 'Say goodbye', cb: function () { } });

    SAN.ui.dialogue({ pages: lines, choices });
  };

  A.smallTalk = function (npc) {
    const def = npc.def;
    const line = U.pick(def.daily || ['"It is a good day for nothing in particular."']);
    SAN.ui.dialogue({
      pages: [{ speaker: def.id, text: line }],
      choices: [
        { label: 'Give a gift', cb: function () { SAN.ui.openPanel('gift', { npcId: def.id }); } },
        { label: 'Say goodbye', cb: function () { } },
      ],
    });
  };

  A.topic = function (npc, topic) {
    const def = npc.def;
    const S_ = S();
    S_.dialogueSeen[def.id + '_' + topic.id] = true;
    SAN.rel.add(def.id, 2, true);
    const pages = topic.lines.map((l) => ({ speaker: def.id, text: l }));
    SAN.ui.dialogue({ pages, choices: [{ label: 'Say goodbye', cb: function () { } }] });
  };

  A.giveGift = function (npcId, itemId) {
    const S_ = S();
    const res = SAN.rel.gift(npcId, itemId);
    if (res.tooMany) {
      SAN.ui.dialogue({ pages: [{ speaker: npcId, text: '"You have given me so much today already. Tomorrow, perhaps. I am not going anywhere."' }] });
      return;
    }
    SAN.state.removeItem(itemId, 1);
    if (!S_.world.gifts) S_.world.gifts = {};
    S_.world.gifts[npcId] = itemId;
    SAN.quests.notify('gift', npcId, 1, itemId);
    const def = SAN.data.npcs[npcId];
    const pages = [
      { speaker: npcId, text: res.line || '"Thank you."' },
    ];
    if (res.reaction === 'love') pages.push({ speaker: 'narrator', text: 'Their whole expression changes. You remembered something real. (Friendship +' + res.pts + ')' });
    else if (res.reaction === 'like') pages.push({ speaker: 'narrator', text: 'A good choice. (Friendship +' + res.pts + ')' });
    else if (res.reaction === 'dislike') pages.push({ speaker: 'narrator', text: 'Perhaps not their favourite. They are polite about it. (Friendship ' + res.pts + ')' });
    else pages.push({ speaker: 'narrator', text: '(Friendship +' + res.pts + ')' });
    SAN.ui.dialogue({ pages });
    SAN.save.autosave();
  };
